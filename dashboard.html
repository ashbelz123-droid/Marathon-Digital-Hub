<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDH Dashboard</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<canvas id="network"></canvas>

<!-- HEADER -->
<header class="topbar">

<div class="user">
<div class="avatar">MDH</div>
<div>
<h3>Welcome</h3>
<p>Marathon Digital Hub</p>
</div>
</div>

<div class="bell">
<i class="fas fa-bell"></i>
<span>3</span>
</div>

</header>

<!-- WALLET -->
<section class="wallet">
<h2>Wallet Balance</h2>
<h1>UGX 0</h1>

<div class="wallet-btns">
<button>Deposit</button>
<button>Withdraw</button>
</div>
</section>

<!-- STATS -->
<section class="grid">

<div class="card">
<h3>Deposits</h3>
<p>UGX 0</p>
</div>

<div class="card">
<h3>Withdrawals</h3>
<p>UGX 0</p>
</div>

<div class="card">
<h3>Today</h3>
<p>UGX 0</p>
</div>

<div class="card">
<h3>Team</h3>
<p>0</p>
</div>

</section>

<!-- FEATURE -->
<section class="feature">
<h2>Featured Machine</h2>

<div class="machine">
<h3>B1 Starter</h3>
<p>Price: UGX 100,000</p>
<p>Daily: UGX 7,000</p>
<button>View</button>
</div>
</section>

<!-- TICKER -->
<div class="ticker">
<div class="move">
🚀 Welcome to MDH • 🔥 Earn Daily • 💰 Withdraw Anytime • ⚡ Smart Mining System
</div>
</div>

<!-- NAV -->
<nav class="nav">
<a class="active"><i class="fas fa-home"></i></a>
<a><i class="fas fa-cubes"></i></a>
<a><i class="fas fa-wallet"></i></a>
<a><i class="fas fa-user"></i></a>
</nav>

<script src="assets/js/network.js"></script>

</body>
  </html>

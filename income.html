<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Income | Marathon Digital Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050B18;
color:#fff;
overflow-x:hidden;
padding-bottom:90px;

}

/* Animated Background */

body::before{

content:"";

position:fixed;

left:-40%;
top:-40%;

width:180%;
height:180%;

background:

radial-gradient(circle at 20% 20%,rgba(0,255,255,.15),transparent 35%),

radial-gradient(circle at 80% 20%,rgba(0,120,255,.18),transparent 35%),

radial-gradient(circle at 70% 80%,rgba(0,255,120,.15),transparent 40%);

animation:bgMove 18s linear infinite;

z-index:-2;

}

@keyframes bgMove{

0%{transform:translateX(-2%);}
50%{transform:translateX(2%);}
100%{transform:translateX(-2%);}

}

/* Header */

.header{

padding:22px 16px 10px;

}

.header h2{

font-size:30px;

font-weight:bold;

background:linear-gradient(90deg,#00C8FF,#00FF88);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.header p{

margin-top:5px;

font-size:14px;

color:#9FB5D1;

}

/* Summary */

.summary{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

padding:0 15px;

margin-bottom:14px;

}

.card{

background:#08142D;

border-radius:18px;

padding:16px;

border:1px solid rgba(0,200,255,.15);

}

.card small{

display:block;

color:#9FB5D1;

margin-bottom:8px;

font-size:13px;

}

.card h2{

font-size:22px;

color:#00FF88;

}

/* Section */

.section{

margin:15px;

padding:18px;

background:#08142D;

border-radius:20px;

border:1px solid rgba(0,200,255,.15);

}

.section h3{

margin-bottom:18px;

color:#00FF88;

}

/* Machine Card */

.machineCard{

background:#101E3D;

border-radius:18px;

padding:14px;

margin-bottom:15px;

border:1px solid rgba(255,255,255,.05);

}

.machineTop{

display:flex;

gap:12px;

align-items:center;

margin-bottom:15px;

}

.machineImage{

width:85px;

height:85px;

border-radius:15px;

object-fit:cover;

background:#071123;

}

.machineInfo{

flex:1;

}

.machineName{

font-size:18px;

font-weight:bold;

color:#00FF88;

margin-bottom:5px;

}

.machineSeries{

display:inline-block;

padding:5px 12px;

border-radius:20px;

background:#12385E;

color:#00C8FF;

font-size:11px;

font-weight:bold;

}

.infoRow{

display:flex;

justify-content:space-between;

padding:9px 0;

border-bottom:1px solid rgba(255,255,255,.06);

font-size:14px;

}

.infoTitle{

color:#9FB5D1;

}

.infoValue{

font-weight:bold;

color:#fff;

}

.progress{

height:8px;

background:#1C3156;

border-radius:20px;

overflow:hidden;

margin-top:15px;

}

.progressFill{

height:100%;

width:0;

background:linear-gradient(90deg,#00C8FF,#00FF88);

}

.active{

color:#00FF88;

font-weight:bold;

}

.weekend{

color:#FFC857;

font-weight:bold;

}

.expired{

color:#FF5A5A;

font-weight:bold;

}

.loading{

padding:40px;

text-align:center;

color:#00C8FF;

}

</style>

</head>

<body>

<div class="header">

<h2>Income</h2>

<p>Your mining earnings overview.</p>

</div>

<div class="summary">

<div class="card">

<small>Total Income</small>

<h2 id="totalIncome">UGX 0</h2>

</div>

<div class="card">

<small>Active Machines</small>

<h2 id="activeMachines">0</h2>

</div>

</div>

<div class="summary">

<div class="card">

<small>Daily Income</small>

<h2 id="dailyIncome">UGX 0</h2>

</div>

<div class="card">

<small>Total Return</small>

<h2 id="totalReturn">UGX 0</h2>

</div>

</div>

<div class="section">

<h3>My Machines</h3>

<div id="machineList">

<div class="loading">

Loading your machines...

</div>

</div>

  </div><script>

/* ==========================================
SUPABASE
========================================== */

const db = window.supabaseClient;

let currentUser = null;
let profile = null;
let userMachines = [];

/* ==========================================
START PAGE
========================================== */

document.addEventListener("DOMContentLoaded", init);

async function init(){

try{

const { data:{ user } } = await db.auth.getUser();

if(!user){

window.location.href="login.html";

return;

}

currentUser=user;

await loadProfile();

await loadUserMachines();

}catch(err){

console.log(err);

document.getElementById("machineList").innerHTML=`

<div class="loading">

Unable to load page.

</div>

`;

}

}

/* ==========================================
LOAD PROFILE
========================================== */

async function loadProfile(){

const { data,error } = await db

.from("profiles")

.select("*")

.eq("id",currentUser.id)

.single();

if(error){

console.log(error);

return;

}

profile=data;

}

/* ==========================================
LOAD USER MACHINES
========================================== */

async function loadUserMachines(){

document.getElementById("machineList").innerHTML=`

<div class="loading">

Loading your machines...

</div>

`;

const { data,error } = await db

.from("user_machines")

.select(`

*,

machines(

id,

name,

series,

image_url,

price,

total_return,

duration_days,

is_vip

)

`)

.eq("user_id",currentUser.id)

.order("purchase_date",{ascending:false});

if(error){

console.log(error);

document.getElementById("machineList").innerHTML=`

<div class="loading">

Failed to load your machines.

</div>

`;

return;

}

userMachines=data || [];

renderMachines();

}/* ==========================================
RENDER MACHINES
========================================== */

function renderMachines(){

const container=document.getElementById("machineList");

container.innerHTML="";

if(userMachines.length===0){

container.innerHTML=`

<div class="loading">

You have not purchased any machines yet.

</div>

`;

return;

}

let activeMachines=0;
let totalIncome=0;
let totalReturn=0;
let dailyIncome=0;

const today=new Date();
const isWeekend=(today.getDay()==0 || today.getDay()==6);

userMachines.forEach(item=>{

const machine=item.machines;

if(!machine)return;

const purchaseDate=new Date(item.purchase_date);
const expiryDate=new Date(item.expiry_date);

const expired=today>expiryDate;

const totalReturnMachine=Number(machine.total_return);

const duration=Number(machine.duration_days);

const dailyReturn=totalReturnMachine/duration;

const daysPassed=Math.max(
0,
Math.floor((today-purchaseDate)/(1000*60*60*24))
);

const earned=Math.min(
totalReturnMachine,
dailyReturn*daysPassed
);

const remaining=Math.max(
0,
totalReturnMachine-earned
);

const progress=Math.min(
100,
(earned/totalReturnMachine)*100
);

const daysRemaining=Math.max(
0,
Math.ceil((expiryDate-today)/(1000*60*60*24))
);

const isVIP=machine.is_vip===true;

const weekendDisabled=isWeekend && !isVIP && !expired;

let statusText="🟢 ACTIVE";
let statusClass="active";

if(expired){

statusText="🔴 EXPIRED";
statusClass="expired";

}else if(weekendDisabled){

statusText="🟠 DISABLED (WEEKEND)";
statusClass="weekend";

}

if(!expired){

activeMachines++;

}

totalReturn+=totalReturnMachine;
totalIncome+=earned;

if(!expired && !weekendDisabled){

dailyIncome+=dailyReturn;

}

/* Continue with the card in Part 4 */const image = machine.image_url && machine.image_url.trim() !== ""
? machine.image_url
: "images/default-machine.png";

container.innerHTML += `

<div class="machineCard">

<div class="machineTop">

<img
src="${image}"
class="machineImage"
onerror="this.src='images/default-machine.png'">

<div class="machineInfo">

<div class="machineName">

${machine.name}

</div>

<div class="machineSeries">

${machine.series || "STANDARD"}

</div>

</div>

</div>

<div class="infoRow">

<span class="infoTitle">

Purchase Price

</span>

<span class="infoValue">

UGX ${Number(machine.price).toLocaleString()}

</span>

</div>

<div class="infoRow">

<span class="infoTitle">

Earned

</span>

<span class="infoValue">

UGX ${Math.floor(earned).toLocaleString()}

</span>

</div>

<div class="infoRow">

<span class="infoTitle">

Remaining

</span>

<span class="infoValue">

UGX ${Math.floor(remaining).toLocaleString()}

</span>

</div>

<div class="infoRow">

<span class="infoTitle">

Total Return

</span>

<span class="infoValue">

UGX ${totalReturnMachine.toLocaleString()}

</span>

</div>

<div class="infoRow">

<span class="infoTitle">

Daily Income

</span>

<span class="infoValue">

${weekendDisabled ? "UGX 0" : "UGX " + Math.floor(dailyReturn).toLocaleString()}

</span>

</div>

<div class="infoRow">

<span class="infoTitle">

Days Remaining

</span>

<span class="infoValue">

${expired ? "0 Days" : daysRemaining + " Days"}

</span>

</div>

<div class="infoRow">

<span class="infoTitle">

Status

</span>

<span class="${statusClass}">

${statusText}

</span>

</div>

<div class="progress">

<div
class="progressFill"
style="width:${progress}%">

</div>

</div>

<div style="display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:#9FB5D1;">

<span>

${Math.floor(progress)}% Complete

</span>

<span>

Expires: ${expiryDate.toLocaleDateString()}

</span>

</div>

</div>

`;

});/* ==========================================
UPDATE SUMMARY
========================================== */

document.getElementById("activeMachines").innerHTML=

activeMachines;

document.getElementById("dailyIncome").innerHTML=

"UGX "+Math.floor(dailyIncome).toLocaleString();

document.getElementById("totalIncome").innerHTML=

"UGX "+Math.floor(totalIncome).toLocaleString();

document.getElementById("totalReturn").innerHTML=

"UGX "+Math.floor(totalReturn).toLocaleString();

}

/* ==========================================
END MAIN SCRIPT
========================================== */

</script><!-- ==========================
BOTTOM NAVIGATION
========================== -->

</style>

</body>

</html>

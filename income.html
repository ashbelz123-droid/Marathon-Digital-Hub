.card{

background:#08142d;

padding:18px;

}

.card small{

color:#9fb5d1;

}

}

.section h3{

}

.machineCard{

background:#111f3d;

padding:16px;

border-radius:14px;

margin-bottom:15px;

}

.machineCard h4{

margin-bottom:10px;

}

.machineCard p{

margin:6px 0;

font-size:14px;

}

.active{

color:#00ff88;
font-weight:bold;

}

color:#ff4444;
font-weight:bold;

}

<body>

<div class="header">

<h2>Income</h2>

<p>Your mining earnings overview.</p>

</div>

<div class="summary">

<div class="card">

<small>Total Income</small>

<h2 id="totalIncome">

UGX 0

</h2>

</div>

<div class="card">

<small>Active Machines</small>

<h2 id="activeMachines">

0

</h2>

</div>

</div>

<div class="summary">

<div class="card">

<small>Daily Income</small>

<h2 id="dailyIncome">

UGX 0

</h2>

</div>

<div class="card">

<small>Total Return</small>

<h2 id="totalReturn">

UGX 0

</h2>

</div>

</div>

<div class="section">

<h3>My Machines</h3>

<div id="machineList">

Loading...

</div>

  </div><script>

const db = window.supabaseClient;

let currentUser = null;
let profile = null;

/* =====================================
START
===================================== */

document.addEventListener("DOMContentLoaded", async ()=>{

const { data:{ user } } = await db.auth.getUser();

if(!user){

window.location.href="login.html";
return;

}

currentUser=user;

await loadProfile();
await loadMyMachines();

});

/* =====================================
LOAD PROFILE
===================================== */

async function loadProfile(){

const { data,error } = await db

.from("profiles")

.select("*")

.eq("id",currentUser.id)

.single();

if(error){

console.log(error);
return;

}

profile=data;

}

/* =====================================
LOAD USER MACHINES
===================================== */

async function loadMyMachines(){

const { data,error } = await db

.from("user_machines")

.select(`
*,
machines(
id,
name,
price,
total_return,
duration_days
)
`)

.eq("user_id",currentUser.id)

.order("purchase_date",{ascending:false});

if(error){

console.log(error);
return;

}

const container=document.getElementById("machineList");

container.innerHTML="";

if(data.length===0){

container.innerHTML=`

<div class="machineCard">

You have not purchased any machine yet.

</div>

`;

return;

}

let activeCount=0;
let totalReturn=0;
let totalIncome=0;
let dailyIncome=0;

data.forEach(item=>{

const machine=item.machines;

const purchase=new Date(item.purchase_date);
const expiry=new Date(item.expiry_date);

const today=new Date();

const active=today<=expiry;

if(active){

activeCount++;

}

const machineReturn=Number(machine.total_return);

totalReturn+=machineReturn;

/* Estimated income */

const estimatedDaily=machineReturn/Number(machine.duration_days);

dailyIncome+=estimatedDaily;

const passedDays=Math.max(

0,

Math.floor((today-purchase)/(1000*60*60*24))

);

const earned=Math.min(

machineReturn,

estimatedDaily*passedDays

);

totalIncome+=earned;

container.innerHTML+=`

<div class="machineCard">

<h4>${machine.name}</h4>

<p>

Purchase Price:

UGX ${Number(machine.price).toLocaleString()}

</p>

<p>

Total Return:

UGX ${machineReturn.toLocaleString()}

</p>

<p>

Duration:

${machine.duration_days} Days

</p>

<p>

Purchase Date:

${purchase.toLocaleDateString()}

</p>

<p>

Expiry Date:

${expiry.toLocaleDateString()}

</p>

<p>

Status:

<span class="${active?'active':'expired'}">

${active?'ACTIVE':'EXPIRED'}

</span>

</p>

</div>

`;

});

/* Summary */

document.getElementById("activeMachines").innerHTML=activeCount;

document.getElementById("dailyIncome").innerHTML=

"UGX "+Math.floor(dailyIncome).toLocaleString();

document.getElementById("totalReturn").innerHTML=

"UGX "+totalReturn.toLocaleString();

document.getElementById("totalIncome").innerHTML=

"UGX "+Math.floor(totalIncome).toLocaleString();

}

  </script>

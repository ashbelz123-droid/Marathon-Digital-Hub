<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Income | Marathon Digital Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050B18;
color:#fff;
overflow-x:hidden;
padding-bottom:90px;

}

/* Animated Background */

body::before{

content:"";

position:fixed;

left:-40%;
top:-40%;

width:180%;
height:180%;

background:

radial-gradient(circle at 20% 20%,rgba(0,255,255,.15),transparent 35%),

radial-gradient(circle at 80% 20%,rgba(0,120,255,.18),transparent 35%),

radial-gradient(circle at 70% 80%,rgba(0,255,120,.12),transparent 40%);

animation:bgMove 18s linear infinite;

z-index:-2;

}

@keyframes bgMove{

0%{transform:translateX(-2%);}
50%{transform:translateX(2%);}
100%{transform:translateX(-2%);}

}

/* Header */

.header{

padding:22px 16px 12px;

}

.header h2{

font-size:32px;

font-weight:bold;

background:linear-gradient(90deg,#00C8FF,#00FF88);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.header p{

margin-top:6px;

color:#9FB5D1;

}

/* Summary */

.summary{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

padding:0 15px;

margin-bottom:15px;

}

.card{

background:#08142D;

border:1px solid rgba(0,200,255,.15);

border-radius:18px;

padding:16px;

}

.card small{

display:block;

color:#9FB5D1;

margin-bottom:8px;

}

.card h2{

font-size:24px;

color:#00FF88;

}

/* Machine Section */

.section{

margin:15px;

background:#08142D;

border:1px solid rgba(0,200,255,.15);

border-radius:20px;

padding:18px;

}

.section h3{

color:#00FF88;

margin-bottom:18px;

}

#machineList{

display:flex;

flex-direction:column;

gap:15px;

}

.loading{

text-align:center;

padding:40px;

color:#00C8FF;

}

</style>

</head>

<body>

<div class="header">

<h2>Income</h2>

<p>Your mining earnings overview.</p>

</div>

<div class="summary">

<div class="card">

<small>Total Income</small>

<h2 id="totalIncome">UGX 0</h2>

</div>

<div class="card">

<small>Active Machines</small>

<h2 id="activeMachines">0</h2>

</div>

</div>

<div class="summary">

<div class="card">

<small>Daily Income</small>

<h2 id="dailyIncome">UGX 0</h2>

</div>

<div class="card">

<small>Total Return</small>

<h2 id="totalReturn">UGX 0</h2>

</div>

</div>

<div class="section">

<h3>My Machines</h3>

<div id="machineList">

<div class="loading">

Loading your machines...

</div>

</div>

  </div><script>

/* ===============================
SUPABASE
=============================== */

const db = window.supabaseClient;

let currentUser = null;
let profile = null;

/* ===============================
START PAGE
=============================== */

document.addEventListener("DOMContentLoaded", init);

async function init(){

try{

const { data:{ user } } = await db.auth.getUser();

if(!user){

window.location.href="login.html";

return;

}

currentUser=user;

await loadProfile();

await loadUserMachines();

}catch(err){

console.log(err);

document.getElementById("machineList").innerHTML=`

<div class="loading">

Something went wrong.

</div>

`;

}

}

/* ===============================
LOAD PROFILE
=============================== */

async function loadProfile(){

const { data,error } = await db

.from("profiles")

.select("*")

.eq("id",currentUser.id)

.single();

if(error){

console.log(error);

return;

}

profile=data;

}/* ===============================
LOAD USER MACHINES
=============================== */

let userMachines=[];

async function loadUserMachines(){

document.getElementById("machineList").innerHTML=`

<div class="loading">

Loading your machines...

</div>

`;

const { data,error } = await db

.from("user_machines")

.select(`

*,

machines(

id,

name,

series,

image_url,

price,

total_return,

duration_days

)

`)

.eq("user_id",currentUser.id)

.order("purchase_date",{ascending:false});

if(error){

console.log(error);

document.getElementById("machineList").innerHTML=`

<div class="loading">

Failed to load machines.

</div>

`;

return;

}

userMachines=data || [];

/* Continue in Part 4 */

renderMachines();

}

/* Update init() *//* ===============================
RENDER MACHINES
=============================== */

function renderMachines(){

const container=document.getElementById("machineList");

container.innerHTML="";

if(userMachines.length===0){

container.innerHTML=`

<div class="loading">

You have not purchased any machines yet.

</div>

`;

return;

}

userMachines.forEach(item=>{

const machine=item.machines;

if(!machine)return;

const purchaseDate=new Date(item.purchase_date);

const expiryDate=new Date(item.expiry_date);

container.innerHTML+=`

<div class="machineCard">

<div class="machineTop">

<img
src="${machine.image_url || 'images/default-machine.png'}"
class="machineImage"
onerror="this.src='images/default-machine.png'">

<div class="machineInfo">

<div class="machineName">

${machine.name}

</div>

<div class="machineSeries">

${machine.series || "STANDARD"}

</div>

</div>

</div>

<div class="machineBody">

<div class="infoRow">

<span class="infoTitle">

Purchase Price

</span>

<span class="infoValue">

UGX ${Number(machine.price).toLocaleString()}

</span>

</div>

<div class="infoRow">

<span class="infoTitle">

Total Return

</span>

<span class="infoValue">

UGX ${Number(machine.total_return).toLocaleString()}

</span>

</div>

<div class="infoRow">

<span class="infoTitle">

Duration

</span>

<span class="infoValue">

${machine.duration_days} Days

</span>

</div>

<div class="infoRow">

<span class="infoTitle">

Purchase Date

</span>

<span class="infoValue">

${purchaseDate.toLocaleDateString()}

</span>

</div>

<div class="infoRow">

<span class="infoTitle">

Expiry Date

</span>

<span class="infoValue">

${expiryDate.toLocaleDateString()}

</span>

</div>

</div>

</div>

`;

});

    }

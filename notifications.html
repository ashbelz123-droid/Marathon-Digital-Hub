<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#06130f">
<title>Notifications | Marathon Digital Hub</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>
<main>
<header class="header fade-in"><p style="color:var(--primary);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase">Marathon Digital Hub</p><h1>Notifications</h1><p style="color:var(--muted);margin-top:8px">Your account activities and important announcements.</p></header>
<section id="notificationList"><div class="notification-card"><div class="loader"></div></div></section>
</main>
<nav class="bottom-nav"><a href="dashboard.html">🏠<br>Home</a><a href="machines.html">⚙️<br>Machines</a><a href="deposit.html">💳<br>Deposit</a><a href="income.html">📈<br>Income</a><a href="profile.html">👤<br>Profile</a></nav>
<script>
const db=window.supabaseClient;let currentUser=null;
document.addEventListener('DOMContentLoaded',async()=>{const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}currentUser=user;await loadNotifications();await markAsRead()});
async function loadNotifications(){const c=document.getElementById('notificationList');c.innerHTML='<div class="notification-card"><div class="loader"></div></div>';const [{data:userData,error:userError},{data:globalData,error:globalError}]=await Promise.all([db.from('user_notifications').select('*').eq('user_id',currentUser.id),db.from('notifications').select('*').eq('is_active',true)]);if(userError||globalError){c.innerHTML='<div class="notification-card"><h3>Unable to load notifications</h3><p>Please try again later.</p></div>';return}const all=[...(userData||[]).map(n=>({...n,unread:!n.is_read})),...(globalData||[]).map(n=>({...n,unread:false}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));if(!all.length){c.innerHTML='<div class="notification-card"><h3>No notifications</h3><p>You are all caught up.</p></div>';return}c.innerHTML=all.map(n=>{let type=(n.type||'info').toLowerCase();if(!['success','warning','error','promotion','info'].includes(type))type='info';return `<article class="notification-card fade-in"><span class="badge badge-${type==='error'?'danger':type==='warning'?'warning':'success'}">${type.toUpperCase()}</span>${n.unread?'<span class="badge badge-danger" style="float:right">NEW</span>':''}<h3>${escapeHtml(n.title||'Notification')}</h3><p>${escapeHtml(n.message||'')}</p><div class="time">${new Date(n.created_at).toLocaleString()}</div></article>`}).join('')}
async function markAsRead(){await db.from('user_notifications').update({is_read:true}).eq('user_id',currentUser.id).eq('is_read',false)}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script>
</body>
</html>

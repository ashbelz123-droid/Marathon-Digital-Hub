<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Notifications | Marathon Digital Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050B18;
color:#fff;
padding-bottom:90px;

}

body::before{

content:"";

position:fixed;

left:-40%;
top:-40%;

width:180%;
height:180%;

background:

radial-gradient(circle at 20% 20%,rgba(0,255,255,.18),transparent 35%),

radial-gradient(circle at 80% 20%,rgba(0,120,255,.18),transparent 35%),

radial-gradient(circle at 60% 80%,rgba(0,255,120,.15),transparent 40%);

animation:bgMove 18s linear infinite;

z-index:-2;

}

@keyframes bgMove{

0%{transform:translateX(-2%);}
50%{transform:translateX(2%);}
100%{transform:translateX(-2%);}

}

.header{

padding:20px;

}

.header h2{

font-size:28px;

}

.header p{

margin-top:5px;

color:#9fb5d1;

}

#notificationList{

padding:15px;

}

.notification{

background:#08142d;

border-radius:18px;

padding:18px;

margin-bottom:15px;

border:1px solid rgba(0,200,255,.15);

position:relative;

}

.notification h3{

font-size:18px;

margin-bottom:8px;

}

.notification p{

color:#d8e4f3;

line-height:1.6;

margin-bottom:10px;

}

.time{

font-size:12px;

color:#9fb5d1;

}

.badge{

display:inline-block;

padding:5px 12px;

border-radius:20px;

font-size:11px;

font-weight:bold;

margin-bottom:10px;

}

.success{

background:#00c853;

}

.warning{

background:#ff9800;

color:#000;

}

.error{

background:#ff3b30;

}

.info{

background:#2196f3;

}

.promotion{

background:#9c27b0;

}

.unread{

position:absolute;

right:15px;

top:15px;

width:12px;

height:12px;

border-radius:50%;

background:#ff3b30;

}

.empty{

background:#08142d;

padding:25px;

border-radius:18px;

text-align:center;

color:#9fb5d1;

}

.bottom-nav{

position:fixed;

left:0;

bottom:0;

width:100%;

height:70px;

background:#08142d;

display:flex;

justify-content:space-around;

align-items:center;

border-top:1px solid rgba(255,255,255,.08);

}

.bottom-nav a{

text-decoration:none;

color:#cfd8ea;

display:flex;

flex-direction:column;

align-items:center;

font-size:12px;

}

.bottom-nav a.active{

color:#00ff88;

font-weight:bold;

}

.bottom-nav i{

font-style:normal;

font-size:24px;

margin-bottom:4px;

}

</style>

</head>

<body>

<div class="header">

<h2>Notifications</h2>

<p>All your account activities and announcements.</p>

</div>

<div id="notificationList">

<div class="empty">

Loading notifications...

</div>

</div>

<div class="bottom-nav">

<a href="dashboard.html">

<i>🏠</i>

<span>Home</span>

</a>

<a href="machines.html">

<i>⚙️</i>

<span>Machines</span>

</a>

<a href="deposit.html">

<i>💳</i>

<span>Deposit</span>

</a>

<a href="notifications.html" class="active">

<i>🔔</i>

<span>Notifications</span>

</a>

<a href="profile.html">

<i>👤</i>

<span>Profile</span>

</a>

</div><script>

const db = window.supabaseClient;

let currentUser=null;

document.addEventListener("DOMContentLoaded",async()=>{

const {data:{user}}=await db.auth.getUser();

if(!user){

window.location.href="login.html";
return;

}

currentUser=user;

await loadNotifications();

await markAsRead();

});

/* ===========================
LOAD ALL NOTIFICATIONS
=========================== */

async function loadNotifications(){

const container=document.getElementById("notificationList");

container.innerHTML="<div class='empty'>Loading...</div>";

/* PERSONAL */

const {data:userData,error:userError}=await db

.from("user_notifications")

.select("*")

.eq("user_id",currentUser.id);

/* GLOBAL */

const {data:globalData,error:globalError}=await db

.from("notifications")

.select("*")

.eq("is_active",true);

if(userError || globalError){

container.innerHTML="<div class='empty'>Failed to load notifications.</div>";

return;

}

/* Merge */

let all=[];

/* Personal */

userData.forEach(n=>{

all.push({

title:n.title,

message:n.message,

type:n.type||"info",

created_at:n.created_at,

unread:!n.is_read

});

});

/* Global */

globalData.forEach(n=>{

all.push({

title:n.title,

message:n.message,

type:n.type||"info",

created_at:n.created_at,

unread:false

});

});

/* Sort newest first */

all.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));

container.innerHTML="";

if(all.length===0){

container.innerHTML=`

<div class="empty">

No notifications available.

</div>

`;

return;

}

all.forEach(item=>{

let badge=item.type.toLowerCase();

if(!["success","warning","error","promotion","info"].includes(badge)){

badge="info";

}

container.innerHTML+=`

<div class="notification">

${item.unread?'<div class="unread"></div>':''}

<div class="badge ${badge}">

${badge.toUpperCase()}

</div>

<h3>${item.title}</h3>

<p>${item.message}</p>

<div class="time">

${new Date(item.created_at).toLocaleString()}

</div>

</div>

`;

});

}

/* ===========================
MARK PERSONAL NOTIFICATIONS READ
=========================== */

async function markAsRead(){

await db

.from("user_notifications")

.update({is_read:true})

.eq("user_id",currentUser.id)

.eq("is_read",false);

}

</script>

</body>

  </html>

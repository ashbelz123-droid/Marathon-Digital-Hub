<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050B18;
color:#fff;
padding-bottom:90px;

}

body::before{

content:"";

position:fixed;

left:-40%;
top:-40%;

width:180%;
height:180%;

background:

radial-gradient(circle at 20% 20%,rgba(0,255,255,.18),transparent 35%),

radial-gradient(circle at 80% 20%,rgba(0,120,255,.18),transparent 35%),

radial-gradient(circle at 60% 80%,rgba(0,255,120,.15),transparent 40%);

animation:bgMove 18s linear infinite;

z-index:-2;

}

@keyframes bgMove{

0%{transform:translateX(-2%);}
50%{transform:translateX(2%);}
100%{transform:translateX(-2%);}

}

.header{

padding:20px;

}

.header h2{

font-size:28px;

}

.header p{

margin-top:5px;

color:#9fb5d1;

}

.sectionTitle{

margin:20px;

margin-bottom:10px;

font-size:18px;

color:#00ff88;

}

.notifications{

padding:15px;

}

.card{

background:#08142d;

border-radius:18px;

padding:18px;

margin-bottom:15px;

border:1px solid rgba(0,200,255,.15);

position:relative;

}

.card h3{

margin-bottom:10px;

font-size:18px;

}

.card p{

line-height:1.6;

color:#d7e3f2;

margin-bottom:12px;

}

.date{

font-size:12px;

color:#9fb5d1;

}

.badge{

display:inline-block;

padding:5px 12px;

border-radius:20px;

font-size:11px;

font-weight:bold;

margin-bottom:10px;

}

.success{

background:#00c853;

}

.warning{

background:#ff9800;

color:#000;

}

.error{

background:#ff3b30;

}

.info{

background:#2196f3;

}

.promotion{

background:#9c27b0;

}

.unread{

position:absolute;

right:15px;

top:15px;

width:12px;

height:12px;

background:#ff3b30;

border-radius:50%;

}

.empty{

background:#08142d;

padding:25px;

border-radius:18px;

text-align:center;

color:#9fb5d1;

}

</style>

</head>

<body>

<div class="header">

<h2>Notifications</h2>

<p>Your personal updates and platform announcements.</p>

</div>

<h3 class="sectionTitle">

👤 Personal Notifications

</h3>

<div

class="notifications"

id="personalNotifications">

<div class="empty">

Loading...

</div>

</div>

<h3 class="sectionTitle">

📢 Platform Announcements

</h3>

<div

class="notifications"

id="globalNotifications">

<div class="empty">

Loading...

</div>

</div><script>

const db = window.supabaseClient;

let currentUser = null;

/* ==========================
START
========================== */

document.addEventListener("DOMContentLoaded", async ()=>{

const { data:{ user } } = await db.auth.getUser();

if(!user){

window.location.href="login.html";
return;

}

currentUser=user;

await loadPersonalNotifications();

await loadGlobalNotifications();

await markNotificationsAsRead();

});

/* ==========================
PERSONAL NOTIFICATIONS
========================== */

async function loadPersonalNotifications(){

const { data,error } = await db

.from("user_notifications")

.select("*")

.eq("user_id",currentUser.id)

.order("created_at",{ascending:false});

const container=document.getElementById("personalNotifications");

container.innerHTML="";

if(error){

container.innerHTML='<div class="empty">Failed to load notifications.</div>';

return;

}

if(data.length===0){

container.innerHTML='

<div class="empty">

No personal notifications.

</div>

';

return;

}

data.forEach(item=>{

let badge="info";

switch((item.type||"info").toLowerCase()){

case "success":

badge="success";

break;

case "warning":

badge="warning";

break;

case "error":

badge="error";

break;

case "promotion":

badge="promotion";

break;

default:

badge="info";

}

container.innerHTML+=`

<div class="card">

${!item.is_read?'<div class="unread"></div>':''}

<span class="badge ${badge}">

${item.type||"Info"}

</span>

<h3>${item.title}</h3>

<p>${item.message}</p>

<div class="date">

${new Date(item.created_at).toLocaleString()}

</div>

</div>

`;

});

}

/* ==========================
GLOBAL NOTIFICATIONS
========================== */

async function loadGlobalNotifications(){

const { data,error } = await db

.from("notifications")

.select("*")

.eq("is_active",true)

.order("created_at",{ascending:false});

const container=document.getElementById("globalNotifications");

container.innerHTML="";

if(error){

container.innerHTML='<div class="empty">Failed to load announcements.</div>';

return;

}

if(data.length===0){

container.innerHTML='

<div class="empty">

No announcements available.

</div>

';

return;

}

data.forEach(item=>{

let badge="info";

switch((item.type||"info").toLowerCase()){

case "success":

badge="success";

break;

case "warning":

badge="warning";

break;

case "promotion":

badge="promotion";

break;

default:

badge="info";

}

container.innerHTML+=`

<div class="card">

<span class="badge ${badge}">

${item.type||"Info"}

</span>

<h3>${item.title}</h3>

<p>${item.message}</p>

<div class="date">

${new Date(item.created_at).toLocaleString()}

</div>

</div>

`;

});

}

/* ==========================
MARK AS READ
========================== */

async function markNotificationsAsRead(){

await db

.from("user_notifications")

.update({

is_read:true

})

.eq("user_id",currentUser.id)

.eq("is_read",false);

}

</script>

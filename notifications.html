<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020d12"><title>Notifications | Marathon Digital Hub</title><link rel="stylesheet" href="assets/css/style.css?v=notifications6"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=notifications6"></script></head><body><canvas id="network"></canvas><main class="page"><section class="hero"><small>MARATHON DIGITAL HUB</small><h1>Notifications</h1><p>Account activity and important messages.</p><div class="actions"><button id="enablePush">🔔 Enable Phone Notifications</button><button id="readAll">✓ Mark all as read</button><a class="back" href="profile.html">← Profile</a></div><p id="pushStatus" style="font-size:11px;color:#91afa5;margin-top:10px"></p><p id="readStatus" style="font-size:11px;margin-top:7px"></p></section><section id="notificationList"><div class="notification-card"><div class="loader"></div><p id="loadingText" style="text-align:center">Connecting...</p></div></section></main><script>
(function(){'use strict';
const list=document.getElementById('notificationList'),loadingText=document.getElementById('loadingText'),pushStatus=document.getElementById('pushStatus'),readStatus=document.getElementById('readStatus'),db=window.supabaseClient;let user=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showError(message){list.innerHTML='<div class="notification-card empty"><h3>Unable to load notifications</h3><p>'+esc(message||'Please check your connection and try again.')+'</p><button id="refreshNotifications">Refresh</button></div>';const b=document.getElementById('refreshNotifications');if(b)b.onclick=load}
async function withTimeout(promise,ms){let timer;const timeout=new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('Connection timed out.')),ms)});try{return await Promise.race([promise,timeout])}finally{clearTimeout(timer)}}
function setReadStatus(text,ok){readStatus.textContent=text||'';readStatus.style.color=ok?'#19e889':'#ff7183'}
async function refreshBadge(){try{if(!user)return;const r=await db.from('user_notifications').select('id',{count:'exact',head:true}).eq('user_id',user.id).eq('is_read',false);if(r.error)throw r.error;const count=r.count||0;localStorage.setItem('mdh_unread_notifications',String(count));window.dispatchEvent(new CustomEvent('mdh:notifications-updated',{detail:{count}}));}catch(e){console.warn('Notification unread count:',e)}}
async function markAllUnreadAutomatically(){if(!user)return;try{const r=await db.from('user_notifications').update({is_read:true}).eq('user_id',user.id).eq('is_read',false).select('id');if(r.error)throw r.error;const changed=r.data?.length||0;localStorage.setItem('mdh_unread_notifications','0');window.dispatchEvent(new CustomEvent('mdh:notifications-updated',{detail:{count:0}}));setReadStatus(changed?'✓ Notifications marked as read.':'✓ No unread notifications.',true);return true}catch(e){console.error('Auto mark notifications read:',e);setReadStatus('Could not mark notifications as read.',false);await refreshBadge();return false}}
async function markOne(id,card){try{if(!user||!id)return;const r=await db.from('user_notifications').update({is_read:true}).eq('id',id).eq('user_id',user.id).eq('is_read',false).select('id');if(r.error)throw r.error;if(!r.data||!r.data.length){setReadStatus('This notification was already read.',true)}else{card.classList.remove('unread');const badge=card.querySelector('.badge.new');if(badge)badge.remove();setReadStatus('✓ Message marked as read.',true)}await refreshBadge()}catch(e){console.error('Mark notification read:',e);setReadStatus('Could not mark this message as read. Please try again.',false)}}
async function load(){try{if(!db)throw new Error('Supabase client did not load.');loadingText.textContent='Checking your account...';const sessionResult=await withTimeout(db.auth.getSession(),10000);user=sessionResult?.data?.session?.user;if(!user){location.href='login.html';return}loadingText.textContent='Loading your notifications...';let items=[];const accountResult=await withTimeout(db.from('user_notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false}),10000).catch(e=>({data:[],error:e}));if(!accountResult.error)items=(accountResult.data||[]).map(x=>Object.assign({},x,{source:'ACCOUNT',unread:x.is_read===false}));const announcementResult=await withTimeout(db.from('notifications').select('*').eq('is_active',true).order('created_at',{ascending:false}),10000).catch(e=>({data:[],error:e}));if(!announcementResult.error)items=items.concat((announcementResult.data||[]).map(x=>Object.assign({},x,{source:'ANNOUNCEMENT',unread:false})));items.sort((x,y)=>new Date(y.created_at||0)-new Date(x.created_at||0));if(!items.length){list.innerHTML='<div class="notification-card empty"><h3>You are all caught up</h3><p>No notifications yet. Important account, deposit, withdrawal and referral messages will appear here.</p></div>'}else{list.innerHTML=items.map(n=>'<article class="notification-card '+(n.unread?'unread':'')+'" data-notification-id="'+esc(n.id)+'" data-account-notification="'+(n.source==='ACCOUNT'?'1':'0')+'"><div class="top"><span class="badge">'+esc(n.source||'NOTIFICATION')+'</span>'+(n.unread?'<span class="badge new">NEW</span>':'')+'</div><h3>'+esc(n.title||'MDH Notification')+'</h3><p>'+esc(n.message||n.body||'You have a new update.')+'</p><div class="time">'+(n.created_at?new Date(n.created_at).toLocaleString():'Recently')+'</div></article>').join('');list.querySelectorAll('.notification-card.unread[data-account-notification="1"]').forEach(card=>{card.addEventListener('click',()=>markOne(card.dataset.notificationId,card),{once:true})})}
// Important: the user has opened the notifications page, so every unread user notification is now considered seen/read.
await markAllUnreadAutomatically();
registerPush();
}catch(e){console.error('Notifications load:',e);showError(e?.message==='Connection timed out.'?'The connection took too long. Please try again.':(e?.message||'Connection problem.'))}}
async function mark(){await markAllUnreadAutomatically();list.querySelectorAll('.notification-card.unread').forEach(card=>{card.classList.remove('unread');const badge=card.querySelector('.badge.new');if(badge)badge.remove()})}document.getElementById('readAll').onclick=mark;
function b64ToBytes(base64){const padding='='.repeat((4-base64.length%4)%4),raw=atob((base64+padding).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function registerPush(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window)){pushStatus.textContent='Phone push is not supported by this browser.';return}const reg=await navigator.serviceWorker.register('/service-worker.js',{scope:'/'});const existing=await reg.pushManager.getSubscription();pushStatus.textContent=existing?'Phone notifications are enabled.':'Tap Enable Phone Notifications to receive MDH messages on this phone.'}catch(e){console.warn('Push registration:',e);pushStatus.textContent='Phone notifications can be enabled when supported.'}}
document.getElementById('enablePush').onclick=async function(){try{if(!user)return;if(!('Notification'in window)||!('PushManager'in window))throw new Error('Push notifications are not supported here.');const permission=await Notification.requestPermission();if(permission!=='granted'){pushStatus.textContent='Notification permission was not granted.';return}const reg=await navigator.serviceWorker.register('/service-worker.js',{scope:'/'});let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes('BLWCUTpEN-ZV1DFIw-yAcAJxh9hgtlGdi3oE6iokDHUABTEdiLJbZ1QdxdtldJoqtKPhAky-d3RuJyqUjjBvPTk')});const json=sub.toJSON(),keys=json.keys||{};const result=await db.from('push_subscriptions').upsert({user_id:user.id,endpoint:sub.endpoint,p256dh:keys.p256dh,auth:keys.auth,updated_at:new Date().toISOString()},{onConflict:'endpoint'});if(result.error)throw result.error;pushStatus.textContent='✅ Phone notifications enabled for Marathon Digital Hub.'}catch(e){console.error('Push setup:',e);pushStatus.textContent='Could not enable phone notifications: '+(e.message||'Try again.')}};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load);else load();setTimeout(()=>{if(list.querySelector('#loadingText'))showError('The notification page did not finish loading. Tap Refresh to try again.')},15000);
})();
</script><style>html,body{margin:0;min-height:100%;background:#020d12;color:#effff7;font-family:Inter,system-ui,sans-serif}.page{position:relative;z-index:1;width:100%;max-width:720px;margin:auto;padding:18px 14px 40px;box-sizing:border-box}.hero,.notification-card{background:rgba(6,42,37,.78);border:1px solid rgba(25,232,137,.2);box-shadow:0 18px 50px #0008,inset 0 1px #ffffff08;backdrop-filter:blur(18px);border-radius:22px}.hero{padding:23px;margin-bottom:14px}.hero small{color:#19e889;font-weight:900;letter-spacing:.12em}.hero h1{font-size:29px;margin:7px 0}.hero p,.notification-card p{color:#91afa5;line-height:1.65;font-size:13px}.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.actions button,.back{border:0;border-radius:13px;padding:12px 15px;font-weight:900;font-size:11px;text-decoration:none}.actions button{background:#19e889;color:#02170d}.back{background:#19e88912;color:#19e889;border:1px solid #19e88933}.notification-card{padding:18px;margin-bottom:10px;cursor:pointer}.notification-card.unread{border-color:#19e88966}.top{display:flex;justify-content:space-between}.badge{padding:6px 9px;border-radius:999px;font-size:9px;font-weight:900;background:#19e88918;color:#19e889}.badge.new{background:#ff54701c;color:#ff7183}.notification-card h3{font-size:16px;margin:12px 0 6px}.time{color:#627d75;font-size:10px;margin-top:12px}.empty{text-align:center;padding:35px 18px;cursor:default}.loader{width:24px;height:24px;border:3px solid #19e88922;border-top-color:#19e889;border-radius:50%;margin:10px auto;animation:spin .8s linear infinite}#refreshNotifications{border:0;border-radius:13px;padding:12px 18px;background:#19e889;color:#02170d;font-weight:900}@keyframes spin{to{transform:rotate(360deg)}}#network{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}</style></body></html>

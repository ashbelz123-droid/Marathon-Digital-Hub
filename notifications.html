<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050B18;
color:#fff;
padding-bottom:90px;
overflow-x:hidden;

}

body::before{

content:"";

position:fixed;

left:-40%;
top:-40%;

width:180%;
height:180%;

background:

radial-gradient(circle at 20% 20%,rgba(0,255,255,.18),transparent 35%),

radial-gradient(circle at 80% 20%,rgba(0,140,255,.18),transparent 35%),

radial-gradient(circle at 60% 80%,rgba(0,255,120,.15),transparent 40%);

animation:bgMove 20s linear infinite;

z-index:-2;

}

@keyframes bgMove{

0%{transform:translateX(-2%);}
50%{transform:translateX(2%);}
100%{transform:translateX(-2%);}

}

.header{

padding:20px;

}

.header h2{

font-size:28px;

}

.header p{

margin-top:5px;

color:#9fb5d1;

}

.notifications{

padding:15px;

}

.card{

background:#08142d;

border-radius:18px;

padding:18px;

margin-bottom:15px;

border:1px solid rgba(0,200,255,.15);

}

.badge{

display:inline-block;

padding:5px 12px;

border-radius:20px;

font-size:12px;

font-weight:bold;

margin-bottom:10px;

}

.info{

background:#0099ff;

}

.success{

background:#00cc66;

}

.warning{

background:#ff9900;

color:#000;

}

.promotion{

background:#cc00ff;

}

.card h3{

margin-bottom:10px;

}

.card p{

line-height:1.6;

color:#d8e4f3;

margin-bottom:12px;

}

.date{

font-size:12px;

color:#9fb5d1;

}

</style>

</head>

<body>

<div class="header">

<h2>Notifications</h2>

<p>Latest announcements from Marathon Digital Hub.</p>

</div>

<div

class="notifications"

id="notificationList">

Loading notifications...

</div><script>

const db = window.supabaseClient;

let currentUser = null;

/* ===========================
START
=========================== */

document.addEventListener("DOMContentLoaded", async ()=>{

const { data:{ user } } = await db.auth.getUser();

if(!user){

window.location.href="login.html";
return;

}

currentUser=user;

await loadNotifications();

});

/* ===========================
LOAD NOTIFICATIONS
=========================== */

async function loadNotifications(){

const { data,error } = await db

.from("notifications")

.select("*")

.eq("is_active",true)

.order("created_at",{ascending:false});

if(error){

console.log(error);

return;

}

const container=document.getElementById("notificationList");

container.innerHTML="";

if(data.length===0){

container.innerHTML=`

<div class="card">

<h3>No Notifications</h3>

<p>There are no announcements at the moment.</p>

</div>

`;

return;

}

data.forEach(item=>{

let badge="info";

if(item.type){

switch(item.type.toLowerCase()){

case "success":

badge="success";

break;

case "warning":

badge="warning";

break;

case "promotion":

badge="promotion";

break;

default:

badge="info";

}

}

container.innerHTML+=`

<div class="card">

<span class="badge ${badge}">

${item.type || "Info"}

</span>

<h3>

${item.title}

</h3>

<p>

${item.message}

</p>

<div class="date">

${new Date(item.created_at).toLocaleString()}

</div>

</div>

`;

});

}

</script>

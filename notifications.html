<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020d12"><title>Notifications | Marathon Digital Hub</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>html,body{margin:0;min-height:100%;background:#020d12;color:#effff7;font-family:Inter,system-ui,sans-serif}#network{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}.page{position:relative;z-index:1;width:100%;max-width:720px;margin:auto;padding:18px 14px 110px;box-sizing:border-box}.hero,.notification-card{background:rgba(6,42,37,.72);border:1px solid rgba(25,232,137,.18);box-shadow:0 18px 50px #0008,inset 0 1px #ffffff08;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px}.hero{padding:23px;margin-bottom:14px}.hero small{color:#19e889;font-weight:900;letter-spacing:.12em}.hero h1{font-size:29px;margin:7px 0}.hero p,.notification-card p{color:#91afa5;line-height:1.65;font-size:13px}.actions{display:flex;gap:9px;margin-top:16px}.actions button,.back{border:0;border-radius:13px;padding:12px 15px;font-weight:900;font-size:11px;text-decoration:none}.actions button{background:#19e889;color:#02170d}.back{background:#19e88912;color:#19e889;border:1px solid #19e88922}.notification-card{padding:18px;margin-bottom:10px;position:relative}.notification-card.unread{border-color:rgba(25,232,137,.45);box-shadow:0 0 28px rgba(25,232,137,.08),0 18px 50px #0008}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:9px;font-weight:900;background:#19e88912;color:#19e889}.badge.new{background:#ff54701c;color:#ff7183}.notification-card h3{font-size:16px;margin:12px 0 6px}.time{color:#627d75;font-size:10px;margin-top:12px}.empty{text-align:center;padding:32px 18px}.loader{width:24px;height:24px;border:3px solid #19e88922;border-top-color:#19e889;border-radius:50%;margin:10px auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.bottom-nav{position:fixed;z-index:5;left:50%;bottom:14px;transform:translateX(-50%);width:min(92vw,560px);display:grid;grid-template-columns:repeat(5,1fr);padding:9px;background:rgba(2,17,22,.9);border:1px solid #19e88918;border-radius:24px;box-shadow:0 18px 45px #000b;backdrop-filter:blur(18px)}.bottom-nav a{color:#829690;text-decoration:none;text-align:center;font-size:10px;font-weight:700;line-height:1.6;padding:5px;border-radius:14px}.bottom-nav a:last-child{color:#19e889;background:#19e8890d}</style></head><body><canvas id="network"></canvas><main class="page"><section class="hero"><small>MARATHON DIGITAL HUB</small><h1>Notifications</h1><p>Account activity and important messages. Your unread count is based on messages that have not been opened.</p><div class="actions"><button id="readAll">Mark all as read</button><a class="back" href="profile.html">← Profile</a></div></section><section id="notificationList"><div class="notification-card"><div class="loader"></div></div></section></main><nav class="bottom-nav"><a href="dashboard.html">🏠<br>Home</a><a href="machines.html">⚙️<br>Machines</a><a href="deposit.html">＋<br>Deposit</a><a href="support.html">♡<br>Support</a><a href="profile.html">●<br>Profile</a></nav><script>const db=window.supabaseClient;let currentUser=null;document.addEventListener('DOMContentLoaded',init);async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}currentUser=user;await loadNotifications()}async function loadNotifications(){const c=document.getElementById('notificationList');c.innerHTML='<div class="notification-card"><div class="loader"></div></div>';const[{data:userData,error:userError},{data:globalData,error:globalError}]=await Promise.all([db.from('user_notifications').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false}),db.from('notifications').select('*').eq('is_active',true).order('created_at',{ascending:false})]);if(userError||globalError){console.error(userError||globalError);c.innerHTML='<div class="notification-card empty"><h3>Unable to load notifications</h3><p>Please refresh and try again.</p></div>';return}const userItems=(userData||[]).map(n=>({...n,source:'account',unread:n.is_read===false}));const globalItems=(globalData||[]).map(n=>({...n,source:'announcement',unread:false}));const all=[...userItems,...globalItems].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));if(!all.length){c.innerHTML='<div class="notification-card empty"><h3>You're all caught up</h3><p>There are no notifications for your account right now.</p></div>';return}c.innerHTML=all.map(n=>{let type=String(n.type||'info').toLowerCase();if(!['success','warning','error','promotion','info'].includes(type))type='info';return `<article class="notification-card ${n.unread?'unread':''}"><div class="top"><span class="badge">${n.source==='announcement'?'ANNOUNCEMENT':type.toUpperCase()}</span>${n.unread?'<span class="badge new">NEW</span>':''}</div><h3>${escapeHtml(n.title||'Notification')}</h3><p>${escapeHtml(n.message||'')}</p><div class="time">${new Date(n.created_at).toLocaleString()}</div></article>`}).join('')}async function markAllRead(){if(!currentUser)return;const{error}=await db.from('user_notifications').update({is_read:true}).eq('user_id',currentUser.id).eq('is_read',false);if(error){console.error(error);return}await loadNotifications();try{localStorage.setItem('mdhNotificationsReadAt',String(Date.now()))}catch(e){}}document.getElementById('readAll').addEventListener('click',markAllRead);function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}const c=document.getElementById('network'),x=c.getContext('2d');let nodes=[];function reset(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;c.style.width='100vw';c.style.height='100vh';x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);nodes=Array.from({length:innerWidth<500?52:78},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.45}))}function draw(){x.clearRect(0,0,innerWidth,innerHeight);for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const d=Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y);if(d<190){x.strokeStyle='rgba(25,232,137,'+((1-d/190)*.4)+')';x.lineWidth=1.1;x.beginPath();x.moveTo(nodes[i].x,nodes[i].y);x.lineTo(nodes[j].x,nodes[j].y);x.stroke()}}nodes.forEach(a=>{x.fillStyle='rgba(25,232,137,.8)';x.beginPath();x.arc(a.x,a.y,1.6,0,Math.PI*2);x.fill();a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>innerWidth)a.vx*=-1;if(a.y<0||a.y>innerHeight)a.vy*=-1});requestAnimationFrame(draw)}reset();draw();addEventListener('resize',reset)</script></body></html>

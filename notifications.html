<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020d12"><title>Notifications | Marathon Digital Hub</title><link rel="stylesheet" href="assets/css/style.css?v=notifications7"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=notifications7"></script></head><body><canvas id="network"></canvas><main class="page"><header class="top"><div><small>MARATHON DIGITAL HUB</small><h1>Messages</h1></div><a class="profile" href="profile.html">Profile</a></header><section class="inbox-head"><span>Inbox</span><strong id="unreadText">0 unread</strong></section><section id="notificationList"><div class="row loading"><div class="avatar">MDH</div><div><strong>Loading messages…</strong><small>Connecting securely</small></div></div></section></main><script>(async function(){'use strict';const db=window.supabaseClient,list=document.getElementById('notificationList'),unreadText=document.getElementById('unreadText');let user=null;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setBadge(n){localStorage.setItem('mdh_unread_notifications',String(n));unreadText.textContent=n+' unread';window.dispatchEvent(new CustomEvent('mdh:notifications-updated',{detail:{count:n}}))}async function load(){try{if(!db)throw new Error('Supabase client did not load.');const {data:{user:u}}=await db.auth.getUser();user=u;if(!user){location.href='login.html';return}const r=await db.from('user_notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(r.error)throw r.error;const items=r.data||[],unread=items.filter(n=>n.is_read===false).length;setBadge(unread);if(!items.length){list.innerHTML='<div class="empty"><div class="empty-icon">✓</div><h2>No messages yet</h2><p>Important Marathon Digital Hub updates will appear here.</p></div>';return}list.innerHTML=items.map(n=>'<a class="row '+(n.is_read===false?'unread':'')+'" href="notification-message.html?id='+encodeURIComponent(n.id)+'"><div class="avatar">MDH</div><div class="content"><div class="line"><strong>Marathon Digital Hub</strong><time>'+formatTime(n.created_at)+'</time></div><div class="subject">'+esc(n.title||'MDH Notification')+'</div><div class="preview">'+esc(n.message||n.body||'You have a new update.')+'</div></div>'+(n.is_read===false?'<span class="dot"></span>':'')+'</a>').join('')}catch(e){console.error(e);list.innerHTML='<div class="empty"><div class="empty-icon">!</div><h2>Unable to load messages</h2><p>'+esc(e.message||'Please try again.')+'</p><button onclick="location.reload()">Refresh</button></div>'}}function formatTime(v){if(!v)return '';const d=new Date(v),now=new Date();if(d.toDateString()===now.toDateString())return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString([], {day:'numeric',month:'short'})}load();})();</script><style>html,body{margin:0;min-height:100%;background:#020d12;color:#effff7;font-family:Inter,system-ui,sans-serif}.page{width:min(720px,100%);margin:auto;padding:16px 13px 35px;box-sizing:border-box}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.top small{color:#19e889;font-size:9px;font-weight:900;letter-spacing:.1em}.top h1{margin:5px 0 0;font-size:27px}.profile{color:#19e889;text-decoration:none;font-size:10px;font-weight:900;padding:10px 13px;border-radius:12px;background:#19e88912;border:1px solid #19e88933}.inbox-head{display:flex;justify-content:space-between;align-items:center;padding:11px 5px;color:#8eafa5;font-size:11px}.inbox-head strong{color:#19e889;font-size:9px}.row{position:relative;display:flex;align-items:center;gap:12px;margin-bottom:7px;padding:14px 13px;text-decoration:none;color:inherit;border-radius:18px;border:1px solid rgba(112,255,203,.13);background:linear-gradient(145deg,rgba(23,104,84,.22),rgba(4,38,40,.32));box-shadow:0 10px 30px rgba(0,0,0,.18);backdrop-filter:blur(14px);transition:.15s}.row:active{transform:scale(.985)}.row.unread{border-color:rgba(25,232,137,.42);background:linear-gradient(145deg,rgba(23,104,84,.32),rgba(4,38,40,.4))}.avatar{flex:0 0 45px;width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:#19e88918;border:1px solid #19e8893b;color:#19e889;font-size:10px;font-weight:900}.content{min-width:0;flex:1}.line{display:flex;justify-content:space-between;gap:8px}.line strong{font-size:12px;white-space:nowrap}.line time{color:#668c82;font-size:9px;white-space:nowrap}.subject{margin-top:5px;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{margin-top:4px;color:#779b91;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:#19e889;box-shadow:0 0 10px #19e88966}.empty{text-align:center;padding:70px 20px;color:#91afa5}.empty h2{color:#effff7;font-size:18px}.empty p{font-size:11px;line-height:1.6}.empty-icon{margin:auto;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#19e889;background:#19e88912;border:1px solid #19e88933;font-weight:900;font-size:20px}.empty button{border:0;border-radius:12px;padding:12px 18px;background:#19e889;color:#02170d;font-weight:900}</style></body></html>

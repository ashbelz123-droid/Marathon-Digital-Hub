<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020d12"><title>Notifications | Marathon Digital Hub</title><link rel="stylesheet" href="assets/css/style.css?v=notifications3"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=notifications3"></script></head><body><canvas id="network"></canvas><main class="page"><section class="hero"><small>MARATHON DIGITAL HUB</small><h1>Notifications</h1><p>Account activity and important messages.</p><div class="actions"><button id="enablePush">🔔 Enable Phone Notifications</button><button id="readAll">✓ Mark all as read</button><a class="back" href="profile.html">← Profile</a></div><p id="pushStatus" style="font-size:11px;color:#91afa5;margin-top:10px"></p></section><section id="notificationList"><div class="notification-card"><div class="loader"></div><p style="text-align:center">Connecting...</p></div></section></main><script>
const db=window.supabaseClient;const VAPID_PUBLIC='BLWCUTpEN-ZV1DFIw-yAcAJxh9hgtlGdi3oE6iokDHUABTEdiLJbZ1QdxdtldJoqtKPhAky-d3RuJyqUjjBvPTk';let user=null;const list=document.getElementById('notificationList'),pushStatus=document.getElementById('pushStatus');
document.addEventListener('DOMContentLoaded',load);
function esc(v){return String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
async function load(){try{if(!db)throw Error('Supabase client missing');const s=await db.auth.getSession();user=s.data.session?.user;if(!user){location.href='login.html';return}let items=[];const a=await db.from('user_notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(!a.error)items=(a.data||[]).map(x=>({...x,source:'ACCOUNT',unread:x.is_read===false}));const b=await db.from('notifications').select('*').eq('is_active',true).order('created_at',{ascending:false});if(!b.error)items=[...items,...(b.data||[]).map(x=>({...x,source:'ANNOUNCEMENT',unread:false}));items.sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));if(!items.length){list.innerHTML='<div class="notification-card empty"><h3>You are all caught up</h3><p>No notifications yet. Important account, deposit, withdrawal and referral messages will appear here.</p></div>'}else list.innerHTML=items.map(n=>'<article class="notification-card '+(n.unread?'unread':'')+'"><div class="top"><span class="badge">'+esc(n.source||'NOTIFICATION')+'</span>'+(n.unread?'<span class="badge new">NEW</span>':'')+'</div><h3>'+esc(n.title||'MDH Notification')+'</h3><p>'+esc(n.message||n.body||'You have a new update.')+'</p><div class="time">'+(n.created_at?new Date(n.created_at).toLocaleString():'Recently')+'</div></article>').join('');await registerPush()}catch(e){console.error('Notifications:',e);list.innerHTML='<div class="notification-card empty"><h3>Unable to load</h3><p>There was a connection problem. Try again.</p><button onclick="load()">Refresh</button></div>'}}
async function mark(){if(!user)return;await db.from('user_notifications').update({is_read:true}).eq('user_id',user.id).eq('is_read',false);load()}document.getElementById('readAll').onclick=mark;
function b64ToBytes(base64){const padding='='.repeat((4-base64.length%4)%4),raw=atob((base64+padding).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
async function registerPush(){if(!('serviceWorker' in navigator)||!('PushManager' in window)){pushStatus.textContent='Phone push is not supported by this browser.';return}const reg=await navigator.serviceWorker.register('/service-worker.js',{scope:'/'});const existing=await reg.pushManager.getSubscription();if(existing){pushStatus.textContent='Phone notifications are enabled.';return}pushStatus.textContent='Tap Enable Phone Notifications to receive MDH messages on this phone.'}
document.getElementById('enablePush').onclick=async()=>{try{if(!user)return;if(!('Notification' in window)||!('PushManager' in window))throw Error('Push notifications are not supported here.');const permission=await Notification.requestPermission();if(permission!=='granted'){pushStatus.textContent='Notification permission was not granted.';return}const reg=await navigator.serviceWorker.register('/service-worker.js',{scope:'/'});let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(VAPID_PUBLIC)});const json=sub.toJSON();const keys=json.keys||{};const {error}=await db.from('push_subscriptions').upsert({user_id:user.id,endpoint:sub.endpoint,p256dh:keys.p256dh,auth:keys.auth,updated_at:new Date().toISOString()},{onConflict:'endpoint'});if(error)throw error;pushStatus.textContent='✅ Phone notifications enabled for Marathon Digital Hub.'}catch(e){console.error('Push setup:',e);pushStatus.textContent='Could not enable phone notifications: '+(e.message||'Try again.')}};
</script><style>html,body{margin:0;min-height:100%;background:#020d12;color:#effff7;font-family:Inter,system-ui,sans-serif}.page{position:relative;z-index:1;width:100%;max-width:720px;margin:auto;padding:18px 14px 40px;box-sizing:border-box}.hero,.notification-card{background:rgba(6,42,37,.78);border:1px solid rgba(25,232,137,.2);box-shadow:0 18px 50px #0008,inset 0 1px #ffffff08;backdrop-filter:blur(18px);border-radius:22px}.hero{padding:23px;margin-bottom:14px}.hero small{color:#19e889;font-weight:900;letter-spacing:.12em}.hero h1{font-size:29px;margin:7px 0}.hero p,.notification-card p{color:#91afa5;line-height:1.65;font-size:13px}.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.actions button,.back{border:0;border-radius:13px;padding:12px 15px;font-weight:900;font-size:11px;text-decoration:none}.actions button{background:#19e889;color:#02170d}.back{background:#19e88912;color:#19e889;border:1px solid #19e88933}.notification-card{padding:18px;margin-bottom:10px}.notification-card.unread{border-color:#19e88966}.top{display:flex;justify-content:space-between}.badge{padding:6px 9px;border-radius:999px;font-size:9px;font-weight:900;background:#19e88918;color:#19e889}.badge.new{background:#ff54701c;color:#ff7183}.notification-card h3{font-size:16px;margin:12px 0 6px}.time{color:#627d75;font-size:10px;margin-top:12px}.empty{text-align:center;padding:35px 18px}.loader{width:24px;height:24px;border:3px solid #19e88922;border-top-color:#19e889;border-radius:50%;margin:10px auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#network{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}</style></body></html>

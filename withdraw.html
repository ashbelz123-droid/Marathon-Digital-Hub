<!DOCTYPE html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw | Marathon Digital Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050B18;
color:#fff;
padding-bottom:90px;
overflow-x:hidden;

}

body::before{

content:"";

position:fixed;

left:-40%;
top:-40%;

width:180%;
height:180%;

background:

radial-gradient(circle at 20% 20%,rgba(0,255,255,.18),transparent 35%),

radial-gradient(circle at 80% 20%,rgba(0,140,255,.18),transparent 35%),

radial-gradient(circle at 60% 80%,rgba(0,255,120,.15),transparent 40%);

animation:bgMove 20s linear infinite;

z-index:-2;

}

@keyframes bgMove{

0%{transform:translateX(-2%);}
50%{transform:translateX(2%);}
100%{transform:translateX(-2%);}

}

.header{

padding:20px;

}

.header h2{

font-size:28px;

}

.header p{

margin-top:5px;

color:#9fb5d1;

}

.wallet{

margin:15px;

background:#08142d;

border-radius:18px;

padding:20px;

border:1px solid rgba(0,200,255,.15);

}

.wallet span{

color:#9fb5d1;

font-size:14px;

}

.wallet h1{

margin-top:10px;

font-size:30px;

color:#00ff88;

}

.section{

margin:15px;

background:#08142d;

padding:20px;

border-radius:18px;

border:1px solid rgba(0,200,255,.15);

}

.section h3{

margin-bottom:15px;

color:#00ff88;

}

.methodButtons{

display:flex;

gap:10px;

margin-bottom:20px;

}

.methodButtons button{

flex:1;

height:50px;

border:none;

border-radius:12px;

background:#111f3d;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

}

.methodButtons button.active{

background:#00ff88;

color:#001018;

}

input{

width:100%;

height:50px;

margin-top:12px;

padding:15px;

border:none;

border-radius:12px;

background:#111f3d;

color:white;

font-size:16px;

outline:none;

}

.submitBtn{

width:100%;

height:55px;

margin-top:18px;

border:none;

border-radius:14px;

background:#00ff88;

color:#001018;

font-size:18px;

font-weight:bold;

cursor:pointer;

}

.historyItem{

background:#111f3d;

padding:15px;

border-radius:12px;

margin-top:12px;

}

.pending{

color:#ffcc00;
font-weight:bold;

}

.approved{

color:#00ff88;
font-weight:bold;

}

.rejected{

color:#ff4444;
font-weight:bold;

}

</style>

</head>

<body>

<div class="header">

<h2>Withdraw</h2>

<p>Request a withdrawal from your wallet.</p>

</div>

<div class="wallet">

<span>Available Balance</span>

<h1 id="walletBalance">

UGX 0

</h1>

</div>

<div class="section">

<h3>Withdrawal Request</h3>

<div class="methodButtons">

<button id="mtnMethod" class="active">

MTN

</button>

<button id="airtelMethod">

Airtel

</button>

</div>

<input
type="number"
id="withdrawAmount"
placeholder="Withdrawal Amount">

<input
type="text"
id="receiverPhone"
placeholder="Receiver Phone Number">

<button
class="submitBtn"
id="submitWithdraw">

Submit Withdrawal

</button>

</div>

<div class="section">

<h3>Withdrawal History</h3>

<div id="withdrawHistory">

Loading...

</div>

</div><script>

const db = window.supabaseClient;

let currentUser = null;
let profile = null;
let selectedMethod = "MTN";

/* =====================================
START
===================================== */

document.addEventListener("DOMContentLoaded", async ()=>{

const { data:{ user } } = await db.auth.getUser();

if(!user){

window.location.href="login.html";
return;

}

currentUser=user;

await loadProfile();
await loadWithdrawHistory();

});

/* =====================================
LOAD PROFILE
===================================== */

async function loadProfile(){

const { data,error } = await db

.from("profiles")

.select("*")

.eq("id",currentUser.id)

.single();

if(error){

console.log(error);
return;

}

profile=data;

document.getElementById("walletBalance").innerHTML=

"UGX "+Number(profile.wallet_balance).toLocaleString();

}

/* =====================================
PAYMENT METHOD
===================================== */

document.getElementById("mtnMethod").onclick=()=>{

selectedMethod="MTN";

document.getElementById("mtnMethod").classList.add("active");
document.getElementById("airtelMethod").classList.remove("active");

};

document.getElementById("airtelMethod").onclick=()=>{

selectedMethod="Airtel";

document.getElementById("airtelMethod").classList.add("active");
document.getElementById("mtnMethod").classList.remove("active");

};

/* =====================================
LOAD WITHDRAW HISTORY
===================================== */

async function loadWithdrawHistory(){

const { data,error } = await db

.from("withdrawals")

.select("*")

.eq("user_id",currentUser.id)

.order("created_at",{ascending:false});

if(error){

console.log(error);
return;

}

const history=document.getElementById("withdrawHistory");

history.innerHTML="";

if(data.length===0){

history.innerHTML=`

<div class="historyItem">

No Withdrawals Yet

</div>

`;

return;

}

data.forEach(item=>{

let cls="pending";

if(item.status=="approved"||item.status=="paid"){

cls="approved";

}

if(item.status=="rejected"){

cls="rejected";

}

history.innerHTML+=`

<div class="historyItem">

<b>

UGX ${Number(item.amount).toLocaleString()}

</b>

<br><br>

Method: ${item.method}

<br>

Status:

<span class="${cls}">

${item.status.toUpperCase()}

</span>

<br><br>

${new Date(item.created_at).toLocaleString()}

</div>

`;

});

}

</script><script>

/* =====================================
SUBMIT WITHDRAWAL
===================================== */

document.getElementById("submitWithdraw").onclick = async () => {

const amount = document.getElementById("withdrawAmount").value.trim();
const phone = document.getElementById("receiverPhone").value.trim();

if(amount==""){

alert("Enter withdrawal amount");
return;

}

if(Number(amount)<=0){

alert("Invalid withdrawal amount");
return;

}

if(phone==""){

alert("Enter receiver phone number");
return;

}

/* Check Wallet */

if(Number(amount) > Number(profile.wallet_balance)){

alert("Insufficient Wallet Balance");

return;

}

/* Disable Button */

const btn=document.getElementById("submitWithdraw");

btn.disabled=true;

btn.innerHTML="Submitting...";

/* Save Withdrawal */

const { error } = await db

.from("withdrawals")

.insert({

user_id:currentUser.id,

amount:Number(amount),

method:selectedMethod,

status:"pending"

});

btn.disabled=false;

btn.innerHTML="Submit Withdrawal";

if(error){

alert(error.message);

return;

}

/* Clear Inputs */

document.getElementById("withdrawAmount").value="";
document.getElementById("receiverPhone").value="";

/* Reload History */

await loadWithdrawHistory();

alert("Withdrawal request submitted successfully.\n\nWait for admin approval.");

};

</script>

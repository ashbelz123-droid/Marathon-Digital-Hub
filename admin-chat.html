<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Admin Chat</title>

<link rel="stylesheet" href="admin-chat.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

</head>

<body>

<!-- HEADER -->

<header class="chat-header">

<button id="backBtn">

←

</button>

<div class="user-box">

<div class="avatar" id="avatar">

U

</div>

<div class="user-details">

<h2 id="userName">

Loading...

</h2>

<p id="chatStatus">

Support Chat

</p>

</div>

</div>

</header>

<!-- CHAT -->

<main
class="chat-container"
id="chatContainer">

<div class="loading">

Loading messages...

</div>

</main>

<!-- FOOTER -->

<footer class="chat-footer">

<input

type="text"

id="replyInput"

placeholder="Type your reply...">

<button

id="sendBtn">

Send

</button>

</footer>

<script src="admin-chat.js"></script>

</body>

</html>

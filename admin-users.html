<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Control | Marathon Digital Hub</title><link rel="stylesheet" href="admin-users.css"><link rel="stylesheet" href="admin-shared.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><main class="admin-wrap"><header class="admin-head"><div><div class="eyebrow">MARATHON DIGITAL HUB</div><h1>Admin Control</h1><p>Users are the main admin control center.</p></div><button class="back" id="adminLogout" type="button">Logout</button></header><section class="grid"><div class="metric"><b id="totalUsers">0</b><span>Total users</span></div><div class="metric"><b id="activeUsers">0</b><span>Active</span></div><div class="metric"><b id="suspendedUsers">0</b><span>Suspended</span></div><div class="metric"><b id="newUsers">0</b><span>New today</span></div><div class="metric"><b id="walletTotal">UGX 0</b><span>Total wallet</span></div><div class="metric"><b id="machineOwners">0</b><span>Machine owners</span></div><div class="metric"><b id="pendingDeposits">0</b><span>Pending deposits</span></div><div class="metric"><b id="pendingWithdrawals">0</b><span>Pending withdrawals</span></div></section><section class="panel"><div class="panel-head"><div><strong>Users</strong><span id="userCount">0 Users</span></div><button id="refreshBtn" class="btn" type="button">Refresh</button></div><div class="toolbar"><input id="searchInput" class="search" type="text" placeholder="Search name, phone, email or referral code"><select id="statusFilter" class="search"><option value="all">All users</option><option value="active">Active</option><option value="suspended">Suspended</option><option value="disabled">Disabled</option></select></div><div id="adminStatus" class="admin-status" aria-live="polite"></div><div id="usersContainer"></div></section></main><script src="admin-users-live.js?v=20260814-2"></script></body></html>

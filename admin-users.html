<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>User Management | Marathon Digital Hub</title><link rel="stylesheet" href="admin-users.css"><link rel="stylesheet" href="admin-shared.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><main class="admin-wrap"><header class="admin-head"><div><div class="eyebrow">ADMIN CONTROL</div><h1>User Management</h1><p>Professional account investigation and management.</p></div><a class="back" href="admin-control.html">← Control Center</a></header><section class="grid"><div class="metric"><b id="totalUsers">0</b><span>Total users</span></div><div class="metric"><b id="activeUsers">0</b><span>Active</span></div><div class="metric"><b id="suspendedUsers">0</b><span>Suspended</span></div><div class="metric"><b id="newUsers">0</b><span>New today</span></div><div class="metric"><b id="walletTotal">UGX 0</b><span>Total wallet</span></div><div class="metric"><b id="machineOwners">0</b><span>Machine owners</span></div><div class="metric"><b id="pendingDeposits">0</b><span>Pending deposits</span></div><div class="metric"><b id="pendingWithdrawals">0</b><span>Pending withdrawals</span></div></section><section class="panel"><div class="toolbar"><input id="searchInput" class="search" type="text" placeholder="Search name, phone, email or referral code"><select id="statusFilter" class="search"><option value="all">All users</option><option value="active">Active</option><option value="suspended">Suspended</option><option value="disabled">Disabled</option></select><button id="refreshBtn" class="btn">Refresh</button></div><p id="userCount" style="color:var(--muted);font-size:9px;margin:0 0 8px">0 Users</p><div id="usersContainer"></div></section></main><script src="admin-users.js"></script></body></html>

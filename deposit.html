<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deposit | Marathon Digital Hub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000814;
color:white;
padding-bottom:90px;
}

.header{
background:#03122c;
padding:20px;
text-align:center;
border-bottom:2px solid #00c8ff;
}

.header h1{
color:#00c8ff;
font-size:28px;
}

.deposit-container{
padding:15px;
}

.deposit-card{
background:#03122c;
border:2px solid #00c8ff;
border-radius:18px;
padding:20px;
margin-bottom:15px;
box-shadow:0 0 15px rgba(0,200,255,.2);
}

.deposit-card h2{
color:#00c8ff;
margin-bottom:15px;
}

.deposit-card p{
font-size:17px;
margin-bottom:10px;
}

.input-group{
margin-top:15px;
}

.input-group input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#081a38;
color:white;
font-size:16px;
}

.submit-btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00c8ff,#0066ff);
color:white;
font-size:18px;
font-weight:bold;
margin-top:15px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">
<h1>Deposit Funds</h1>
</div>

<div class="deposit-container">MTN PAYMENT

<div class="deposit-card">

<h2>MTN Mobile Money</h2>

<p><strong>Name:</strong> Marathon Digital Hub</p>

<p><strong>Number:</strong> 0770123456</p>

<button onclick="copyMTN()" class="submit-btn">
Copy MTN Number
</button>

</div>

AIRTEL PAYMENT

<div class="deposit-card">

<h2>Airtel Money</h2>

<p><strong>Name:</strong> Marathon Digital Hub</p>

<p><strong>Number:</strong> 0700123456</p>

<button onclick="copyAirtel()" class="submit-btn">
Copy Airtel Number
</button>

</div>

AMOUNT INPUT

<div class="deposit-card">

<h2>Deposit Amount</h2>

<div class="input-group">
<input
type="number"
id="amount"
placeholder="Enter Deposit Amount">
</div>

</div><!-- SCREENSHOT UPLOAD -->

<div class="deposit-card">

<h2>Upload Payment Screenshot</h2>

<div class="input-group">
<input
type="file"
id="screenshot"
accept="image/*">
</div>

</div>

<!-- SUBMIT -->

<div class="deposit-card">

<button
class="submit-btn"
onclick="submitDeposit()">

Submit Deposit

</button>

</div>

</div>

<!-- BOTTOM NAVIGATION -->

<div style="
position:fixed;
bottom:0;
left:0;
width:100%;
height:70px;
background:#010b23;
display:flex;
justify-content:space-around;
align-items:center;
border-top:1px solid rgba(0,200,255,.2);
">

<a href="dashboard.html"
style="color:white;text-decoration:none;">
🏠<br>Home
</a>

<a href="machines.html"
style="color:white;text-decoration:none;">
⚙️<br>Machines
</a>

<a href="deposit.html"
style="color:#00c8ff;text-decoration:none;">
💰<br>Deposit
</a>

<a href="income.html"
style="color:white;text-decoration:none;">
📈<br>Income
</a>

<a href="my.html"
style="color:white;text-decoration:none;">
👤<br>My
</a>

</div>

<script>

function copyMTN(){

navigator.clipboard.writeText("0770123456");

alert("MTN Number Copied");

}

function copyAirtel(){

navigator.clipboard.writeText("0700123456");

alert("Airtel Number Copied");

}

function submitDeposit(){

const amount =
document.getElementById("amount").value;

if(!amount){

alert("Enter deposit amount");

return;

}

alert(
"Deposit request submitted successfully. Waiting for admin approval."
);

}

</script>

</body>
  </html>

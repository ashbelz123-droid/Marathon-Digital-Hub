<body>

<div class="header">

<h2>Deposit</h2>

<p>Fund your Marathon wallet securely.</p>

</div>

<div class="wallet">

<span>Wallet Balance</span>

<h1 id="walletBalance">

UGX 0

</h1>

</div>

<div class="section">

<h3>Payment Details</h3>

<div class="payment-card">

<p><b>MTN Account</b></p>

<p id="mtnName">Loading...</p>

<p id="mtnNumber">Loading...</p>

<button class="copyBtn" id="copyMTN">

📋 Copy MTN Number

</button>

</div>

<div class="payment-card">

<p><b>Airtel Account</b></p>

<p id="airtelName">Loading...</p>

<p id="airtelNumber">Loading...</p>

<button class="copyBtn" id="copyAirtel">

📋 Copy Airtel Number

</button>

</div>

</div>

<div class="section">

<h3>Make Deposit</h3>

<div id="depositMessage">

Loading...

</div>

<button class="copyBtn" id="copyMessage">

📋 Copy Deposit Message

</button>

<div class="methodButtons">

<button id="mtnMethod" class="active">

MTN

</button>

<button id="airtelMethod">

Airtel

</button>

</div>

<input
type="number"
id="depositAmount"
placeholder="Deposit Amount">

<input
type="text"
id="transactionId"
placeholder="Transaction ID">

<button
class="submitBtn"
id="submitDeposit">

Submit Deposit

</button>

</div>

<div class="section">

<h3>Deposit History</h3>

<div id="depositHistory">

Loading...

</div>

  </div><script>

const db = window.supabaseClient;

let currentUser = null;
let profile = null;
let selectedMethod = "MTN";

/* ===============================
START
=============================== */

document.addEventListener("DOMContentLoaded", async () => {

const { data:{ user } } = await db.auth.getUser();

if(!user){

window.location.href="login.html";
return;

}

currentUser = user;

await loadProfile();
await loadPaymentSettings();
await loadDepositHistory();

});

/* ===============================
LOAD USER PROFILE
=============================== */

async function loadProfile(){

const { data,error } = await db

.from("profiles")

.select("*")

.eq("id",currentUser.id)

.single();

if(error){

console.log(error);
return;

}

profile = data;

document.getElementById("walletBalance").innerHTML =
"UGX " + Number(data.wallet_balance).toLocaleString();

document.getElementById("depositMessage").innerHTML =

`
<b>Name:</b> ${data.fullname}<br><br>

<b>Phone:</b> ${data.phone}<br><br>

<b>User ID:</b> ${currentUser.id}
`;

}

/* ===============================
LOAD PAYMENT SETTINGS
=============================== */

async function loadPaymentSettings(){

const { data,error } = await db

.from("payment_settings")

.select("*")

.eq("is_active",true);

if(error){

console.log(error);
return;

}

data.forEach(item=>{

if(item.method.toLowerCase()=="mtn"){

document.getElementById("mtnName").innerHTML =
item.account_name;

document.getElementById("mtnNumber").innerHTML =
item.phone_number;

}

if(item.method.toLowerCase()=="airtel"){

document.getElementById("airtelName").innerHTML =
item.account_name;

document.getElementById("airtelNumber").innerHTML =
item.phone_number;

}

});

}

/* ===============================
COPY BUTTONS
=============================== */

document.getElementById("copyMTN").onclick = ()=>{

navigator.clipboard.writeText(

document.getElementById("mtnNumber").innerText

);

alert("MTN Number Copied");

};

document.getElementById("copyAirtel").onclick = ()=>{

navigator.clipboard.writeText(

document.getElementById("airtelNumber").innerText

);

alert("Airtel Number Copied");

};

document.getElementById("copyMessage").onclick = ()=>{

navigator.clipboard.writeText(

document.getElementById("depositMessage").innerText

);

alert("Deposit Message Copied");

};

/* ===============================
PAYMENT METHOD
=============================== */

document.getElementById("mtnMethod").onclick = ()=>{

selectedMethod="MTN";

document.getElementById("mtnMethod").classList.add("active");
document.getElementById("airtelMethod").classList.remove("active");

};

document.getElementById("airtelMethod").onclick = ()=>{

selectedMethod="Airtel";

document.getElementById("airtelMethod").classList.add("active");
document.getElementById("mtnMethod").classList.remove("active");

};

  </script><script>

/* =====================================
SUBMIT DEPOSIT
===================================== */

document.getElementById("submitDeposit").onclick = async () => {

const amount = document.getElementById("depositAmount").value.trim();
const transactionId = document.getElementById("transactionId").value.trim();

if(amount==""){

alert("Enter Deposit Amount");
return;

}

if(Number(amount)<=0){

alert("Invalid Deposit Amount");
return;

}

if(transactionId==""){

alert("Enter Transaction ID");
return;

}

/* Disable Button */

const btn=document.getElementById("submitDeposit");

btn.disabled=true;
btn.innerHTML="Submitting...";

/* Save Deposit */

const { error } = await db

.from("deposits")

.insert({

user_id:currentUser.id,

amount:Number(amount),

method:selectedMethod,

transaction_id:transactionId,

status:"pending"

});

btn.disabled=false;
btn.innerHTML="Submit Deposit";

if(error){

alert(error.message);
return;

}

/* Clear Inputs */

document.getElementById("depositAmount").value="";
document.getElementById("transactionId").value="";

/* Reload History */

await loadDepositHistory();

alert("Deposit Submitted Successfully.\n\nWait for Admin Approval.");

};

/* =====================================
LOAD DEPOSIT HISTORY
===================================== */

async function loadDepositHistory(){

const { data,error } = await db

.from("deposits")

.select("*")

.eq("user_id",currentUser.id)

.order("created_at",{ascending:false});

if(error){

console.log(error);
return;

}

const history=document.getElementById("depositHistory");

history.innerHTML="";

if(data.length==0){

history.innerHTML=`

<div class="historyItem">

No Deposits Yet

</div>

`;

return;

}

data.forEach(item=>{

let statusClass="pending";

if(item.status=="approved"){

statusClass="approved";

}

if(item.status=="rejected"){

statusClass="rejected";

}

history.innerHTML+=`

<div class="historyItem">

<b>

UGX ${Number(item.amount).toLocaleString()}

</b>

<br><br>

Payment Method:
${item.method}

<br>

Transaction ID:
${item.transaction_id}

<br>

<div class="status ${statusClass}">

${item.status.toUpperCase()}

</div>

<br>

${new Date(item.created_at).toLocaleString()}

</div>

`;

});

}

  </script>

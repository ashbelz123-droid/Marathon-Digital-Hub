<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Marathon Digital Hub</title><link rel="stylesheet" href="assets/css/style.css">
</head><body><canvas id="network"></canvas>

<div class="welcome-container"><div class="form-box">

    <div class="logo">
        MDH
    </div>

    <h1 class="title">
        Welcome Back
    </h1>

    <p class="subtitle">
        Login To Your Account
    </p>

    <form id="loginForm">

        <div class="input-group">
            <input
            type="email"
            id="email"
            placeholder="Email Address"
            required>
        </div>

        <div class="input-group">
            <input
            type="password"
            id="password"
            placeholder="Password"
            required>
        </div>

        <button type="submit" class="btn">
            Login
        </button>

    </form>

    <p style="margin-top:20px;text-align:center;">
        Don't have an account?
        <a href="register.html" style="color:#00c8ff;">
            Register
        </a>
    </p>

</div>

</div><script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    // Temporary redirect
    window.location.href = "dashboard.html";
});
</script><script src="assets/js/network.js"></script></body>
</html>

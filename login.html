<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Marathon Digital Hub | Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#020b1f;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;

}

.card{

width:100%;
max-width:430px;
background:#07152f;
padding:30px;
border-radius:25px;
border:1px solid rgba(0,200,255,.25);
box-shadow:0 0 30px rgba(0,200,255,.2);

}

.logo{

text-align:center;
font-size:30px;
font-weight:bold;
color:#00c8ff;
margin-bottom:8px;

}

.subtitle{

text-align:center;
color:#ddd;
margin-bottom:25px;

}

.message{

text-align:center;
margin-bottom:15px;
font-weight:bold;

}

#error{

color:#ff6b6b;

}

#success{

color:#66ff99;

}

.input{

margin-bottom:15px;

}

.input input{

width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#0b2148;
color:white;
font-size:15px;

}

.input input:focus{

outline:1px solid #00c8ff;

}

.options{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
color:white;
font-size:14px;

}

.options a{

color:#00c8ff;
text-decoration:none;

}

button{

width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#00c8ff;
font-size:16px;
font-weight:bold;
cursor:pointer;

}

button:hover{

opacity:.9;

}

.footer{

text-align:center;
margin-top:20px;
color:white;

}

.footer a{

color:#00c8ff;
text-decoration:none;

}

.loading{

display:none;
margin-top:15px;
text-align:center;
color:#00c8ff;

}

</style></head><body><div class="card"><div class="logo">
Marathon Digital Hub
</div><div class="subtitle">
Welcome Back 👋
<br>
Login to continue
</div><div id="error" class="message"></div>
<div id="success" class="message"></div><div class="input">
<input
type="email"
id="email"
placeholder="Email Address">
</div><div class="input">
<input
type="password"
id="password"
placeholder="Password">
</div><div class="options"><label><input
type="checkbox"
id="showPassword">

Show Password

</label><a href="#">
Forgot Password?
</a></div><button id="loginBtn">LOGIN

</button><div class="loading"
id="loading">Signing you in...

</div><div class="footer">Don't have an account?

<a href="register.html">Create Account

</a></div></div><script>

async function getUserName(userId){

const { data } =
await supabaseClient
.from("profiles")
.select("fullname")
.eq("id", userId)
.single();

return data?.fullname || "User";

}

document.getElementById("showPassword")
.addEventListener("change",function(){

document.getElementById("password").type =
this.checked ? "text" : "password";

});

(async()=>{

const {
data:{session}
} = await supabaseClient.auth.getSession();

if(session){

window.location.href="dashboard.html";

}

})();

document
.getElementById("loginBtn")
.addEventListener("click",async()=>{

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

document.getElementById("error").innerText="";
document.getElementById("success").innerText="";
document.getElementById("loading").style.display="block";

if(!email || !password){

document.getElementById("loading").style.display="none";
document.getElementById("error").innerText =
"Please enter your email and password.";
return;

}

try{

const { data,error } =
await supabaseClient.auth.signInWithPassword({

email,
password

});

if(error) throw error;

const fullname =
await getUserName(data.user.id);

document.getElementById("loading").style.display="none";

document.getElementById("success").innerText =
"👋 Welcome back, " + fullname + "!";

setTimeout(()=>{

window.location.href="dashboard.html";

},1500);

}catch(err){

document.getElementById("loading").style.display="none";

document.getElementById("error").innerText =
err.message;

}

});

</script></body>
            </html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#06131f"><title>Marathon Digital Hub | Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><link rel="stylesheet" href="assets/css/mdh-ui.css"><style>
*{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}html,body{margin:0;min-height:100%;color:#f4fff9}body{min-height:100vh;background:#06131f;display:flex;justify-content:center;align-items:center;padding:20px;overflow-x:hidden}#network{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}body:before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 50% 43%,rgba(0,205,118,.22),transparent 25%),radial-gradient(circle at 20% 15%,rgba(25,232,137,.08),transparent 32%),linear-gradient(145deg,#04101a,#071b29 55%,#031019)}.card{width:100%;max-width:430px;padding:30px 24px;border-radius:30px;background:rgba(10,29,43,.90);border:1px solid rgba(25,232,137,.14);box-shadow:0 24px 70px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.025);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.brand{text-align:center;margin-bottom:25px}.brand-mark{width:68px;height:68px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#19e889,#0a9c5b);color:#03130b;font-weight:950;font-size:15px;box-shadow:0 0 38px rgba(25,232,137,.24)}.logo{font-size:28px;line-height:1.05;font-weight:900;letter-spacing:-.04em}.subtitle{text-align:center;color:#91a7b6;margin-top:9px;line-height:1.5;font-size:14px}.message{text-align:center;margin:0 0 13px;font-weight:700;min-height:20px}#error{color:#ff687a}#success{color:#63f5a5}.input{margin-bottom:13px}.input label{display:block;color:#9db1bc;font-size:12px;font-weight:700;margin:0 0 7px}.input input{width:100%;padding:15px 14px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(0,0,0,.22);color:#fff;font-size:15px;outline:none}.input input:focus{border-color:#19e889;box-shadow:0 0 0 4px rgba(25,232,137,.09)}.options{display:flex;justify-content:space-between;align-items:center;margin:5px 0 20px;color:#9db1bc;font-size:12px;gap:10px}.options label{display:flex;align-items:center;gap:6px}.options input{accent-color:#19e889}.options a{color:#19e889;text-decoration:none;font-weight:700}button{width:100%;min-height:50px;padding:14px;border:0;border-radius:15px;background:linear-gradient(135deg,#19e889,#0db86b);color:#03130b;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 14px 30px rgba(25,232,137,.18)}button:active{transform:translateY(1px)}.loading{display:none;margin-top:14px;text-align:center;color:#8fa7b4;font-size:13px}.loading:before{content:"";display:inline-block;width:14px;height:14px;margin-right:7px;vertical-align:-2px;border:2px solid rgba(25,232,137,.2);border-top-color:#19e889;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.footer{text-align:center;margin-top:21px;color:#8299a7;font-size:13px}.footer a{color:#19e889;text-decoration:none;font-weight:800}.secure-note{text-align:center;margin-top:17px;color:#607785;font-size:10px;letter-spacing:.04em}.top-line{height:2px;width:70px;margin:0 auto 22px;background:linear-gradient(90deg,transparent,#19e889,transparent);border-radius:99px}@media(max-width:380px){.card{padding:25px 18px}.logo{font-size:25px}}
</style></head><body><canvas id="network" aria-hidden="true"></canvas><div class="card"><div class="top-line"></div><div class="brand"><div class="brand-mark">MDH</div><div class="logo">Marathon Digital Hub</div><div class="subtitle">Welcome back 👋<br>Login to continue to your dashboard</div></div><div id="error" class="message"></div><div id="success" class="message"></div><div class="input"><label for="email">Email address</label><input type="email" id="email" placeholder="Enter your email" autocomplete="email"></div><div class="input"><label for="password">Password</label><input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"></div><div class="options"><label><input type="checkbox" id="showPassword"> Show password</label><a href="#">Forgot password?</a></div><button id="loginBtn">LOGIN TO MDH</button><div class="loading" id="loading">Signing you in...</div><div class="footer">Don't have an account? <a href="register.html">Create account</a></div><div class="secure-note">SECURE MDH ACCOUNT ACCESS</div></div><script src="assets/js/network.js"></script><script>
async function getUserName(userId){const {data}=await supabaseClient.from("profiles").select("fullname").eq("id",userId).single();return data?.fullname||"User";}
document.getElementById("showPassword").addEventListener("change",function(){document.getElementById("password").type=this.checked?"text":"password";});
(async()=>{const{data:{session}}=await supabaseClient.auth.getSession();if(session)window.location.href="dashboard.html";})();
document.getElementById("loginBtn").addEventListener("click",async()=>{const email=document.getElementById("email").value.trim();const password=document.getElementById("password").value;document.getElementById("error").innerText="";document.getElementById("success").innerText="";document.getElementById("loading").style.display="block";if(!email||!password){document.getElementById("loading").style.display="none";document.getElementById("error").innerText="Please enter your email and password.";return;}try{const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;const fullname=await getUserName(data.user.id);document.getElementById("loading").style.display="none";document.getElementById("success").innerText="👋 Welcome back, "+fullname+"!";setTimeout(()=>{window.location.href="dashboard.html";},1500);}catch(err){document.getElementById("loading").style.display="none";document.getElementById("error").innerText=err.message;}});
</script></body></html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Machines | Marathon Digital Hub</title>

<link rel="stylesheet" href="admin-machines.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

</head>

<body>

<div class="container">

<header class="topHeader">

<div>

<h1>Machine Management</h1>

<p>Manage all mining machines</p>

</div>

<button id="openForm">

➕ Add Machine

</button>

</header>

<section class="stats">

<div class="statCard">
<h2 id="totalMachines">0</h2>
<p>Total Machines</p>
</div>

<div class="statCard">
<h2 id="activeMachines">0</h2>
<p>Active</p>
</div>

<div class="statCard">
<h2 id="disabledMachines">0</h2>
<p>Disabled</p>
</div>

<div class="statCard">
<h2 id="vipMachines">0</h2>
<p>VIP</p>
</div>

</section>

<section class="searchSection">

<input
type="text"
id="searchMachine"
placeholder="Search machine...">

</section>

<section
class="machineForm"
id="machineForm">

<h2 id="formTitle">

Add Machine

</h2>

<input
type="text"
id="machineName"
placeholder="Machine Name">

<input
type="text"
id="machineSeries"
placeholder="Machine Series">

<input
type="number"
id="machinePrice"
placeholder="Price">

<input
type="number"
id="machineReturn"
placeholder="Total Return">

<input
type="number"
id="machineDuration"
placeholder="Duration (Days)"><select id="machineStatus">

<option value="true">

🟢 Active

</option>

<option value="false">

🔴 Disabled

</option>

</select>

<label class="vipRow">

<input

type="checkbox"

id="machineVIP">

<span>VIP Machine</span>

</label>

<div class="uploadArea">

<input

type="file"

id="machineImage"

accept="image/*"

hidden>

<label

for="machineImage"

class="uploadButton">

📷 Choose Machine Image

</label>

<img

id="previewImage"

alt="Machine Preview">

</div>

<div class="formButtons">

<button

id="saveMachine"

type="button">

💾 Save Machine

</button>

<button

id="cancelMachine"

type="button">

✖ Cancel

</button>

</div>

</section>

<!-- ==========================
MACHINE LIST
========================== -->

<section>

<h2 class="sectionTitle">

Mining Machines

</h2>

<div

id="machineList"

class="machineGrid">

<!--
Machine cards from Supabase
will appear here automatically.
-->

</div>

  </section>
  
  <!-- ==========================
SUCCESS MESSAGE
========================== -->

<div id="successMessage" class="popup">

<div class="popupContent">

<h2>Success</h2>

<p id="popupText">

Operation completed successfully.

</p>

<button id="closePopup">

OK

</button>

</div>

</div>

<!-- ==========================
DELETE CONFIRMATION
========================== -->

<div id="deleteModal" class="popup">

<div class="popupContent">

<h2>Delete Machine</h2>

<p>

Are you sure you want to delete this machine?

</p>

<div class="popupButtons">

<button id="confirmDelete">

Delete

</button>

<button id="cancelDelete">

Cancel

</button>

</div>

</div>

</div>

</div>

<script src="admin-machines.js"></script>

</body>

  </html>

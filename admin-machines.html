<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Machine Management | Marathon Digital Hub</title>

<link rel="stylesheet" href="admin-machines.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

</head>

<body>

<div class="page">

    <!-- ==========================
         HEADER
    =========================== -->

    <header class="topBar">

        <div>

            <h1>Machine Management</h1>

            <p>
                Create, edit and manage all mining machines.
            </p>

        </div>

        <button id="addMachineBtn" class="primaryBtn">

            + Add Machine

        </button>

    </header>

    <!-- ==========================
         DASHBOARD CARDS
    =========================== -->

    <section class="statsGrid">

        <div class="statCard">

            <span>Total Machines</span>

            <h2 id="totalMachines">0</h2>

        </div>

        <div class="statCard">

            <span>Active</span>

            <h2 id="activeMachines">0</h2>

        </div>

        <div class="statCard">

            <span>Disabled</span>

            <h2 id="disabledMachines">0</h2>

        </div>

        <div class="statCard">

            <span>VIP</span>

            <h2 id="vipMachines">0</h2>

        </div>

    </section>

    <!-- ==========================
         SEARCH
    =========================== -->

    <section class="searchArea">

        <input
            id="searchInput"
            type="text"
            placeholder="Search machine by name or series...">

    </section>

        <!-- ==========================
         ADD / EDIT MACHINE FORM
    =========================== -->

    <section id="machineForm" class="machineForm hidden">

        <div class="formHeader">

            <h2 id="formTitle">
                Add New Machine
            </h2>

            <button
                id="closeFormBtn"
                type="button"
                class="closeBtn">

                ✕

            </button>

        </div>

        <form id="machineFormElement">

            <div class="formGrid">

                <div class="formGroup">

                    <label>Machine Name</label>

                    <input
                        type="text"
                        id="machineName"
                        required
                        placeholder="Example: Antminer S21">

                </div>

                <div class="formGroup">

                    <label>Series</label>

                    <input
                        type="text"
                        id="machineSeries"
                        placeholder="Example: S21 Series">

                </div>

                <div class="formGroup">

                    <label>Price (UGX)</label>

                    <input
                        type="number"
                        id="machinePrice"
                        min="0"
                        required>

                </div>

                <div class="formGroup">

                    <label>Total Return (UGX)</label>

                    <input
                        type="number"
                        id="machineReturn"
                        min="0"
                        required>

                </div>

                <div class="formGroup">

                    <label>Duration (Days)</label>

                    <input
                        type="number"
                        id="machineDuration"
                        min="1"
                        required>

                </div>

                <div class="formGroup">

                    <label>Status</label>

                    <select id="machineStatus">

                        <option value="true">
                            Active
                        </option>

                        <option value="false">
                            Disabled
                        </option>

                    </select>

                </div>

            </div>

            <!-- IMAGE -->

            <div class="formGroup">

                <label>Machine Image</label>

                <input
                    type="file"
                    id="machineImage"
                    accept="image/*">

                <img
                    id="previewImage"
                    class="previewImage"
                    alt="Preview">

            </div>

            <!-- VIP -->

            <div class="checkboxRow">

                <input
                    type="checkbox"
                    id="machineVIP">

                <label for="machineVIP">

                    Mark as VIP Machine

                </label>

            </div>

            <div class="buttonRow">

                <button
                    type="submit"
                    id="saveMachineBtn"
                    class="saveBtn">

                    💾 Save Machine

                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    class="cancelBtn">

                    Cancel

                </button>

            </div>

        </form>

    </section>

        <!-- ==========================
         MACHINES LIST
    =========================== -->

    <section class="machinesSection">

        <div class="sectionHeader">

            <h2>Mining Machines</h2>

            <span id="machineCount">
                0 Machines
            </span>

        </div>

        <div
            id="machinesContainer"
            class="machinesGrid">

            <!-- Machine cards will be loaded here -->

        </div>

    </section>

</div>

<!-- ==========================
DELETE MODAL
=========================== -->

<div
    id="deleteModal"
    class="modal hidden">

    <div class="modalCard">

        <h2>Delete Machine</h2>

        <p>
            Are you sure you want to delete this machine?
            This action cannot be undone.
        </p>

        <div class="modalButtons">

            <button
                id="confirmDeleteBtn"
                class="deleteBtn">

                Delete

            </button>

            <button
                id="cancelDeleteBtn"
                class="cancelBtn">

                Cancel

            </button>

        </div>

    </div>

</div>

<!-- ==========================
SUCCESS MESSAGE
=========================== -->

<div
    id="toast"
    class="toast">

    <span id="toastMessage">
        Success
    </span>

</div>

<!-- ==========================
LOADING
=========================== -->

<div
    id="loadingScreen"
    class="loadingScreen hidden">

    <div class="spinner"></div>

    <p>Loading...</p>

</div>

<script src="admin-machines.js"></script>

</body>

</html>

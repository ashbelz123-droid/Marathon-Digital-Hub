<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Machines | Marathon Digital Hub</title>

<link rel="stylesheet" href="admin-machines.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

</head>

<body>

<div class="container">

<header>

<div>

<h1>Machine Management</h1>

<p>Manage all mining machines</p>

</div>

<button id="addMachineBtn">

+ Add Machine

</button>

</header>

<section class="stats">

<div class="card">

<h2 id="totalMachines">0</h2>

<p>Total Machines</p>

</div>

<div class="card">

<h2 id="activeMachines">0</h2>

<p>Active</p>

</div>

<div class="card">

<h2 id="disabledMachines">0</h2>

<p>Disabled</p>

</div>

<div class="card">

<h2 id="vipMachines">0</h2>

<p>VIP</p>

</div>

</section>

<section
class="machineForm"
id="machineForm">

<h2>Add Machine</h2>

<input
type="text"
id="machineName"
placeholder="Machine Name">

<input
type="text"
id="machineSeries"
placeholder="Series">

<input
type="number"
id="machinePrice"
placeholder="Price">

<input
type="number"
id="machineReturn"
placeholder="Total Return">

<input
type="number"
id="machineDuration"
placeholder="Duration">

<select id="machineStatus">

<option value="true">

Active

</option>

<option value="false">

Disabled

</option>

</select>

<label class="vipBox">

<input
type="checkbox"
id="machineVIP">

VIP Machine

</label>

<input
type="file"
id="machineImage"
accept="image/*">

<img id="previewImage">

<button id="saveMachine">

Save Machine

</button>

</section>

<section class="searchBar">

<input

type="text"

id="searchMachine"

placeholder="Search machines...">

</section>

<section id="machineList">

</section>

</div>

<script src="admin-machines.js"></script>

</body>

  </html>

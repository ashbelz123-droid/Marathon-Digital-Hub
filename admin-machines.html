<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin Machines | Marathon Digital Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050B18;
color:#fff;
padding-bottom:100px;

}

/* Header */

.header{

padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

}

.header h2{

font-size:28px;

background:linear-gradient(90deg,#00C8FF,#00FF88);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.addBtn{

padding:12px 18px;

border:none;

border-radius:12px;

background:linear-gradient(90deg,#00C8FF,#00FF88);

color:#001018;

font-weight:bold;

cursor:pointer;

}

/* Search */

.searchBox{

margin:15px;

}

.searchBox input{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:#0A1732;

color:#fff;

outline:none;

}

/* Form */

.formCard{

margin:15px;

padding:20px;

background:#08142D;

border-radius:18px;

border:1px solid rgba(0,200,255,.15);

display:none;

}

.formCard h3{

margin-bottom:15px;

color:#00FF88;

}

.formCard input,
.formCard select{

width:100%;

padding:13px;

margin-bottom:12px;

background:#111F3D;

border:none;

border-radius:10px;

color:#fff;

outline:none;

}

.preview{

width:100%;

height:180px;

border-radius:15px;

background:#111F3D;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

margin-bottom:15px;

}

.preview img{

width:100%;

height:100%;

object-fit:cover;

display:none;

}

.uploadBtn,
.saveBtn{

width:100%;

padding:14px;

border:none;

border-radius:12px;

font-weight:bold;

cursor:pointer;

margin-bottom:10px;

}

.uploadBtn{

background:#1B335F;

color:#fff;

}

.saveBtn{

background:linear-gradient(90deg,#00C8FF,#00FF88);

color:#001018;

}

/* Machine List */

#machineList{

padding:15px;

}

.loading{

text-align:center;

padding:50px;

color:#00C8FF;

}

</style>

</head>

<body>

<div class="header">

<h2>Machines</h2>

<button class="addBtn" onclick="openForm()">

+ Add Machine

</button>

</div>

<div class="searchBox">

<input
type="text"
id="searchMachine"
placeholder="Search machine...">

</div>

<div class="formCard" id="machineForm">

<h3 id="formTitle">

Add Machine

</h3>

<input
type="text"
id="machineName"
placeholder="Machine Name">

<input
type="text"
id="machineSeries"
placeholder="Series">

<input
type="number"
id="machinePrice"
placeholder="Price">

<input
type="number"
id="machineReturn"
placeholder="Total Return">

<input
type="number"
id="machineDuration"
placeholder="Duration (Days)">

<select id="machineVIP">

<option value="false">

Standard Machine

</option>

<option value="true">

VIP Machine

</option>

</select>

<select id="machineStatus">

<option value="true">

Active

</option>

<option value="false">

Disabled

</option>

</select>

<div class="preview">

<img id="previewImage">

</div>

<input
type="file"
id="machineImageFile"
accept="image/*"
hidden>

<button
class="uploadBtn"
onclick="document.getElementById('machineImageFile').click()">

📷 Choose Machine Image

</button>

<button
class="saveBtn"
id="saveMachineBtn">

Save Machine

</button>

</div>

<div id="machineList">

<div class="loading">

Loading machines...

</div>

  </div><script>

/* =====================================
SUPABASE
===================================== */

const db = window.supabaseClient;

let machines = [];
let uploadedImage = "";
let editingId = null;

/* =====================================
START
===================================== */

document.addEventListener("DOMContentLoaded", async()=>{

await loadMachines();

});

/* =====================================
OPEN / CLOSE FORM
===================================== */

function openForm(){

editingId=null;

document.getElementById("formTitle").innerHTML="Add Machine";

document.getElementById("machineForm").style.display="block";

clearForm();

window.scrollTo({

top:0,

behavior:"smooth"

});

}

/* =====================================
CLEAR FORM
===================================== */

function clearForm(){

document.getElementById("machineName").value="";

document.getElementById("machineSeries").value="";

document.getElementById("machinePrice").value="";

document.getElementById("machineReturn").value="";

document.getElementById("machineDuration").value="";

document.getElementById("machineVIP").value="false";

document.getElementById("machineStatus").value="true";

uploadedImage="";

const img=document.getElementById("previewImage");

img.src="";

img.style.display="none";

}

/* =====================================
UPLOAD IMAGE
===================================== */

document.getElementById("machineImageFile")

.addEventListener("change",uploadImage);

async function uploadImage(e){

const file=e.target.files[0];

if(!file)return;

const img=document.getElementById("previewImage");

img.src=URL.createObjectURL(file);

img.style.display="block";

const fileName=

Date.now()+"-"+

file.name.replace(/\s+/g,"-");

const { error } = await db.storage

.from("machine-images")

.upload(fileName,file,{

upsert:true

});

if(error){

alert(error.message);

return;

}

const { data } = db.storage

.from("machine-images")

.getPublicUrl(fileName);

uploadedImage=data.publicUrl;

}

/* =====================================
LOAD MACHINES
===================================== */

async function loadMachines(){

document.getElementById("machineList").innerHTML=`

<div class="loading">

Loading machines...

</div>

`;

const { data,error } = await db

.from("machines")

.select("*")

.order("created_at",{

ascending:false

});

if(error){

console.log(error);

document.getElementById("machineList").innerHTML=`

<div class="loading">

Failed to load machines.

</div>

`;

return;

}

machines=data || [];

/* Part 3 */

renderMachines();

}/* =====================================
RENDER MACHINES
===================================== */

function renderMachines(){

const container=document.getElementById("machineList");

container.innerHTML="";

if(machines.length===0){

container.innerHTML=`

<div class="loading">

No machines found.

</div>

`;

return;

}

const search=document

.getElementById("searchMachine")

.value

.toLowerCase();

machines

.filter(machine=>{

return machine.name

.toLowerCase()

.includes(search);

})

.forEach(machine=>{

const dailyIncome=Math.floor(

Number(machine.total_return)/

Number(machine.duration_days)

);

container.innerHTML+=`

<div class="machineCard">

<div class="machineTop">

<img

src="${machine.image_url||'images/default-machine.png'}"

class="machineImage"

onerror="this.src='images/default-machine.png'">

<div class="machineInfo">

<div class="machineName">

${machine.name}

</div>

<div class="machineSeries">

${machine.series||'STANDARD'}

</div>

</div>

</div>

<div class="infoRow">

<span class="infoTitle">

Price

</span>

<span class="infoValue">

UGX ${Number(machine.price).toLocaleString()}

</span>

</div>

<div class="infoRow">

<span class="infoTitle">

Total Return

</span>

<span class="infoValue">

UGX ${Number(machine.total_return).toLocaleString()}

</span>

</div>

<div class="infoRow">

<span class="infoTitle">

Daily Income

</span>

<span class="infoValue">

UGX ${dailyIncome.toLocaleString()}

</span>

</div>

<div class="infoRow">

<span class="infoTitle">

Duration

</span>

<span class="infoValue">

${machine.duration_days} Days

</span>

</div>

<div class="infoRow">

<span class="infoTitle">

VIP

</span>

<span class="infoValue">

${machine.is_vip ? "⭐ YES" : "NO"}

</span>

</div>

<div class="infoRow">

<span class="infoTitle">

Status

</span>

<span class="infoValue">

${machine.status ? "🟢 ACTIVE" : "🔴 DISABLED"}

</span>

</div>

<div style="display:flex;gap:10px;margin-top:15px;">

<button

class="uploadBtn"

style="flex:1"

onclick="editMachine('${machine.id}')">

✏️ Edit

</button>

<button

class="saveBtn"

style="flex:1;background:#ff4444;color:#fff;"

onclick="deleteMachine('${machine.id}')">

🗑 Delete

</button>

</div>

</div>

`;

});

}

/* Live Search */

document

.getElementById("searchMachine")

.addEventListener("input",renderMachines);
    /* =====================================
EDIT MACHINE
===================================== */

function editMachine(id){

const machine=machines.find(m=>m.id===id);

if(!machine)return;

editingId=id;

document.getElementById("machineForm").style.display="block";

document.getElementById("formTitle").innerHTML=

"Edit Machine";

document.getElementById("machineName").value=

machine.name;

document.getElementById("machineSeries").value=

machine.series || "";

document.getElementById("machinePrice").value=

machine.price;

document.getElementById("machineReturn").value=

machine.total_return;

document.getElementById("machineDuration").value=

machine.duration_days;

document.getElementById("machineVIP").value=

String(machine.is_vip);

document.getElementById("machineStatus").value=

String(machine.status);

uploadedImage=machine.image_url || "";

const img=document.getElementById("previewImage");

if(uploadedImage){

img.src=uploadedImage;

img.style.display="block";

}else{

img.src="";

img.style.display="none";

}

document

.getElementById("saveMachineBtn")

.innerHTML="Save Changes";

window.scrollTo({

top:0,

behavior:"smooth"

});

}

/* =====================================
DELETE MACHINE
===================================== */

async function deleteMachine(id){

const confirmDelete=

confirm("Delete this machine?");

if(!confirmDelete)return;

const { error }=await db

.from("machines")

.delete()

.eq("id",id);

if(error){

alert(error.message);

return;

}

await loadMachines();

    }
    /* =====================================
SAVE MACHINE
===================================== */

document

.getElementById("saveMachineBtn")

.addEventListener("click",saveMachine);

async function saveMachine(){

const name=document

.getElementById("machineName")

.value.trim();

const series=document

.getElementById("machineSeries")

.value.trim();

const price=Number(

document

.getElementById("machinePrice")

.value

);

const totalReturn=Number(

document

.getElementById("machineReturn")

.value

);

const duration=Number(

document

.getElementById("machineDuration")

.value

);

const isVIP=

document

.getElementById("machineVIP")

.value==="true";

const status=

document

.getElementById("machineStatus")

.value==="true";

if(

!name ||

!series ||

price<=0 ||

totalReturn<=0 ||

duration<=0

){

alert("Please complete all fields.");

return;

}

const machineData={

name:name,

series:series,

price:price,

total_return:totalReturn,

duration_days:duration,

status:status,

is_vip:isVIP,

image_url:uploadedImage

};

let error=null;

if(editingId){

const result=await db

.from("machines")

.update(machineData)

.eq("id",editingId);

error=result.error;

}else{

const result=await db

.from("machines")

.insert(machineData);

error=result.error;

}

if(error){

alert(error.message);

return;

}

alert(

editingId

?

"Machine updated successfully!"

:

"Machine added successfully!"

);

editingId=null;

document

.getElementById("machineForm")

.style.display="none";

document

.getElementById("saveMachineBtn")

.innerHTML="Save Machine";

clearForm();

await loadMachines();

    }
    </script>

<style>

/* ==========================
BOTTOM NAVIGATION
========================== */

border-radius:12px;

display:none;

z-index:9999;

box-shadow:0 0 20px rgba(0,255,255,.35);

}

</style>

<div id="successPopup"></div>

<script>

/* ==========================
SUCCESS POPUP
========================== */

const popup=document.getElementById("successPopup");

popup.style.display="block";

setTimeout(()=>{

popup.style.display="none";

},2500);

}

</script>

</body>

</html>

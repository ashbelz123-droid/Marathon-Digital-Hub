<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Machine Management</title>

<link rel="stylesheet" href="admin-machines.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="page">

    <!-- HEADER -->

    <div class="header">

        <div>

            <h1>Machine Management</h1>

            <p>Manage all mining machines</p>

        </div>

        <button id="openFormBtn" class="primaryBtn">
            ➕ Add Machine
        </button>

    </div>

    <!-- STATISTICS -->

    <div class="statsGrid">

        <div class="statCard">
            <h2 id="totalMachines">0</h2>
            <span>Total Machines</span>
        </div>

        <div class="statCard">
            <h2 id="activeMachines">0</h2>
            <span>Active</span>
        </div>

        <div class="statCard">
            <h2 id="disabledMachines">0</h2>
            <span>Disabled</span>
        </div>

        <div class="statCard">
            <h2 id="vipMachines">0</h2>
            <span>VIP</span>
        </div>

    </div>

      <!-- SEARCH -->

    <div class="searchSection">

        <input
            type="text"
            id="searchMachine"
            placeholder="Search machines...">

    </div>

    <!-- ADD / EDIT MACHINE FORM -->

    <div class="machineForm" id="machineForm">

        <h2 id="formTitle">Add New Machine</h2>

        <div class="grid2">

            <input
                type="text"
                id="machineName"
                placeholder="Machine Name">

            <input
                type="text"
                id="machineSeries"
                placeholder="Machine Series">

            <input
                type="number"
                id="machinePrice"
                placeholder="Price">

            <input
                type="number"
                id="machineReturn"
                placeholder="Total Return">

            <input
                type="number"
                id="machineDuration"
                placeholder="Duration (Days)">

            <select id="machineStatus">

                <option value="true">Active</option>

                <option value="false">Disabled</option>

            </select>

        </div>

        <!-- IMAGE -->

        <div class="uploadSection">

            <label
                for="machineImage"
                class="uploadBtn">

                📷 Upload Machine Image

            </label>

            <input
                type="file"
                id="machineImage"
                accept="image/*"
                hidden>

            <img
                id="previewImage"
                src=""
                alt="Preview">

        </div>

        <!-- VIP -->

        <div class="vipRow">

            <input
                type="checkbox"
                id="machineVIP">

            <label for="machineVIP">

                VIP Machine

            </label>

        </div>

        <!-- BUTTONS -->

        <div class="formActions">

            <button
                id="saveMachine"
                class="successBtn">

                💾 Save Machine

            </button>

            <button
                type="button"
                id="cancelMachine"
                class="secondaryBtn">

                Cancel

            </button>

        </div>

              </div>

      <!-- MACHINES -->

    <h2 class="sectionTitle">
        Mining Machines
    </h2>

    <div
        id="machineList"
        class="machineGrid">

        <!-- JavaScript loads machine cards here -->

    </div>

</div>

<!-- SUCCESS POPUP -->

<div
    class="popup"
    id="successPopup">

    <div class="popupBox">

        <div class="popupIcon">✅</div>

        <h2>Success</h2>

        <p id="successMessage">
            Operation completed successfully.
        </p>

        <div class="popupButtons">

            <button
                id="closeSuccess"
                class="successBtn">

                OK

            </button>

        </div>

    </div>

</div>

<!-- DELETE POPUP -->

<div
    class="popup"
    id="deletePopup">

    <div class="popupBox">

        <div class="popupIcon">🗑️</div>

        <h2>Delete Machine</h2>

        <p>
            Are you sure you want to permanently delete this machine?
        </p>

        <div class="popupButtons">

            <button
                id="confirmDelete"
                class="dangerBtn">

                Delete

            </button>

            <button
                id="cancelDelete"
                class="secondaryBtn">

                Cancel

            </button>

        </div>

    </div>

</div>

<!-- LOADING -->

<div
    id="loadingOverlay"
    class="loadingOverlay">

    <div class="loader"></div>

    <p>Loading...</p>

</div>

<script src="supabase.js"></script>
<script src="admin-machines.js"></script>

</body>
  </html>

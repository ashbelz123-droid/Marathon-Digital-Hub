<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Machine Management</title>

<link rel="stylesheet" href="admin-machines.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

</head>

<body>

<div class="page">

    <!-- HEADER -->

    <div class="topBar">

        <div>

            <h1>Machine Management</h1>

            <p>Manage all mining investment machines</p>

        </div>

        <button id="addMachineBtn" class="primaryBtn">

            + Add Machine

        </button>

    </div>

    <!-- STATISTICS -->

    <div class="statsGrid">

        <div class="statCard">

            <span>Total Machines</span>

            <h2 id="totalMachines">0</h2>

        </div>

        <div class="statCard">

            <span>Active</span>

            <h2 id="activeMachines">0</h2>

        </div>

        <div class="statCard">

            <span>Disabled</span>

            <h2 id="disabledMachines">0</h2>

        </div>

        <div class="statCard">

            <span>VIP</span>

            <h2 id="vipMachines">0</h2>

        </div>

    </div>

    <!-- SEARCH -->

    <div class="searchBox">

        <input

            type="text"

            id="searchInput"

            placeholder="Search machine by name or series...">

    </div>

        <!-- MACHINE FORM -->

    <div id="machineForm" class="machineForm hidden">

        <div class="formHeader">

            <h2 id="formTitle">Add New Machine</h2>

            <button id="closeFormBtn" class="closeBtn">

                ✕

            </button>

        </div>

        <form id="machineFormElement">

            <div class="formGrid">

                <div class="inputGroup">

                    <label>Machine Name</label>

                    <input
                        type="text"
                        id="machineName"
                        required>

                </div>

                <div class="inputGroup">

                    <label>Series</label>

                    <input
                        type="text"
                        id="machineSeries">

                </div>

                <div class="inputGroup">

                    <label>Price (UGX)</label>

                    <input
                        type="number"
                        id="machinePrice"
                        required>

                </div>

                <div class="inputGroup">

                    <label>Total Return (UGX)</label>

                    <input
                        type="number"
                        id="machineReturn"
                        required>

                </div>

                <div class="inputGroup">

                    <label>Duration (Days)</label>

                    <input
                        type="number"
                        id="machineDuration"
                        required>

                </div>

                <div class="inputGroup">

                    <label>Status</label>

                    <select id="machineStatus">

                        <option value="true">

                            Active

                        </option>

                        <option value="false">

                            Disabled

                        </option>

                    </select>

                </div>

            </div>

            <!-- IMAGE -->

            <div class="uploadArea">

                <label for="machineImage" class="uploadButton">

                    📷 Select Machine Image

                </label>

                <input
                    type="file"
                    id="machineImage"
                    accept="image/*"
                    hidden>

                <img
                    id="previewImage"
                    class="previewImage"
                    alt="Preview">

            </div>

            <!-- VIP -->

            <div class="vipRow">

                <input
                    type="checkbox"
                    id="machineVIP">

                <label for="machineVIP">

                    VIP Machine

                </label>

            </div>

            <!-- BUTTONS -->

            <div class="formButtons">

                <button
                    type="submit"
                    class="saveBtn">

                    Save Machine

                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    class="cancelBtn">

                    Cancel

                </button>

            </div>

        </form>

    </div>

        <!-- MACHINE LIST -->

    <div class="listHeader">

        <h2>Mining Machines</h2>

        <span id="machineCount">0 Machines</span>

    </div>

    <div id="machinesContainer" class="machinesGrid">

        <!-- Machine cards loaded by JavaScript -->

    </div>

</div>

<!-- DELETE MODAL -->

<div id="deleteModal" class="modal hidden">

    <div class="modalBox">

        <h2>Delete Machine</h2>

        <p>

            Are you sure you want to permanently delete this machine?

        </p>

        <div class="modalButtons">

            <button
                id="confirmDeleteBtn"
                class="deleteBtn">

                Delete

            </button>

            <button
                id="cancelDeleteBtn"
                class="cancelBtn">

                Cancel

            </button>

        </div>

    </div>

</div>

<!-- LOADING -->

<div id="loadingScreen" class="loading hidden">

    <div class="loader"></div>

    <p>Loading...</p>

</div>

<!-- TOAST -->

<div id="toast" class="toast">

    <span id="toastMessage">

        Success

    </span>

</div>

<script src="admin-machines.js"></script>

</body>

</html>

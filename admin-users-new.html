<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Users | MDH</title><link rel="stylesheet" href="admin-shared.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><main class="admin-wrap"><header class="admin-head"><div><div class="eyebrow">ADMIN CONTROL</div><h1>Users</h1><p>Search and investigate real member accounts.</p></div><a class="back" href="admin-control.html">← Control Center</a></header><section class="panel"><div class="toolbar"><input id="search" class="search" placeholder="Search name, email or phone"><button id="refresh" class="btn">Refresh</button></div><div id="list"><div class="empty">Loading users…</div></div></section></main><script>const db=window.supabaseClient;let users=[];const list=document.getElementById('list');function render(){const q=document.getElementById('search').value.toLowerCase();const a=users.filter(u=>`${u.fullname||''} ${u.email||''} ${u.phone||''}`.toLowerCase().includes(q));list.innerHTML=a.length?a.map(u=>`<div class="row"><div class="badge">${(u.fullname||'U')[0].toUpperCase()}</div><main><h3>${u.fullname||'Unnamed user'}</h3><p>${u.email||'No email'} • ${u.phone||'No phone'}</p></main><span class="badge">${u.account_status||'Active'}</span></div>`).join(''):'<div class="empty">No users found.</div>'}async function load(){try{const{data,error}=await db.from('profiles').select('id,fullname,email,phone,account_status,membership,created_at').order('created_at',{ascending:false});if(error)throw error;users=data||[];render()}catch(e){console.error(e);list.innerHTML='<div class="empty">Could not load users.</div>'}}document.getElementById('search').oninput=render;document.getElementById('refresh').onclick=load;load();</script></body></html>

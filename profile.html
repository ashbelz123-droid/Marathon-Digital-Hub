<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

body{

background:#050B18;
color:white;
padding-bottom:90px;

}

body::before{

content:"";

position:fixed;

left:-40%;
top:-40%;

height:180%;

radial-gradient(circle at 20% 20%,rgba(0,255,255,.18),transparent 35%),

radial-gradient(circle at 80% 20%,rgba(0,140,255,.18),transparent 35%),

radial-gradient(circle at 60% 80%,rgba(0,255,120,.15),transparent 40%);

0%{transform:translateX(-2%);}
50%{transform:translateX(2%);}
100%{transform:translateX(-2%);}

}

padding:20px;

}

.header h2{

font-size:28px;

}

.header p{

margin-top:5px;

color:#9fb5d1;

}

.profileCard{

margin:15px;

background:#08142d;

border-radius:20px;

padding:25px;

text-align:center;

border:1px solid rgba(0,200,255,.15);

}

.avatar{

width:90px;

height:90px;

border-radius:50%;

background:#00ff88;

color:#001018;

font-size:38px;

font-weight:bold;

display:flex;

align-items:center;

justify-content:center;

margin:auto;

margin-bottom:15px;

}

.profileCard h2{

margin-bottom:5px;

}

.profileCard p{

color:#9fb5d1;

}

.section{

margin:15px;

background:#08142d;

border-radius:18px;

padding:20px;

border:1px solid rgba(0,200,255,.15);

}

.section h3{

margin-bottom:15px;

color:#00ff88;

}

.item{

margin-bottom:18px;

}

.item small{

display:block;

color:#9fb5d1;

margin-bottom:5px;

}

.item span{

font-size:17px;

}

.actionBtn{

width:100%;

height:52px;

margin-top:15px;

border:none;

border-radius:14px;

background:#00ff88;

color:#001018;

font-size:17px;

font-weight:bold;

cursor:pointer;

}

.logoutBtn{

background:#ff4444;

color:white;

}

</style>

</head>

<body>

<div class="header">

<h2>Profile</h2>

<p>Manage your Marathon Digital Hub account.</p>

</div>

<div class="profileCard">

<div class="avatar" id="avatar">

U

</div>

<h2 id="fullName">

Loading...

</h2>

<p id="email">

Loading...

</p>

</div>

<div class="section">

<h3>Account Information</h3>

<div class="item">

<small>Phone Number</small>

<span id="phone">

Loading...

</span>

</div>

<div class="item">

<small>Wallet Balance</small>

<span id="wallet">

UGX 0

</span>

</div>

<div class="item">

<small>Referral Code</small>

<span id="referralCode">

Loading...

</span>

</div>

<div class="item">

<small>Referred By</small>

<span id="referredBy">

None

</span>

</div>

<div class="item">

<small>Account Status</small>

<span id="accountStatus">

Active

</span>

</div>

<div class="item">

<small>Member Since</small>

<span id="createdDate">

Loading...

</span>

</div>

</div>

<div class="section">

<h3>Account Actions</h3>

<button
class="actionBtn"
id="editProfile">

Edit Profile

</button>

<button
class="actionBtn"
id="changePassword">

Change Password

</button>

<button
class="actionBtn logoutBtn"
id="logout">

Logout

</button>

  </div><script>

const db = window.supabaseClient;

let currentUser = null;
let profile = null;

/* ===========================
START
=========================== */

document.addEventListener("DOMContentLoaded", async ()=>{

const { data:{ user } } = await db.auth.getUser();

if(!user){

window.location.href="login.html";
return;

}

currentUser=user;

await loadProfile();

});

/* ===========================
LOAD PROFILE
=========================== */

async function loadProfile(){

const { data,error } = await db

.from("profiles")

.select("*")

.eq("id",currentUser.id)

.single();

if(error){

console.log(error);
return;

}

profile=data;

/* Avatar */

const initials=data.fullname
.split(" ")
.map(n=>n[0])
.join("")
.substring(0,2)
.toUpperCase();

document.getElementById("avatar").innerHTML=initials;

/* Basic Details */

document.getElementById("fullName").innerHTML=data.fullname;

document.getElementById("email").innerHTML=data.email ?? "No Email";

document.getElementById("phone").innerHTML=data.phone ?? "Not Set";

document.getElementById("wallet").innerHTML=

"UGX "+Number(data.wallet_balance).toLocaleString();

document.getElementById("referralCode").innerHTML=

data.referral_code ?? "Not Available";

document.getElementById("referredBy").innerHTML=

data.referred_by ?? "None";

document.getElementById("accountStatus").innerHTML=

data.account_status ?? "Active";

document.getElementById("createdDate").innerHTML=

new Date(data.created_at).toLocaleDateString();

}

/* ===========================
EDIT PROFILE
=========================== */

document.getElementById("editProfile").onclick = async ()=>{

const fullname=prompt(

"Enter New Full Name",

profile.fullname

);

if(fullname==null)return;

const phone=prompt(

"Enter Phone Number",

profile.phone

);

if(phone==null)return;

const { error } = await db

.from("profiles")

.update({

fullname:fullname,

phone:phone

})

.eq("id",currentUser.id);

if(error){

alert(error.message);

return;

}

alert("Profile Updated Successfully");

await loadProfile();

};

/* ===========================
CHANGE PASSWORD
=========================== */

document.getElementById("changePassword").onclick = async ()=>{

const password=prompt(

"Enter New Password"

);

if(password==null)return;

if(password.length<6){

alert("Password must be at least 6 characters");

return;

}

const { error } = await db.auth.updateUser({

password:password

});

if(error){

alert(error.message);

return;

}

alert("Password Changed Successfully");

};

/* ===========================
LOGOUT
=========================== */

document.getElementById("logout").onclick = async ()=>{

if(!confirm("Logout from Marathon Digital Hub?")){

return;

}

await db.auth.signOut();

window.location.href="login.html";

};

  </script>

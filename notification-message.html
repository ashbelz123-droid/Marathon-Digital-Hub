<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020d12"><meta name="color-scheme" content="dark"><title>Message | Marathon Digital Hub</title><link rel="stylesheet" href="assets/css/style.css?v=message3"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=message3"></script></head><body><canvas id="network"></canvas><main class="page"><header class="top"><a href="notifications.html?v=message3">← Notifications</a><span>MARATHON DIGITAL HUB</span></header><section id="message" class="message-card"><div class="loading"><div class="spinner"></div><strong>Opening message…</strong><small>Please wait</small></div></section></main><script>(async function(){'use strict';const db=window.supabaseClient,box=document.getElementById('message'),id=new URLSearchParams(location.search).get('id');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function timeout(ms){return new Promise((_,reject)=>setTimeout(()=>reject(new Error('Connection timed out. Please try again.')),ms))}function race(p,ms){return Promise.race([p,timeout(ms)])}function error(msg){box.innerHTML='<div class="error"><div class="error-icon">!</div><h2>Message could not be opened</h2><p>'+esc(msg)+'</p><a href="notifications.html?v=message3">← Back to Messages</a><button onclick="location.reload()">Try Again</button></div>'}try{if(!db)throw new Error('Supabase connection is unavailable.');if(!id)throw new Error('This message link is missing its message ID.');const session=await race(db.auth.getSession(),8000);const user=session?.data?.session?.user;if(!user){location.href='login.html';return}/* user_notifications uses message, not body. Do not request columns that are not in the table. */const result=await race(db.from('user_notifications').select('id,title,message,created_at,is_read,user_id').eq('id',id).eq('user_id',user.id).maybeSingle(),8000);if(result.error)throw result.error;if(!result.data)throw new Error('This message is no longer available for your account.');const n=result.data;box.innerHTML='<div class="sender"><div class="avatar">MDH</div><div><strong>Marathon Digital Hub</strong><small>Official notification</small></div></div><div class="bubble"><div class="label">'+esc(n.title||'MDH Notification')+'</div><div class="body">'+esc(n.message||'You have a new update.')+'</div><div class="time">'+(n.created_at?new Date(n.created_at).toLocaleString():'Recently')+'</div></div>';if(n.is_read===false){const update=await race(db.from('user_notifications').update({is_read:true}).eq('id',id).eq('user_id',user.id).eq('is_read',false),8000);if(update.error)console.warn('Read update failed:',update.error);const countResult=await race(db.from('user_notifications').select('id',{count:'exact',head:true}).eq('user_id',user.id).eq('is_read',false),8000).catch(()=>null);const count=countResult?.count??0;localStorage.setItem('mdh_unread_notifications',String(count));window.dispatchEvent(new CustomEvent('mdh:notifications-updated',{detail:{count}}))}}catch(e){console.error('Notification message:',e);error(e?.message||'Please go back and try again.')}})();</script><style>html,body{margin:0;min-height:100%;background:#020d12;color:#effff7;font-family:Inter,system-ui,sans-serif}.page{width:min(680px,100%);margin:auto;padding:15px;box-sizing:border-box}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;font-size:10px;font-weight:900}.top a{color:#19e889;text-decoration:none}.top span{color:#789f94}.message-card{min-height:360px;padding:20px;border-radius:24px;border:1px solid rgba(25,232,137,.2);background:linear-gradient(145deg,rgba(23,104,84,.28),rgba(4,38,40,.42));box-shadow:0 22px 60px #0008;backdrop-filter:blur(18px)}.sender{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid rgba(112,255,203,.12)}.avatar{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:#19e88918;border:1px solid #19e88944;color:#19e889;font-size:11px;font-weight:900}.sender strong{display:block;font-size:14px}.sender small{display:block;color:#769d92;font-size:9px;margin-top:4px}.bubble{margin-top:24px;padding:18px;border-radius:20px 20px 20px 5px;background:rgba(3,22,25,.58);border:1px solid rgba(112,255,203,.12)}.label{font-size:17px;font-weight:900;margin-bottom:12px}.body{font-size:13px;line-height:1.75;color:#b7d2c9;white-space:pre-wrap;word-break:break-word}.time{margin-top:18px;color:#62877d;font-size:9px}.loading,.error{text-align:center;padding:70px 15px;color:#91afa5}.loading strong{display:block;margin-top:15px;color:#effff7}.loading small{display:block;margin-top:7px;color:#668c82}.spinner{width:28px;height:28px;margin:auto;border:3px solid #19e88922;border-top-color:#19e889;border-radius:50%;animation:spin .8s linear infinite}.error h2{color:#effff7;font-size:18px}.error p{font-size:11px;line-height:1.6}.error a,.error button{display:inline-block;margin:8px 5px 0;padding:11px 14px;border-radius:12px;text-decoration:none;font-weight:900;font-size:10px}.error a{color:#19e889;background:#19e88912;border:1px solid #19e88933}.error button{border:0;background:#19e889;color:#02170d}.error-icon{margin:auto;width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:#ff54701c;color:#ff7183;font-weight:900}@keyframes spin{to{transform:rotate(360deg)}#network{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}</style></body></html>

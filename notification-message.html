<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020d12"><title>Message | Marathon Digital Hub</title><link rel="stylesheet" href="assets/css/style.css?v=message1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=message1"></script></head><body><canvas id="network"></canvas><main class="page"><header class="top"><a href="notifications.html">← Notifications</a><span>MARATHON DIGITAL HUB</span></header><section id="message" class="message-card"><div class="loading">Opening message…</div></section></main><script>(async function(){const db=window.supabaseClient,box=document.getElementById('message');const id=new URLSearchParams(location.search).get('id');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}try{if(!db||!id)throw new Error('Message not found.');const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const r=await db.from('user_notifications').select('*').eq('id',id).eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw new Error('This message could not be found.');const n=r.data;box.innerHTML='<div class="sender"><div class="avatar">MDH</div><div><strong>Marathon Digital Hub</strong><small>Official notification</small></div></div><div class="bubble"><div class="label">'+esc(n.title||'MDH Notification')+'</div><div class="body">'+esc(n.message||n.body||'You have a new update.')+'</div><div class="time">'+(n.created_at?new Date(n.created_at).toLocaleString():'Recently')+'</div></div>';if(n.is_read===false){const u=await db.from('user_notifications').update({is_read:true}).eq('id',id).eq('user_id',user.id).eq('is_read',false).select('id');if(u.error)console.warn('Could not mark message read:',u.error);localStorage.setItem('mdh_unread_notifications','0');window.dispatchEvent(new CustomEvent('mdh:notifications-updated',{detail:{count:0}}))} }catch(e){box.innerHTML='<div class="error"><h2>Message unavailable</h2><p>'+esc(e.message||'Please go back and try again.')+'</p><a href="notifications.html">Back to Notifications</a></div>}})();</script><style>html,body{margin:0;min-height:100%;background:#020d12;color:#effff7;font-family:Inter,system-ui,sans-serif}.page{width:min(680px,100%);margin:auto;padding:15px;box-sizing:border-box}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;font-size:10px;font-weight:900}.top a{color:#19e889;text-decoration:none}.top span{color:#789f94}.message-card{min-height:360px;padding:20px;border-radius:24px;border:1px solid rgba(25,232,137,.2);background:linear-gradient(145deg,rgba(23,104,84,.28),rgba(4,38,40,.42));box-shadow:0 22px 60px #0008;backdrop-filter:blur(18px)}.sender{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid rgba(112,255,203,.12)}.avatar{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:#19e88918;border:1px solid #19e88944;color:#19e889;font-size:11px;font-weight:900}.sender strong{display:block;font-size:14px}.sender small{display:block;color:#769d92;font-size:9px;margin-top:4px}.bubble{margin-top:24px;padding:18px;border-radius:20px 20px 20px 5px;background:rgba(3,22,25,.58);border:1px solid rgba(112,255,203,.12)}.label{font-size:17px;font-weight:900;margin-bottom:12px}.body{font-size:13px;line-height:1.75;color:#b7d2c9;white-space:pre-wrap;word-break:break-word}.time{margin-top:18px;color:#62877d;font-size:9px}.loading,.error{text-align:center;padding:70px 15px;color:#91afa5}.error h2{color:#effff7;font-size:18px}.error a{display:inline-block;margin-top:10px;color:#19e889;text-decoration:none;font-weight:900;font-size:11px}</style></body></html>

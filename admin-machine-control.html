<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machine Control | MDH Admin</title><link rel="stylesheet" href="admin-shared.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><main class="admin-wrap"><header class="admin-head"><div><div class="eyebrow">OPERATIONS</div><h1>Machine Control</h1><p>Inspect machine configuration and status.</p></div><a class="back" href="admin-control.html">← Control Center</a></header><section class="panel"><div id="list"><div class="empty">Loading machines…</div></div></section></main><script>const db=window.supabaseClient;async function load(){const l=document.getElementById('list');try{const{data,error}=await db.from('machines').select('id,name,price,total_return,duration_days,status,is_vip,series').order('id');if(error)throw error;l.innerHTML=data?.length?data.map(x=>`<div class="row"><div class="badge">${x.is_vip?'VIP':'MDH'}</div><main><h3>${x.name||'Machine'}</h3><p>${x.series||'Standard'} • Price UGX ${Number(x.price||0).toLocaleString()} • Return UGX ${Number(x.total_return||0).toLocaleString()} • ${x.duration_days||0} days</p></main><span class="badge">${x.status?'ACTIVE':'DISABLED'}</span></div>`).join(''):'<div class="empty">No machines found.</div>'}catch(e){console.error(e);l.innerHTML='<div class="empty">Machines could not be loaded.</div>'}}load();</script></body></html>

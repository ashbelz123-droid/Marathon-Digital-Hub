<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Payment Settings</title>

<link rel="stylesheet" href="admin-payment-settings.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

</head>

<body>

<header class="header">

<button class="backBtn" onclick="history.back()">

←

</button>

<h2>Payment Settings</h2>

</header>

<div class="container">

<div class="card">

<h3>Mobile Money Settings</h3>

<label>Payment Method</label>

<input
type="text"
id="method"
placeholder="MTN Mobile Money">

<label>Account Name</label>

<input
type="text"
id="accountName"
placeholder="Account Name">

<label>Phone Number</label>

<input
type="text"
id="phoneNumber"
placeholder="+2567XXXXXXXX">

<label>Instructions</label>

<textarea
id="instructions"
rows="5"
placeholder="Deposit instructions..."></textarea>

<div class="switchBox">

<span>Enable Payment Method</span>

<input
type="checkbox"
id="isActive">

</div>

<button id="saveBtn">

Save Settings

</button>

<div id="statusMessage"></div>

</div>

</div>

<script src="admin-payment-settings.js"></script>

</body>

</html>

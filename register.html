<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Marathon Digital Hub - Register</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020b1f;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:430px;
background:#07152f;
padding:25px;
border-radius:25px;
border:1px solid rgba(0,200,255,.3);
box-shadow:0 0 25px rgba(0,200,255,.2);
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
color:#00c8ff;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:white;
margin-bottom:25px;
opacity:.8;
}

.input-group{
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#0b2148;
color:white;
font-size:15px;
}

input:focus{
outline:1px solid #00c8ff;
}

.checkbox{
display:flex;
align-items:center;
gap:10px;
margin-bottom:15px;
color:white;
}

.checkbox input{
width:auto;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#00c8ff;
color:black;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

#error{
color:#ff6b6b;
text-align:center;
margin-bottom:10px;
}

#success{
color:#66ff99;
text-align:center;
margin-bottom:10px;
}

.login-link{
text-align:center;
margin-top:15px;
color:white;
}

.login-link a{
color:#00c8ff;
text-decoration:none;
}

</style></head><body><div class="container"><div class="logo">
Marathon Digital Hub
</div><div class="subtitle">
Create Your Account
</div><div id="error"></div>
<div id="success"></div><div class="input-group">
<input type="text" id="fullname" placeholder="Full Name">
</div><div class="input-group">
<input type="text" id="phone" placeholder="Phone Number">
</div><div class="input-group">
<input type="email" id="email" placeholder="Email Address">
</div><div class="input-group">
<input type="password" id="password" placeholder="Password">
</div><div class="input-group">
<input type="password" id="confirmPassword" placeholder="Confirm Password">
</div><div class="input-group">
<input type="text" id="referral" placeholder="Referral Code (Optional)">
</div><div class="checkbox">
<input type="checkbox" id="showPasswords">
<label for="showPasswords">Show Passwords</label>
</div><button id="registerBtn">
CREATE ACCOUNT
</button><div class="login-link">
Already have an account?
<a href="login.html">Login</a>
</div></div><script src="supabase-config.js"></script><script>

document.getElementById("showPasswords")
.addEventListener("change", function(){

const type = this.checked ? "text" : "password";

document.getElementById("password").type = type;
document.getElementById("confirmPassword").type = type;

});

document.getElementById("registerBtn")
.addEventListener("click", async function(){

const fullname =
document.getElementById("fullname").value.trim();

const phone =
document.getElementById("phone").value.trim();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

const referral =
document.getElementById("referral").value.trim();

document.getElementById("error").innerText = "";
document.getElementById("success").innerText = "";

if(!fullname || !phone || !email || !password || !confirmPassword){

document.getElementById("error").innerText =
"Please fill all required fields";

return;
}

if(password.length < 8){

document.getElementById("error").innerText =
"Password must be at least 8 characters";

return;
}

if(password !== confirmPassword){

document.getElementById("error").innerText =
"Passwords do not match";

return;
}

try{

const { data, error } =
await supabase.auth.signUp(}
email: email,
password: password
});

if(error){
throw error;
}

if(!data.user){
throw new Error("Registration failed");
}

const { error: profileError } =
await supabaseClient
.from("profiles")
.insert([
{
id: data.user.id,
fullname: fullname,
phone: phone,
email: email,
wallet_balance: 0,
referral_code: referral
}
]);

if(profileError){
throw profileError;
}

document.getElementById("success").innerText =
"Account Created Successfully";

setTimeout(function(){
window.location.href = "login.html";
},1500);

}catch(err){

document.getElementById("error").innerText =
err.message;

}

});

</script></body>
</html>

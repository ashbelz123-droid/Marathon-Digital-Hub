<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register - Marathon Digital Hub</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body><canvas id="network"></canvas>

<div class="welcome-container"><div class="form-box"><div class="logo">
MDH
</div><h1 class="title">
Create Account
</h1><p class="subtitle">
Join Marathon Digital Hub
</p><form id="registerForm"><div class="input-group">
<input

id="fullname"

placeholder="Phone Number"
required>
</div><div class="input-group">

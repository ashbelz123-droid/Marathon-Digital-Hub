<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Marathon Digital Hub</title>

<link rel="stylesheet" href="assets/css/style.css">

</head>
<body>

<div class="welcome-container">

<div class="logo">
MDH
</div>

<h1 class="title">
Create Account
</h1>

<p class="subtitle">
Join Marathon Digital Hub Today
</p>

<form class="auth-form">

<input
type="text"
placeholder="Full Name"
required
>

<input
type="tel"
placeholder="Phone Number"
required
>

<input
type="email"
placeholder="Email Address"
required
>

<input
type="password"
placeholder="Password"
required
>

<input
type="password"
placeholder="Confirm Password"
required
>

<input
type="text"
placeholder="Referral Code (Optional)"
>

<button type="submit" class="btn">
Register
</button>

</form>

<p class="auth-link">
Already have an account?

<a href="login.html">
Login
</a>
</p>

</div>

</body>
</html>

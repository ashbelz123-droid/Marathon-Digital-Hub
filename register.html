<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Marathon Digital Hub - Register</title><style>

*{
margin:0;

}

body{

}

.container{
width:100%;
max-width:430px;

}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
color:#00c8ff;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#cfd8dc;
margin-bottom:25px;
}

.input-group{
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#0b2148;
color:white;
font-size:15px;
}

input:focus{
outline:1px solid #00c8ff;
}

.checkbox{
display:flex;
align-items:center;
gap:10px;
margin-bottom:15px;
color:white;
font-size:14px;
}

.checkbox input{
width:auto;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#00c8ff;
color:black;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

#error{
color:#ff6b6b;
text-align:center;
margin-bottom:10px;
}

#success{
color:#5dff9b;
text-align:center;
margin-bottom:10px;
}

.login-link{
text-align:center;
margin-top:15px;
color:white;
}

.login-link a{
color:#00c8ff;
text-decoration:none;
}

</style></head><body><div class="container"><div class="logo">
Marathon Digital Hub
</div><div class="subtitle">
Create Your Account
</div><div id="error"></div>
<div id="success"></div><div class="input-group">
<input type="text" id="fullname" placeholder="Full Name">
</div><div class="input-group">
<input type="text" id="phone" placeholder="Phone Number">
</div><div class="input-group">
<input type="email" id="email" placeholder="Email Address">
</div><div class="input-group">
<input type="password" id="password" placeholder="Password">
</div><div class="input-group">
<input type="password" id="confirmPassword" placeholder="Confirm Password">
</div><div class="input-group">
<input type="text" id="referral" placeholder="Referral Code (Optional)">
</div><div class="checkbox">
<input type="checkbox" id="showPasswords">
<label for="showPasswords">Show Passwords</label>
</div><button id="registerBtn">
CREATE ACCOUNT
</button><div class="login-link">
Already have an account?
<a href="login.html">Login</a>
</div></div><script>

document.getElementById("showPasswords")
.addEventListener("change",function(){

const type =
this.checked ? "text" : "password";

document.getElementById("password").type = type;
document.getElementById("confirmPassword").type = type;

});

document.getElementById("registerBtn")
.addEventListener("click",function(){

const fullname =
document.getElementById("fullname").value.trim();

const phone =
document.getElementById("phone").value.trim();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

document.getElementById("error").innerText="";
document.getElementById("success").innerText="";

if(
!fullname ||
!phone ||
!email ||
!password ||
!confirmPassword
){

document.getElementById("error").innerText =
"Please fill all required fields";

return;

}

if(password.length < 8){

document.getElementById("error").innerText =
"Password must be at least 8 characters";

return;

}

if(password !== confirmPassword){

document.getElementById("error").innerText =
"Passwords do not match";

return;

}

const SUPABASE_URL =
"https://sfimuvisljmezpajxxpf.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmaW11dmlzbGptZXpwYWp4eHBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3ODA5MDEsImV4cCI6MjA5ODM1NjkwMX0.AsXXp8icUq92j54vjOtGk6VeOYoyo0e8AXwycKG_RSQ";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

(async()=>{

try{

const { data, error } =
await supabase
.from("profiles")
.insert([
{
fullname: fullname,
phone: phone,
email: email,
wallet_balance: 0
}
]);

if(error){
throw error;
}

document.getElementById("success").innerText =
"Account Created Successfully";

}catch(err){

document.getElementById("error").innerText =
err.message;

}

})();

});

</script>
</body>
</html>

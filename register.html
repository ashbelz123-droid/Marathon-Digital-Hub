<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
background:#020b1f;
font-family:Arial,sans-serif;
color:white;
padding:20px;
}

.container{
max-width:400px;
margin:auto;
margin-top:50px;
background:#03142f;
padding:20px;
border-radius:20px;
border:1px solid #00c8ff;
}

h1{
text-align:center;
color:#00c8ff;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
margin-bottom:12px;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:15px;
background:#00c8ff;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

a{
color:#00c8ff;
}

</style>
</head>
<body>

<div class="container">

<h1>Create Account</h1>

<input
type="text"
id="fullname"
placeholder="Full Name">

<input
type="text"
id="phone"
placeholder="Phone Number">

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="registerUser()">
CREATE ACCOUNT
</button>

<p style="margin-top:15px;text-align:center;">
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

<script>

const SUPABASE_URL =
"https://wcrrxsrtbelcbycppieg.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjcnJ4c3J0YmVsY2J5Y3BwaWVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MTM0ODQsImV4cCI6MjA5NjE4OTQ4NH0.yh_xCiEW2T9riiDJgEWBmIU4V0e5azRQ0sITaEhfCo4";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function registerUser(){

const fullname =
document.getElementById(
"fullname"
).value;

const phone =
document.getElementById(
"phone"
).value;

const email =
document.getElementById(
"email"
).value;

const password =
document.getElementById(
"password"
).value;

if(
!fullname ||
!phone ||
!email ||
!password
){

alert(
"Fill all fields"
);

return;

}

const {
data,
error
}
=
await supabase.auth.signUp({

email,
password

});

if(error){

alert(
error.message
);

return;

}

const user =
data.user;

const referralCode =
"MDH" +
Math.floor(
100000 +
Math.random()*900000
);

await supabase
.from("profiles")
.insert({

id:user.id,

fullname,

phone,

email,

wallet_balance:0,

referral_code:
referralCode

});

alert(
"Account Created Successfully"
);

window.location =
"login.html";

}

</script>

</body>
</html>

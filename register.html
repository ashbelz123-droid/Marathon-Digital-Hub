<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marathon Digital Hub - Register</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020b1f;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:420px;
background:#03142f;
padding:25px;
border-radius:25px;
border:1px solid rgba(0,200,255,.3);
box-shadow:0 0 25px rgba(0,200,255,.2);
color:white;
}

.logo{
text-align:center;
font-size:30px;
font-weight:bold;
color:#00c8ff;
margin-bottom:10px;
}

.subtitle{
text-align:center;
margin-bottom:25px;
opacity:.8;
}

.input-group{
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#081f44;
color:white;
}

input:focus{
outline:1px solid #00c8ff;
}

.checkbox{
display:flex;
align-items:center;
gap:10px;
margin:10px 0;
font-size:14px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#00c8ff;
color:#000;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

#error{
color:#ff6b6b;
text-align:center;
margin-bottom:10px;
}

#success{
color:#5dff9b;
text-align:center;
margin-bottom:10px;
}

.login-link{
text-align:center;
margin-top:15px;
}

.login-link a{
color:#00c8ff;
text-decoration:none;
}

</style></head><body><div class="container"><div class="logo">
Marathon Digital Hub
</div><div class="subtitle">
Create Your Account
</div><div id="error"></div>
<div id="success"></div><div class="input-group">
<input type="text" id="fullname" placeholder="Full Name">
</div><div class="input-group">
<input type="text" id="phone" placeholder="Phone Number">
</div><div class="input-group">
<input type="email" id="email" placeholder="Email Address">
</div><div class="input-group">
<input type="password" id="password" placeholder="Password">
</div><div class="input-group">
<input type="password" id="confirmPassword" placeholder="Confirm Password">
</div><div class="input-group">
<input type="text" id="referral" placeholder="Referral Code (Optional)">
</div><div class="checkbox">
<input type="checkbox" id="showPasswords">
<label>Show Passwords</label>
</div><button id="registerBtn">
CREATE ACCOUNT
</button><div class="login-link">
Already have an account?
<a href="login.html">Login</a>
</div></div><script>

const SUPABASE_URL =
"https://wcrrxsrtbelcbycppieg.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjcnJ4c3J0YmVsY2J5Y3BwaWVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MTM0ODQsImV4cCI6MjA5NjE4OTQ4NH0.yh_xCiEW2T9riiDJgEWBmIU4V0e5azRQ0sITaEhfCo4";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

document.getElementById("showPasswords")
.addEventListener("change",function(){

const type =
this.checked ? "text" : "password";

document.getElementById("password").type = type;
document.getElementById("confirmPassword").type = type;

});

document.getElementById("registerBtn")
.addEventListener("click", async function(){

const fullname =
document.getElementById("fullname").value.trim();

const phone =
document.getElementById("phone").value.trim();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

const referral =
document.getElementById("referral").value.trim();

document.getElementById("error").innerText="";
document.getElementById("success").innerText="";

if(!fullname || !phone || !email || !password || !confirmPassword){

document.getElementById("error").innerText =
"Please fill all required fields";

return;

}

if(password !== confirmPassword){

document.getElementById("error").innerText =
"Passwords do not match";

return;

}

try{

document.getElementById("registerBtn").disabled = true;
document.getElementById("registerBtn").innerText =
"Creating Account...";

        alert("Trying signup...");
const { data, error } =
await supabase.auth.signUp({
email,
password
});

if(error){
throw error;
}

await supabase
.from("profiles")
.insert({
id:data.user.id,
fullname,
phone,
email,
wallet_balance:0,
referral_code:referral
});

document.getElementById("success").innerText =
"Account Created Successfully";

setTimeout(()=>{
window.location.href="login.html";
},1500);

}catch(err){

document.getElementById("error").innerText =
err.message;

document.getElementById("registerBtn").disabled = false;
document.getElementById("registerBtn").innerText =
"CREATE ACCOUNT";

}

});

</script></body>
        </html>

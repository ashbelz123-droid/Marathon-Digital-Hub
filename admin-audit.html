<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Audit Log | MDH</title><link rel="stylesheet" href="admin-shared.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><main class="admin-wrap"><header class="admin-head"><div><div class="eyebrow">SECURITY</div><h1>Admin Audit Log</h1><p>Every recorded administrator action.</p></div><a class="back" href="admin-control.html">← Control Center</a></header><section class="panel"><div id="list"><div class="empty">Loading audit records…</div></div></section></main><script>const db=window.supabaseClient;async function load(){const list=document.getElementById('list');try{const{data,error}=await db.from('admin_audit_log').select('id,admin_id,action,target_user_id,target_type,details,created_at').order('created_at',{ascending:false}).limit(100);if(error)throw error;list.innerHTML=data?.length?data.map(x=>`<div class="row"><div class="badge">LOG</div><main><h3>${x.action||'Admin action'}</h3><p>${x.target_type||'System'}${x.target_user_id?' • User '+x.target_user_id:''} • ${new Date(x.created_at).toLocaleString()}</p></main></div>`).join(''):'<div class="empty">No audit records yet.</div>'}catch(e){console.error(e);list.innerHTML='<div class="empty">Audit log unavailable.</div>'}}load();</script></body></html>

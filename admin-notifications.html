<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Notifications</title>
<link rel="stylesheet" href="admin-notifications.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>
<header class="header">
<button class="backBtn" onclick="history.back()">←</button>
<h2>Notifications</h2>
</header>

<div class="container">
<div class="card">
<h3>Create Notification</h3>
<label>Title</label>
<input type="text" id="title" placeholder="Notification title">
<label>Message</label>
<textarea id="message" rows="6" placeholder="Write notification..."></textarea>
<label>Type</label>
<select id="type">
<option value="info">Information</option>
<option value="deposit">Deposit</option>
<option value="withdrawal">Withdrawal</option>
<option value="promotion">Promotion</option>
</select>
<div class="switchBox">
<span>Active</span>
<input type="checkbox" id="isActive" checked>
</div>
<button id="sendBtn">Publish Notification</button>
<div id="statusMessage"></div>
</div>

<h3 class="listTitle">Published Notifications</h3>
<div id="notificationList"></div>
</div>

<script src="admin-notifications.js"></script>
</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06131f"><title>Forgot Password | MDH</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><link rel="stylesheet" href="assets/css/mdh-ui.css"><style>body{margin:0;min-height:100vh;background:#06131f;color:#effff7;display:grid;place-items:center;padding:20px;font-family:Inter,system-ui}.card{width:min(430px,100%);padding:28px 22px;border-radius:28px;background:rgba(8,34,42,.82);border:1px solid rgba(25,232,137,.2);backdrop-filter:blur(18px);box-shadow:0 25px 70px #0008}h1{margin:0 0 8px;font-size:25px}p{color:#91afa5;font-size:13px;line-height:1.5}.input{width:100%;box-sizing:border-box;padding:15px;border-radius:14px;border:1px solid #ffffff16;background:#0004;color:#fff;outline:none;margin:12px 0}button{width:100%;padding:15px;border:0;border-radius:14px;background:#19e889;color:#03150e;font-weight:900}a{display:block;text-align:center;margin-top:16px;color:#35f59f;text-decoration:none;font-size:13px}.msg{text-align:center;margin-top:12px;font-size:12px}.error{color:#ff687a}.success{color:#63f5a5}</style></head><body><main class="card"><h1>Reset your password</h1><p>Enter the email linked to your MDH account. We'll send you a secure password reset link.</p><input class="input" id="email" type="email" autocomplete="email" placeholder="Email address"><button id="send">SEND RESET LINK</button><div id="msg" class="msg"></div><a href="login.html">← Back to Login</a></main><script>document.getElementById('send').onclick=async()=>{const email=document.getElementById('email').value.trim(),msg=document.getElementById('msg');msg.className='msg';msg.textContent='';if(!email){msg.classList.add('error');msg.textContent='Enter your email address.';return}try{const{error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:new URL('reset-password.html',location.href).href});if(error)throw error;msg.classList.add('success');msg.textContent='Reset link sent. Check your email.'}catch(e){msg.classList.add('error');msg.textContent=e.message}}</script></body></html>

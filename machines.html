// ======================
// MACHINE DISPLAY
// ======================

function filterMachines(series, element){

document
.querySelectorAll('.tab')
.forEach(tab=>{
tab.classList.remove('active');
});

if(element){
element.classList.add('active');
}

const container =
document.getElementById(
'machineContainer'
);

container.innerHTML='';

const filtered =
series === 'all'
? machines
: machines.filter(
m => m.series === series
);

filtered.forEach(machine=>{

const dailyIncome =
Math.floor(
machine.totalReturn /
machine.days
);

container.innerHTML += `

<div class="machine-card">

<div class="machine-name">
${machine.name}
</div>

<div class="machine-row">
<span>Price</span>
<span>UGX ${machine.price.toLocaleString()}</span>
</div>

<div class="machine-row">
<span>Total Return</span>
<span>UGX ${machine.totalReturn.toLocaleString()}</span>
</div>

<div class="machine-row">
<span>Duration</span>
<span>${machine.days} Days</span>
</div>

<div class="machine-row">
<span>Daily Income</span>
<span>UGX ${dailyIncome.toLocaleString()}</span>
</div>

<button
class="buy-btn"
onclick="buyMachine('${machine.name}')">

BUY NOW

</button>

</div>

`;

});

}

   // ======================

async function loadBalance(){

try{

const {
data:{user}
}
=
await supabase.auth.getUser();

if(!user) return;

const {
data
}
=
await supabase
.from('profiles')
.select('balance')
.eq('id',user.id)
.single();

if(data){

document.getElementById(
'userBalance'
).innerText =

'UGX ' +
Number(
data.balance || 0
).toLocaleString();

}

}catch(err){

console.log(err);

}

}

// ======================
// BUY MACHINE
// ======================

async function buyMachine(machineName){

try{

const machine =
machines.find(
m => m.name === machineName
);

if(!machine) return;

const {
data:{user}
}
=
await supabase.auth.getUser();

if(!user){

alert(
'Please login first'
);

return;

}

const {
data:profile,
error:profileError
}
=
await supabase
.from('profiles')
.select('*')
.eq('id',user.id)
.single();

if(profileError){

alert(
'Profile not found'
);

return;

}

const balance =
Number(
profile.balance || 0
);

if(balance < machine.price){

alert(
'Insufficient Balance'
);

return;

}

/* DEDUCT WALLET */

const newBalance =
balance - machine.price;

const {
error:updateError
}
=
await supabase
.from('profiles')
.update({

balance:newBalance

})
.eq(
'id',
user.id
);

if(updateError){

alert(
'Balance update failed'
);

return;

}

/* SAVE PURCHASE */

const expiry =
new Date();

expiry.setDate(
expiry.getDate() +
machine.days
);

const dailyIncome =
Math.floor(
machine.totalReturn /
machine.days
);

const {
error:purchaseError
}
=
await supabase
.from('user_machines')
.insert({

user_id:user.id,

machine_name:
machine.name,

machine_series:
machine.series,

purchase_price:
machine.price,

total_return:
machine.totalReturn,

daily_income:
dailyIncome,

days_remaining:
machine.days,

active:true,

expiry_date:
expiry.toISOString(),

created_at:
new Date().toISOString()

});

if(purchaseError){

alert(
purchaseError.message
);

return;

}

alert(

machine.name +
' Purchased Successfully'

);

loadBalance();

}catch(err){

alert(
err.message
);

}

}

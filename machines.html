<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Machines Center</title>

<style>

body{
background:#020b1f;
color:white;
font-family:Arial,sans-serif;
padding:15px;
}

h1{
text-align:center;
color:#00c8ff;
}

.machine-card{
background:#03142f;
border:1px solid #00c8ff;
border-radius:20px;
padding:20px;
margin-bottom:15px;
}

.machine-name{
font-size:24px;
font-weight:bold;
color:#00c8ff;
margin-bottom:10px;
}

.machine-row{
display:flex;
justify-content:space-between;
margin:8px 0;
}

.buy-btn{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:#00c8ff;
color:#000;
font-weight:bold;
font-size:16px;
}

</style>
</head>

<body>

<h1>Machines Center</h1>

<div id="machineContainer"></div>

<script>

const machines = [

{
name:"VIP1",
price:18000,
income:40000,
days:20
},

{
name:"B1",
price:30000,
income:50000,
days:20
},

{
name:"R1",
price:57000,
income:142000,
days:120
},

{
name:"D1",
price:120000,
income:1350000,
days:100
}

];

const container =
document.getElementById(
"machineContainer"
);

machines.forEach(machine=>{

const dailyIncome =
Math.floor(
machine.income /
machine.days
);

container.innerHTML += `

<div class="machine-card">

<div class="machine-name">
${machine.name}
</div>

<div class="machine-row">
<span>Price</span>
<span>
UGX ${machine.price.toLocaleString()}
</span>
</div>

<div class="machine-row">
<span>Total Return</span>
<span>
UGX ${machine.income.toLocaleString()}
</span>
</div>

<div class="machine-row">
<span>Duration</span>
<span>
${machine.days} Days
</span>
</div>

<div class="machine-row">
<span>Daily Income</span>
<span>
UGX ${dailyIncome.toLocaleString()}
</span>
</div>

<button
class="buy-btn"
onclick="buyMachine('${machine.name}')"
function buyMachine(name){
alert(name + " selected");
}

BUY NOW

</button>

</div>

`;

});

</script>

</body>
</html>

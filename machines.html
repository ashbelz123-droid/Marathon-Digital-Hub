<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Machines | Marathon Digital Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Your Existing Supabase File -->
<script src="supabase-config.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050B18;
color:#fff;
overflow-x:hidden;
padding-bottom:90px;

}

/* Animated Background */

body::before{

content:"";

position:fixed;

left:-40%;
top:-40%;

width:180%;
height:180%;

background:

radial-gradient(circle at 20% 20%,rgba(0,255,255,.15),transparent 35%),

radial-gradient(circle at 80% 20%,rgba(0,100,255,.18),transparent 35%),

radial-gradient(circle at 70% 80%,rgba(0,255,120,.15),transparent 40%),

radial-gradient(circle at 20% 80%,rgba(140,0,255,.18),transparent 35%);

animation:bgMove 18s linear infinite;

z-index:-2;

}

@keyframes bgMove{

0%{transform:translateX(-2%);}
50%{transform:translateX(2%);}
100%{transform:translateX(-2%);}

}

/* Header */

.header{

height:70px;

display:flex;

justify-content:center;

align-items:center;

font-size:30px;

font-weight:bold;

background:linear-gradient(90deg,#00C8FF,#00FF88);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.subtitle{

text-align:center;

font-size:22px;

margin-top:8px;

margin-bottom:25px;

font-weight:bold;

}

/* Series Tabs */

#seriesTabs{

display:flex;

overflow-x:auto;

gap:10px;

padding:0 15px 20px;

scrollbar-width:none;

}

#seriesTabs::-webkit-scrollbar{

display:none;

}

.tab{

padding:12px 18px;

background:#0A1732;

border:1px solid rgba(0,200,255,.25);

border-radius:25px;

white-space:nowrap;

cursor:pointer;

transition:.3s;

}

.tab.active{

background:linear-gradient(90deg,#00C8FF,#00FF88);

color:#001018;

font-weight:bold;

}

/* Machine Area */

#machines{

padding:0 15px;

display:flex;

flex-direction:column;

gap:15px;

}

.loading{

padding:50px;

text-align:center;

color:#00C8FF;

font-size:18px;

}

</style>

</head>

<body>

<div class="header">

MARATHON

</div>

<div class="subtitle">

Machines

</div>

<div id="seriesTabs">

</div>

<div id="machines">

<div class="loading">

Loading Machines...

</div>

</div><script>

/* ===============================
SUPABASE
=============================== */

const db = window.supabaseClient;

let currentUser = null;
let allMachines = [];
let groupedMachines = {};

/* ===============================
START PAGE
=============================== */

document.addEventListener("DOMContentLoaded", async () => {

const { data:{ user } } = await db.auth.getUser();

if(!user){

window.location.href="login.html";

return;

}

currentUser = user;

await loadMachines();

});

/* ===============================
LOAD MACHINES
=============================== */

async function loadMachines(){

document.getElementById("machines").innerHTML=
'<div class="loading">Loading Machines...</div>';

const { data,error } = await db

.from("machines")

.select("*")

.eq("status",true)

.order("price",{ascending:true});

if(error){

console.log(error);

document.getElementById("machines").innerHTML=
'<div class="loading">Failed To Load Machines</div>';

return;

}

allMachines = data;

buildSeries();

showMachines("ALL");

}

/* ===============================
BUILD SERIES TABS
=============================== */

function buildSeries(){

const tabs=document.getElementById("seriesTabs");

tabs.innerHTML="";

groupedMachines={};

/* ALL TAB */

const all=document.createElement("div");

all.className="tab active";

all.innerText="All";

all.onclick=function(){

changeTab(this);

showMachines("ALL");

};

tabs.appendChild(all);

/* GROUP MACHINES */

allMachines.forEach(machine=>{

let series=machine.series;

/* Remove numbers */

series=series.replace(/[0-9]/g,"").trim();

if(!groupedMachines[series]){

groupedMachines[series]=[];

}

groupedMachines[series].push(machine);

});

/* CREATE TABS */

Object.keys(groupedMachines).forEach(series=>{

const btn=document.createElement("div");

btn.className="tab";

btn.innerText=series;

btn.onclick=function(){

changeTab(this);

showMachines(series);

};

tabs.appendChild(btn);

});

}

/* ===============================
ACTIVE TAB
=============================== */

function changeTab(tab){

document.querySelectorAll(".tab")

.forEach(t=>t.classList.remove("active"));

tab.classList.add("active");

}

</script><script>

/* ===========================
SHOW MACHINES
=========================== */

function showMachines(series){

const container=document.getElementById("machines");

container.innerHTML="";

/* Select machines */

let machinesToShow=[];

if(series==="ALL"){

machinesToShow=allMachines;

}else{

machinesToShow=groupedMachines[series] || [];

}

/* Empty */

if(machinesToShow.length===0){

container.innerHTML=`
<div class="loading">
No Machines Available
</div>
`;

return;

}

/* Cards */

machinesToShow.forEach(machine=>{

container.innerHTML+=`

<div class="machine-card">

<div class="machine-head">

<h3>${machine.name}</h3>

<span>${machine.series}</span>

</div>

<div class="machine-body">

<div class="row">

<label>Price</label>

<strong>

UGX ${Number(machine.price).toLocaleString()}

</strong>

</div>

<div class="row">

<label>Total Return</label>

<strong>

UGX ${Number(machine.total_return).toLocaleString()}

</strong>

</div>

<div class="row">

<label>Duration</label>

<strong>

${machine.duration_days} Days

</strong>

</div>

</div>

<button

class="buy-btn"

onclick="buyMachine('${machine.id}')">

BUY MACHINE

</button>

</div>

`;

});

}

</script>

<style>

.machine-card{

background:#08142d;

border:1px solid rgba(0,200,255,.20);

border-radius:18px;

padding:18px;

margin-bottom:15px;

transition:.3s;

}

.machine-card:hover{

border-color:#00c8ff;

box-shadow:0 0 15px rgba(0,200,255,.15);

}

.machine-head{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:15px;

}

.machine-head h3{

font-size:20px;

color:#00ff88;

}

.machine-head span{

background:#00c8ff;

color:#001018;

padding:5px 12px;

border-radius:20px;

font-size:12px;

font-weight:bold;

}

.machine-body .row{

display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px solid rgba(255,255,255,.08);

}

.machine-body label{

color:#9fb5d1;

}

.machine-body strong{

color:#ffffff;

}

.buy-btn{

width:100%;

margin-top:18px;

padding:14px;

border:none;

border-radius:12px;

background:linear-gradient(90deg,#00c8ff,#00ff88);

color:#001018;

font-weight:bold;

font-size:15px;

cursor:pointer;

transition:.3s;

}

.buy-btn:hover{

transform:scale(.98);

}

</style><script>

/* ==========================================
BUY MACHINE
========================================== */

async function buyMachine(machineId){

try{

/* Get machine */

const { data:machine,error:machineError } = await db

.from("machines")

.select("*")

.eq("id",machineId)

.single();

if(machineError){

alert("Machine not found.");

return;

}

/* Get user wallet */

const { data:profile,error:profileError } = await db

.from("profiles")

.select("wallet_balance")

.eq("id",currentUser.id)

.single();

if(profileError){

alert("Unable to load wallet.");

return;

}

const wallet=Number(profile.wallet_balance);
const price=Number(machine.price);

if(wallet<price){

alert("Insufficient Balance");

return;

}

/* Check if already purchased */

const { data:existing } = await db

.from("user_machines")

.select("id")

.eq("user_id",currentUser.id)

.eq("machine_id",machineId);

if(existing && existing.length>0){

alert("You already own this machine.");

return;

}

/* Update wallet */

const { error:updateError } = await db

.from("profiles")

.update({

wallet_balance:wallet-price

})

.eq("id",currentUser.id);

if(updateError){

console.log(updateError);

alert("Wallet update failed.");

return;

}

/* Expiry */

const expiry=new Date();

expiry.setDate(

expiry.getDate()+

Number(machine.duration_days)

);

/* Save Purchase */

const { error:purchaseError } = await db

.from("user_machines")

.insert({

user_id:currentUser.id,

machine_id:machine.id,

amount_paid:price,

purchase_date:new Date().toISOString(),

expiry_date:expiry.toISOString(),

status:"active"

});

if(purchaseError){

console.log(purchaseError);

alert("Purchase failed.");

return;

}

/* Refresh */

alert("Machine Purchased Successfully!");

await loadMachines();

}catch(err){

console.log(err);

alert("Unexpected Error");

}

}

</script>

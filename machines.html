<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Machine Test V2</title>

<style>

body{
background:#020b1f;
color:white;
font-family:Arial,sans-serif;
padding:15px;
}

.header{
text-align:center;
margin-bottom:20px;
}

.balance{
background:#03142f;
padding:20px;
border-radius:20px;
margin-bottom:20px;
border:1px solid #00c8ff;
}

.balance h2{
color:#00c8ff;
}

.machine{
background:#03142f;
padding:20px;
border-radius:20px;
margin-bottom:15px;
border:1px solid #00c8ff;
}

.machine h3{
color:#00c8ff;
margin-bottom:10px;
}

.buy{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#00c8ff;
font-weight:bold;
margin-top:10px;
}

</style>
</head>

<body>

<div class="header">
<h1>Machine Test V2</h1>
</div>

<div class="balance">
<h2 id="wallet">UGX 1,000,000</h2>
<p>Wallet Balance</p>
<p>Machines Owned: <span id="owned">0</span></p>
</div>

<div id="machines"></div>

<script>

let wallet = 1000000;
let owned = 0;

const data = [

{name:"VIP1",price:18000},
{name:"VIP2",price:36000},
{name:"VIP3",price:80000},
{name:"B1",price:30000},
{name:"B2",price:70000},
{name:"D1",price:120000},
{name:"R1",price:57000},
{name:"R2",price:68500}

];

const box =
document.getElementById("machines");

data.forEach(machine=>{

box.innerHTML += `

<div class="machine">

<h3>${machine.name}</h3>

<p>Price:
UGX ${machine.price.toLocaleString()}</p>

<button
class="buy"
onclick="buy(${machine.price},'${machine.name}')">

BUY NOW

</button>

</div>

`;

});

function buy(price,name){

if(wallet < price){

alert("Insufficient Balance");

return;

}

wallet -= price;
owned++;

document.getElementById(
"wallet"
).innerText =
"UGX " +
wallet.toLocaleString();

document.getElementById(
"owned"
).innerText =
owned;

alert(
name + " purchased successfully"
);

}

</script>

</body>
</html>

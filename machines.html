<style>

margin:0;

body{

background:#040817;

color:#fff;

}

/* Background */

body::before{

content:"";

position:fixed;

left:-30%;

top:-30%;

width:170%;

height:170%;

background:

radial-gradient(circle at 15% 20%,rgba(0,255,255,.18),transparent 35%),

radial-gradient(circle at 80% 15%,rgba(170,0,255,.18),transparent 35%),

radial-gradient(circle at 70% 85%,rgba(0,120,255,.18),transparent 40%),

radial-gradient(circle at 25% 75%,rgba(0,255,140,.15),transparent 35%);

animation:bgMove 20s linear infinite;

z-index:-2;

}

@keyframes bgMove{

0%{

transform:translateX(-3%);

}

50%{

transform:translateX(3%);

}

100%{

transform:translateX(-3%);

}

}

/* Header */

.header{

height:70px;

display:flex;

justify-content:space-between;

align-items:center;

padding:20px;

}

.logo{

font-size:28px;

font-weight:bold;

background:linear-gradient(90deg,#00c8ff,#00ff88);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.notify{

font-size:24px;

}

/* Wallet */

.wallet{

margin:20px;

padding:20px;

border-radius:22px;

background:rgba(8,20,45,.75);

border:1px solid rgba(0,200,255,.25);

backdrop-filter:blur(15px);

}

.wallet small{

color:#b6c9e8;

}

.wallet h2{

margin-top:10px;

font-size:35px;

background:linear-gradient(90deg,#00c8ff,#00ff88);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

/* Series */

.series-container{

display:flex;

gap:10px;

overflow-x:auto;

padding:0 20px 20px;

}

.series-container::-webkit-scrollbar{

display:none;

}

.series{

padding:12px 20px;

border-radius:30px;

background:#07152f;

border:1px solid rgba(0,200,255,.25);

cursor:pointer;

white-space:nowrap;

font-size:14px;

}

.series.active{

background:linear-gradient(90deg,#00c8ff,#00ff88);

color:#001018;

font-weight:bold;

}

/* Machines */

#machineContainer{

padding:0 20px;

display:grid;

gap:15px;

}

</style>

<body>

<div class="header">

<div class="logo">

MARATHON

</div>

<div class="notify">

🔔

</div>

</div>

<div class="wallet">

<small>Wallet Balance</small>

<h2 id="walletBalance">

UGX 0

</h2>

</div>

<div
id="seriesContainer"
class="series-container">

</div>

<div
id="machineContainer">

</div><script>

const db = window.supabaseClient;

let currentUser = null;
let currentSeries = "ALL";

async function initializePage(){

const { data:{ user } } = await db.auth.getUser();

if(!user){

location.href="login.html";

return;

}

currentUser = user;

await loadWallet();

await loadSeries();

await loadMachines("ALL");

}

/* ==========================
LOAD WALLET
========================== */

async function loadWallet(){

const { data,error } = await db

.from("profiles")

.select("wallet_balance")

.eq("id",currentUser.id)

.single();

if(error) return;

document.getElementById("walletBalance").innerHTML=

"UGX " +

Number(data.wallet_balance).toLocaleString();

}

/* ==========================
LOAD SERIES
========================== */

async function loadSeries(){

const container = document.getElementById("seriesContainer");

container.innerHTML="";

/* ALL BUTTON */

container.innerHTML += `

<div class="series active"

onclick="changeSeries('ALL',this)">

All

</div>

`;

const { data,error } = await db

.from("machines")

.select("series")

.eq("status",true);

if(error) return;

const unique = [...new Set(data.map(x=>x.series))];

unique.forEach(series=>{

container.innerHTML += `

<div class="series"

onclick="changeSeries('${series}',this)">

${series} Series

</div>

`;

});

}

/* ==========================
CHANGE SERIES
========================== */

function changeSeries(series,button){

currentSeries = series;

document

.querySelectorAll(".series")

.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

loadMachines(series);

}

</script><script>

/* ==========================
LOAD MACHINES
========================== */

async function loadMachines(series="ALL"){

const container=document.getElementById("machineContainer");

container.innerHTML="<div class='loading'>Loading Machines...</div>";

let query=db
.from("machines")
.select("*")
.eq("status",true)
.order("price",{ascending:true});

if(series!=="ALL"){

query=query.eq("series",series);

}

const {data,error}=await query;

if(error){

container.innerHTML="<div class='loading'>Failed to load machines.</div>";

console.log(error);

return;

}

if(!data || data.length===0){

container.innerHTML="<div class='loading'>No Machines Found</div>";

return;

}

container.innerHTML="";

data.forEach(machine=>{

container.innerHTML+=`

<div class="machine-card">

<div class="machine-header">

<div class="machine-title">

${machine.name}

</div>

<div class="machine-series">

${machine.series}

</div>

</div>

<div class="machine-info">

<div>

<span>Price</span>

<strong>

UGX ${Number(machine.price).toLocaleString()}

</strong>

</div>

<div>

<span>Total Return</span>

<strong>

UGX ${Number(machine.total_return).toLocaleString()}

</strong>

</div>

<div>

<span>Duration</span>

<strong>

${machine.duration_days} Days

</strong>

</div>

</div>

<button
class="buyBtn"
onclick="buyMachine('${machine.id}')">

Buy Machine

</button>

</div>

`;

});

}

/* START PAGE */

initializePage();

</script>

<style>

</style><script>

/* ==========================
BUY MACHINE
========================== */

async function buyMachine(machineId){

try{

/* Logged User */

const { data:{ user } } = await db.auth.getUser();

if(!user){

alert("Please login first.");

return;

}

/* Machine */

const { data:machine,error:machineError } = await db

.from("machines")

.select("*")

.eq("id",machineId)

.single();

if(machineError){

alert("Machine not found.");

return;

}

/* Wallet */

const { data:profile,error:profileError } = await db

.from("profiles")

.select("wallet_balance")

.eq("id",user.id)

.single();

if(profileError){

alert("Wallet not found.");

return;

}

const balance=Number(profile.wallet_balance);

const price=Number(machine.price);

if(balance<price){

alert("Insufficient Balance");

return;

}

/* Deduct Wallet */

const newBalance=balance-price;

const { error:updateError }=await db

.from("profiles")

.update({

wallet_balance:newBalance

})

.eq("id",user.id);

if(updateError){

alert("Failed to update wallet.");

return;

}

/* Save Purchase */

const expiry=new Date();

expiry.setDate(

expiry.getDate()+

Number(machine.duration_days)

);

const { error:purchaseError }=await db

.from("user_machines")

.insert({

user_id:user.id,

machine_id:machine.id,

amount_paid:price,

purchase_date:new Date(),

expiry_date:expiry,

status:"active"

});

if(purchaseError){

alert("Purchase failed.");

return;

}

/* Reload Wallet */

loadWallet();

/* Success */

alert(

"✅ Machine Purchased Successfully!"

);

}catch(err){

console.log(err);

alert("Something went wrong.");

}

}

</script>

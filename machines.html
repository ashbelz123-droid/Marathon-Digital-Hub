<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Machines | Marathon Digital Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050B18;
color:#fff;
overflow-x:hidden;
padding-bottom:90px;

}

/* Animated Background */

body::before{

content:"";

position:fixed;

left:-40%;
top:-40%;

width:180%;
height:180%;

background:

radial-gradient(circle at 20% 20%,rgba(0,255,255,.15),transparent 35%),

radial-gradient(circle at 80% 20%,rgba(0,100,255,.18),transparent 35%),

radial-gradient(circle at 70% 80%,rgba(0,255,120,.15),transparent 40%),

radial-gradient(circle at 20% 80%,rgba(140,0,255,.18),transparent 35%);

animation:bgMove 18s linear infinite;

z-index:-2;

}

@keyframes bgMove{

0%{transform:translateX(-2%);}
50%{transform:translateX(2%);}
100%{transform:translateX(-2%);}

}

/* Header */

.header{

height:70px;

display:flex;

justify-content:center;

align-items:center;

font-size:30px;

font-weight:bold;

background:linear-gradient(90deg,#00C8FF,#00FF88);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.subtitle{

text-align:center;

font-size:22px;

font-weight:bold;

margin-top:8px;

margin-bottom:20px;

}

/* Series Tabs */

#seriesTabs{

display:flex;

overflow-x:auto;

gap:10px;

padding:0 15px 20px;

scrollbar-width:none;

}

#seriesTabs::-webkit-scrollbar{

display:none;

}

.tab{

padding:10px 18px;

border:none;

border-radius:25px;

background:#0A1732;

color:#fff;

white-space:nowrap;

cursor:pointer;

transition:.3s;

}

.tab.active{

background:linear-gradient(90deg,#00C8FF,#00FF88);

color:#001018;

font-weight:bold;

}

/* Machine Container */

#machines{

padding:0 15px;

display:flex;

flex-direction:column;

gap:15px;

}

.loading{

padding:60px;

text-align:center;

color:#00C8FF;

font-size:18px;

}/* ==========================
PREMIUM MACHINE CARD
========================== */

.machine-card{

background:#08142d;

border:1px solid rgba(0,200,255,.18);

border-radius:18px;

overflow:hidden;

box-shadow:0 8px 20px rgba(0,0,0,.25);

transition:.3s;

}

.machine-card:active{

transform:scale(.98);

}

.machine-top{

display:flex;

padding:12px;

gap:12px;

align-items:center;

}

.machine-image{

width:95px;

height:95px;

border-radius:14px;

object-fit:cover;

background:#102041;

flex-shrink:0;

}

.machine-details{

flex:1;

display:flex;

flex-direction:column;

justify-content:space-between;

height:95px;

}

.machine-name{

font-size:18px;

font-weight:bold;

color:#00FF88;

margin-bottom:6px;

}

.machine-series{

display:inline-block;

padding:4px 10px;

background:#123056;

color:#00C8FF;

border-radius:20px;

font-size:11px;

margin-bottom:8px;

width:max-content;

}

.machine-row{

display:flex;

justify-content:space-between;

font-size:13px;

margin-bottom:5px;

}

.machine-row label{

color:#9FB5D1;

}

.machine-row strong{

color:#fff;

}

.buy-btn{

width:100%;

height:48px;

border:none;

background:linear-gradient(90deg,#00C8FF,#00FF88);

color:#001018;

font-size:15px;

font-weight:bold;

cursor:pointer;

transition:.25s;

}

.buy-btn:active{

transform:scale(.98);

}

.buy-btn:disabled{

background:#46556F;

color:#C8D8F7;

cursor:not-allowed;

}

/* Success Popup */

#successPopup{

position:fixed;

top:20px;

left:50%;

transform:translateX(-50%);

padding:15px 25px;

background:linear-gradient(90deg,#00C8FF,#00FF88);

color:#001018;

font-weight:bold;

border-radius:12px;

display:none;

z-index:9999;

box-shadow:0 0 25px rgba(0,255,255,.30);

}

/* Bottom Navigation */

.bottom-nav{

position:fixed;

bottom:0;

left:0;

width:100%;

height:70px;

background:#08142d;

border-top:1px solid rgba(0,200,255,.15);

display:flex;

justify-content:space-around;

align-items:center;

}

.bottom-nav a{

text-decoration:none;

color:#c5d8ff;

font-size:13px;

display:flex;

flex-direction:column;

align-items:center;

gap:4px;

}

.bottom-nav a.active{

color:#00FF88;

font-weight:bold;

}

</style>

</head><body>

<div class="header">

MARATHON

</div>

<div class="subtitle">

Machines

</div>

<!-- Series Tabs -->

<div id="seriesTabs">

</div>

<!-- Machine Container -->

<div id="machines">

<div class="loading">

Loading Machines...

</div>

</div>

<!-- Success Popup -->

<div id="successPopup">

Machine Purchased Successfully

</div>

<!-- Bottom Navigation -->

<div class="bottom-nav">

<a href="dashboard.html">

🏠

<span>Home</span>

</a>

<a href="machines.html" class="active">

⚙️

<span>Machines</span>

</a>

<a href="deposit.html">

💳

<span>Deposit</span>

</a>

<a href="income.html">

📈

<span>Income</span>

</a>

<a href="profile.html">

👤

<span>Profile</span>

</a>

</div>

<script>

/* ===============================
SUPABASE
=============================== */

const db = window.supabaseClient;

let currentUser = null;
let allMachines = [];
let groupedMachines = {};

/* ===============================
START PAGE
=============================== */

document.addEventListener("DOMContentLoaded", async () => {

const { data:{ user } } = await db.auth.getUser();

if(!user){

window.location.href="login.html";

return;

}

currentUser = user;

await loadMachines();

});/* ===============================
LOAD MACHINES
=============================== */

async function loadMachines(){

document.getElementById("machines").innerHTML=`
<div class="loading">
Loading Machines...
</div>
`;

const { data,error } = await db

.from("machines")

.select("*")

.eq("status",true)

.order("price",{ascending:true});

if(error){

console.log(error);

document.getElementById("machines").innerHTML=`
<div class="loading">
Failed To Load Machines
</div>
`;

return;

}

allMachines=data || [];

buildSeries();

showMachines("ALL");

}

/* ===============================
BUILD SERIES
=============================== */

function buildSeries(){

const tabs=document.getElementById("seriesTabs");

tabs.innerHTML="";

groupedMachines={};

/* All Tab */

const all=document.createElement("button");

all.className="tab active";

all.innerText="All";

all.onclick=function(){

changeTab(this);

showMachines("ALL");

};

tabs.appendChild(all);

/* Group Machines */

allMachines.forEach(machine=>{

let series=(machine.series || "General")

.replace(/[0-9]/g,"")

.trim();

if(!groupedMachines[series]){

groupedMachines[series]=[];

}

groupedMachines[series].push(machine);

});

/* Create Tabs */

Object.keys(groupedMachines).forEach(series=>{

const btn=document.createElement("button");

btn.className="tab";

btn.innerText=series;

btn.onclick=function(){

changeTab(this);

showMachines(series);

};

tabs.appendChild(btn);

});

}

/* ===============================
ACTIVE TAB
=============================== */

function changeTab(tab){

document.querySelectorAll(".tab")

.forEach(t=>t.classList.remove("active"));

tab.classList.add("active");

  }/* ===============================
SHOW MACHINES
=============================== */

async function showMachines(series){

const container=document.getElementById("machines");

container.innerHTML="";

let machines=[];

if(series==="ALL"){

machines=allMachines;

}else{

machines=groupedMachines[series] || [];

}

if(machines.length===0){

container.innerHTML=`
<div class="loading">
No Machines Available
</div>
`;

return;

}

for(const machine of machines){

const { data:owned } = await db

.from("user_machines")

.select("id")

.eq("user_id",currentUser.id)

.eq("machine_id",machine.id);

const purchased=owned && owned.length>0;

const image=(machine.image_url && machine.image_url!="")
? machine.image_url
: "images/default-machine.png";

container.innerHTML+=`

<div class="machine-card">

<div class="machine-top">

<img

src="${image}"

class="machine-image"

onerror="this.src='images/default-machine.png'">

<div class="machine-details">

<div class="machine-name">

${machine.name}

</div>

<div class="machine-series">

${machine.series || "General"}

</div>

<div class="machine-row">

<label>Price</label>

<strong>

UGX ${Number(machine.price).toLocaleString()}

</strong>

</div>

<div class="machine-row">

<label>Total Return</label>

<strong>

UGX ${Number(machine.total_return).toLocaleString()}

</strong>

</div>

<div class="machine-row">

<label>Duration</label>

<strong>

${machine.duration_days} Days

</strong>

</div>

</div>

</div>

<button

class="buy-btn"

${purchased ? "disabled" : ""}

onclick="buyMachine('${machine.id}')">

${purchased ? "PURCHASED ✓" : "BUY MACHINE"}

</button>

</div>

`;

}

  }/* ===============================
BUY MACHINE
=============================== */

async function buyMachine(machineId){

try{

const { data:machine,error:machineError } = await db

.from("machines")

.select("*")

.eq("id",machineId)

.single();

if(machineError){

alert("Machine not found.");

return;

}

/* Wallet */

const { data:profile,error:profileError } = await db

.from("profiles")

.select("wallet_balance")

.eq("id",currentUser.id)

.single();

if(profileError){

alert("Unable to load wallet.");

return;

}

const wallet=Number(profile.wallet_balance);

const price=Number(machine.price);

/* Balance Check */

if(wallet<price){

alert("Insufficient Wallet Balance");

return;

}

/* Already Purchased */

const { data:existing } = await db

.from("user_machines")

.select("id")

.eq("user_id",currentUser.id)

.eq("machine_id",machineId);

if(existing && existing.length>0){

alert("You already own this machine.");

return;

}

/* Deduct Wallet */

const { error:updateError } = await db

.from("profiles")

.update({

wallet_balance:wallet-price

})

.eq("id",currentUser.id);

if(updateError){

alert("Wallet update failed.");

return;

}

/* Calculate Expiry */

const expiry=new Date();

expiry.setDate(

expiry.getDate()+Number(machine.duration_days)

);

/* Save Purchase */

const { error:purchaseError } = await db

.from("user_machines")

.insert({

user_id:currentUser.id,

machine_id:machine.id,

amount_paid:price,

purchase_date:new Date().toISOString(),

expiry_date:expiry.toISOString(),

status:"active"

});

if(purchaseError){

alert("Purchase failed.");

return;

}

/* Wallet History */

await db

.from("wallet_transactions")

.insert({

user_id:currentUser.id,

type:"Machine Purchase",

amount:price,

description:`Purchased ${machine.name}`,

created_at:new Date().toISOString()

});

/* Success */

showSuccess();

await loadMachines();

}catch(err){

console.log(err);

alert("Unexpected error occurred.");

}

  }/* ===============================
SUCCESS POPUP
=============================== */

function showSuccess(message="Machine Purchased Successfully"){

const popup=document.getElementById("successPopup");

popup.innerText=message;

popup.style.display="block";

popup.style.opacity="1";

popup.style.transform="translateX(-50%) translateY(0)";

setTimeout(()=>{

popup.style.opacity="0";

popup.style.transform="translateX(-50%) translateY(-20px)";

setTimeout(()=>{

popup.style.display="none";

},300);

},2500);

}

/* ===============================
IMAGE FALLBACK
=============================== */

document.addEventListener("error",function(e){

if(e.target.tagName==="IMG"){

e.target.src="images/default-machine.png";

}

},true);

/* ===============================
BUTTON EFFECT
=============================== */

document.addEventListener("click",function(e){

if(e.target.classList.contains("buy-btn")){

e.target.style.transform="scale(.97)";

setTimeout(()=>{

e.target.style.transform="scale(1)";

},120);

}

});

</script>

<style>

/* Success Popup Animation */

#successPopup{

opacity:0;

transition:.3s;

}

/* Smooth Card Animation */

.machine-card{

animation:fadeIn .35s ease;

}

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(15px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</body>

</html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Machines | Marathon Digital Hub</title>

<!-- Existing Supabase Config -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#040817;
color:#fff;
overflow-x:hidden;
padding-bottom:90px;
position:relative;
min-height:100vh;

}

/* ==========================
ANIMATED BACKGROUND
========================== */

body::before{

content:"";

position:fixed;

left:-30%;
top:-30%;

width:170%;
height:170%;

background:

radial-gradient(circle at 15% 20%,rgba(0,255,255,.18),transparent 35%),

radial-gradient(circle at 80% 15%,rgba(170,0,255,.18),transparent 35%),

radial-gradient(circle at 70% 85%,rgba(0,120,255,.18),transparent 40%),

radial-gradient(circle at 25% 75%,rgba(0,255,140,.15),transparent 35%);

animation:bgMove 20s linear infinite;

z-index:-2;

}

body::after{

content:"";

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

background-image:

radial-gradient(rgba(0,200,255,.25) 1px,transparent 1px);

background-size:22px 22px;

animation:gridMove 18s linear infinite;

z-index:-1;

}

@keyframes bgMove{

0%{transform:translateX(-3%);}
50%{transform:translateX(3%);}
100%{transform:translateX(-3%);}

}

@keyframes gridMove{

0%{transform:translateX(0);}
100%{transform:translateX(-22px);}

}

/* ==========================
HEADER
========================== */

.header{

height:75px;

display:flex;

justify-content:center;

align-items:center;

font-size:30px;

font-weight:bold;

background:linear-gradient(90deg,#00c8ff,#00ff88);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.page-title{

text-align:center;

font-size:24px;

margin-top:8px;

margin-bottom:25px;

color:#ffffff;

font-weight:bold;

}

/* ==========================
SERIES
========================== */

#seriesContainer{

display:flex;

gap:10px;

overflow-x:auto;

padding:0 15px 20px;

scrollbar-width:none;

}

#seriesContainer::-webkit-scrollbar{

display:none;

}

.series-btn{

padding:12px 18px;

background:#07152f;

border:1px solid rgba(0,200,255,.25);

border-radius:25px;

color:#fff;

cursor:pointer;

white-space:nowrap;

transition:.3s;

font-size:14px;

}

.series-btn.active{

background:linear-gradient(90deg,#00c8ff,#00ff88);

color:#001018;

font-weight:bold;

}

/* ==========================
MACHINES
========================== */

#machineContainer{

padding:0 15px 20px;

display:flex;

flex-direction:column;

gap:15px;

}

.loading{

padding:40px;

text-align:center;

font-size:18px;

color:#00c8ff;

}

</style>

</head>

<body>

<div class="header">

MARATHON

</div>

<div class="page-title">

Machines

</div>

<div id="seriesContainer">

</div>

<div id="machineContainer">

<div class="loading">

Loading Machines...

</div>

</div><script>

/* ==========================
SUPABASE
========================== */

const db = window.supabaseClient;

let currentUser = null;
let currentSeries = "ALL";

/* ==========================
START PAGE
========================== */

document.addEventListener("DOMContentLoaded", async ()=>{

const { data:{ user }, error } = await db.auth.getUser();

if(error || !user){

window.location.href="login.html";

return;

}

currentUser = user;

await loadSeries();

await loadMachines("ALL");

});

/* ==========================
LOAD SERIES
========================== */

async function loadSeries(){

const container=document.getElementById("seriesContainer");

container.innerHTML="";

/* All Button */

const allBtn=document.createElement("div");

allBtn.className="series-btn active";

allBtn.innerText="All";

allBtn.onclick=()=>changeSeries("ALL",allBtn);

container.appendChild(allBtn);

/* Get Series */

const {data,error}=await db

.from("machines")

.select("series")

.eq("status",true)

.order("series");

if(error){

console.log(error);

return;

}

/* Remove duplicates */

const unique=[...new Set(data.map(item=>item.series))];

unique.forEach(series=>{

const btn=document.createElement("div");

btn.className="series-btn";

btn.innerText=series;

btn.onclick=()=>changeSeries(series,btn);

container.appendChild(btn);

});

}

/* ==========================
CHANGE SERIES
========================== */

function changeSeries(series,button){

currentSeries=series;

document.querySelectorAll(".series-btn")

.forEach(btn=>btn.classList.remove("active"));

button.classList.add("active");

loadMachines(series);

}

</script><script>

/* ==========================
LOAD MACHINES
========================== */

async function loadMachines(series="ALL"){

const container=document.getElementById("machineContainer");

container.innerHTML='<div class="loading">Loading Machines...</div>';

let query=db
.from("machines")
.select("*")
.eq("status",true)
.order("price",{ascending:true});

if(series!=="ALL"){
query=query.eq("series",series);
}

const {data,error}=await query;

if(error){
console.log(error);
container.innerHTML='<div class="loading">Failed to load machines.</div>';
return;
}

if(!data || data.length===0){
container.innerHTML='<div class="loading">No Machines Available</div>';
return;
}

container.innerHTML="";

data.forEach(machine=>{

container.innerHTML+=`

<div class="machine-card">

<div class="top-row">

<h3>${machine.name}</h3>

<span>${machine.series}</span>

</div>

<div class="machine-info">

<div>

<p>Price</p>

<h4>UGX ${Number(machine.price).toLocaleString()}</h4>

</div>

<div>

<p>Total Return</p>

<h4>UGX ${Number(machine.total_return).toLocaleString()}</h4>

</div>

<div>

<p>Duration</p>

<h4>${machine.duration_days} Days</h4>

</div>

</div>

<button
class="buy-btn"
onclick="buyMachine('${machine.id}')">

BUY MACHINE

</button>

</div>

`;

});

}

</script>

<style>

.machine-card{

background:#08142d;

border:1px solid rgba(0,200,255,.25);

border-radius:18px;

padding:18px;

box-shadow:0 0 18px rgba(0,200,255,.08);

}

.top-row{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:15px;

}

.top-row h3{

font-size:20px;

color:#00ff88;

}

.top-row span{

background:#00c8ff;

color:#001018;

padding:6px 12px;

border-radius:20px;

font-size:12px;

font-weight:bold;

}

.machine-info div{

display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px solid rgba(255,255,255,.08);

}

.machine-info p{

color:#9fb5d1;

}

.machine-info h4{

font-size:16px;

color:#fff;

}

.buy-btn{

width:100%;

margin-top:18px;

padding:14px;

border:none;

border-radius:12px;

background:linear-gradient(90deg,#00c8ff,#00ff88);

color:#001018;

font-weight:bold;

font-size:15px;

cursor:pointer;

transition:.3s;

}

.buy-btn:hover{

opacity:.9;

}

</style><script>

/* ==========================
BUY MACHINE
========================== */

async function buyMachine(machineId){

try{

/* Get Machine */

const { data:machine, error:machineError } = await db

.from("machines")

.select("*")

.eq("id",machineId)

.single();

if(machineError){

alert("Machine not found.");

return;

}

/* Get Wallet */

const { data:profile, error:profileError } = await db

.from("profiles")

.select("wallet_balance")

.eq("id",currentUser.id)

.single();

if(profileError){

alert("Failed to load wallet.");

return;

}

const wallet=Number(profile.wallet_balance);

const price=Number(machine.price);

if(wallet<price){

alert("Insufficient Balance");

return;

}

/* Update Wallet */

const { error:updateError } = await db

.from("profiles")

.update({

wallet_balance:wallet-price

})

.eq("id",currentUser.id);

if(updateError){

alert("Wallet update failed.");

return;

}

/* Purchase */

const expiry=new Date();

expiry.setDate(

expiry.getDate()+

Number(machine.duration_days)

);

const { error:purchaseError } = await db

.from("user_machines")

.insert({

user_id:currentUser.id,

machine_id:machine.id,

amount_paid:price,

purchase_date:new Date().toISOString(),

expiry_date:expiry.toISOString(),

status:"active"

});

if(purchaseError){

console.log(purchaseError);

alert("Purchase failed.");

return;

}

/* Refresh */

alert("Machine Purchased Successfully!");

loadMachines(currentSeries);

}catch(err){

console.log(err);

alert("Something went wrong.");

}

}

</script>

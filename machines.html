<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Machines Center</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020b1f;
color:white;
padding:15px;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
color:#00c8ff;
}

.balance-card{
background:#03142f;
padding:20px;
border-radius:20px;
margin-bottom:20px;
border:1px solid #00c8ff;
}

.balance{
font-size:30px;
font-weight:bold;
color:#00c8ff;
}

.machine-card{
background:#03142f;
padding:20px;
border-radius:20px;
margin-bottom:15px;
border:1px solid rgba(0,200,255,.3);
}

.machine-name{
font-size:24px;
font-weight:bold;
color:#00c8ff;
margin-bottom:10px;
}

.machine-row{
display:flex;
justify-content:space-between;
margin:8px 0;
}

.buy-btn{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:#00c8ff;
color:#000;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

.buy-btn:hover{
opacity:.9;
}

</style>
</head>

<body>

<div class="header">
<h1>Machines Center</h1>
</div>

<div class="balance-card">

<div class="balance">
UGX <span id="wallet">1000000</span>
</div>

<p>
Owned Machines:
<span id="owned">0</span>
</p>

</div>

<div id="machines"></div>

<script>

let wallet = 1000000;
let owned = 0;

const machines = [

{
name:"VIP1",
price:18000,
income:40000,
days:20
},

{
name:"VIP2",
price:36000,
income:79200,
days:20
},

{
name:"B1",
price:30000,
income:50000,
days:20
},

{
name:"B2",
price:70000,
income:133000,
days:20
},

{
name:"D1",
price:120000,
income:1350000,
days:100
},

{
name:"D2",
price:200000,
income:2450000,
days:100
},

{
name:"R1",
price:57000,
income:142000,
days:120
},

{
name:"R2",
price:68500,
income:171250,
days:120
}

];

const container =
document.getElementById("machines");

machines.forEach(machine=>{

const daily =
Math.floor(
machine.income /
machine.days
);

container.innerHTML += `

<div class="machine-card">

<div class="machine-name">
${machine.name}
</div>

<div class="machine-row">
<span>Price</span>
<span>UGX ${machine.price.toLocaleString()}</span>
</div>

<div class="machine-row">
<span>Total Return</span>
<span>UGX ${machine.income.toLocaleString()}</span>
</div>

<div class="machine-row">
<span>Duration</span>
<span>${machine.days} Days</span>
</div>

<div class="machine-row">
<span>Daily Income</span>
<span>UGX ${daily.toLocaleString()}</span>
</div>

<button
class="buy-btn"
onclick="buyMachine(
${machine.price},
'${machine.name}'
)">

BUY NOW

</button>

</div>

`;

});

function buyMachine(price,name){

const ok = confirm(
`Buy ${name} for UGX ${price.toLocaleString()} ?`
);

if(!ok){
return;
}

if(wallet < price){

alert(
"Insufficient Balance"
);

return;
}

wallet -= price;
owned++;

document.getElementById(
"wallet"
).innerText =
wallet.toLocaleString();

document.getElementById(
"owned"
).innerText =
owned;

alert(
name +
" purchased successfully"
);

}

</script>

</body>
</html>

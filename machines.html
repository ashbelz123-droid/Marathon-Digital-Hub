function loadSeries(series){

const container =
document.getElementById(
'machineContainer'
);

container.innerHTML = '';

document
.querySelectorAll('.tab')
.forEach(tab=>{
tab.classList.remove(
'active'
);
});

event.target.classList.add(
'active'
);

const filtered =
series === 'all'
? machines
: machines.filter(
m=>m.series===series
);

filtered.forEach(machine=>{

container.innerHTML += `

<div class="machine-card">

<h2>${machine.name}</h2>

<p>
💰 Price:
UGX ${machine.price.toLocaleString()}
</p>

<p>
📈 Total Return:
UGX ${machine.income.toLocaleString()}
</p>

<p>
📅 Duration:
${machine.days} Days
</p>

<p>
💵 Daily Income:
UGX ${Math.floor(
machine.income /
machine.days
).toLocaleString()}
</p>

<button
class="buy-btn"
onclick="buyMachine(
'${machine.name}',
${machine.price},
${machine.income},
${machine.days}
)">

</button>

</div>

`;

});

}

     async function buyMachine(

name,
price,
income,
days

){

try{

const {
data:{user}
}
=
await supabase.auth.getUser();

if(!user){

alert(
'Please login first'
);

return;

}

/* GET USER WALLET */

const {
data:userData,
error:userError
}
=
await supabase
.from('profiles')
.select('*')
.eq('id',user.id)
.single();

if(userError){

alert(
'User account not found'
);

return;

}

const wallet =
userData.balance || 0;

if(wallet < price){

alert(
'Insufficient balance'
);

return;

}

/* DEDUCT BALANCE */

const newBalance =
wallet - price;

const {
error:updateError
}
=
await supabase
.from('profiles')
.update({

balance:newBalance

})
.eq(
'id',
user.id
);

if(updateError){

alert(
'Failed to deduct balance'
);

return;

}

/* SAVE MACHINE */

const expiry =
new Date();

expiry.setDate(
expiry.getDate() + days
);

const dailyIncome =
Math.floor(
income / days
);

const {
error:machineError
}
=
await supabase
.from('user_machines')
.insert({

user_id:user.id,

machine_name:name,

purchase_price:price,

total_return:income,

daily_income:dailyIncome,

days_remaining:days,

active:true,

expiry_date:
expiry.toISOString()

});

if(machineError){

alert(
machineError.message
);

return;

}

alert(

name +
' purchased successfully'

);

location.reload();

}catch(err){

alert(
err.message
);

}

}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Machines Center</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#020b1f;
color:#fff;
padding-bottom:120px;
}

.header{
height:70px;
display:flex;
justify-content:center;
align-items:center;
background:#000814;
border-bottom:1px solid rgba(0,200,255,.3);
}

.header h1{
color:#00c8ff;
font-size:32px;
}

.balance-card{
margin:15px;
padding:20px;
border-radius:20px;
background:#03142f;
border:1px solid rgba(0,200,255,.3);
box-shadow:0 0 15px rgba(0,200,255,.15);
}

.balance-title{
font-size:15px;
opacity:.8;
}

.balance-value{
margin-top:10px;
font-size:32px;
font-weight:bold;
color:#00c8ff;
}

.tabs{
display:flex;
gap:10px;
overflow-x:auto;
padding:15px;
}

.tabs::-webkit-scrollbar{
display:none;
}

.tab{
min-width:120px;
padding:14px;
border-radius:15px;
text-align:center;
background:#03142f;
border:1px solid rgba(0,200,255,.2);
cursor:pointer;
}

.tab.active{
background:#00c8ff;
color:#000;
font-weight:bold;
}

.machine-container{
padding:15px;
}

.machine-card{
background:#03142f;
border-radius:20px;
padding:20px;
margin-bottom:15px;
border:1px solid rgba(0,200,255,.25);
box-shadow:0 0 15px rgba(0,200,255,.15);
}

.machine-name{
font-size:24px;
font-weight:bold;
color:#00c8ff;
margin-bottom:15px;
}

.machine-row{
display:flex;
justify-content:space-between;
margin:10px 0;
}

.buy-btn{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:15px;
background:#00c8ff;
color:#000;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

.buy-btn:hover{
opacity:.9;
}

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
height:70px;
background:#000814;
display:flex;
justify-content:space-around;
align-items:center;
border-top:1px solid rgba(0,200,255,.25);
}

.bottom-nav a{
color:white;
text-decoration:none;
font-size:14px;
}

.bottom-nav .active{
color:#00c8ff;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">
<h1>Machines Center</h1>
</div>

<div class="balance-card">

<div class="balance-title">
Available Balance
</div>

<div class="balance-value"
id="userBalance">

UGX 0

</div>

</div>

<div class="tabs">

<div class="tab active"
onclick="loadMachines('all',this)">
All
</div>

<div class="tab"
onclick="loadMachines('vip',this)">
VIP Series
</div>

<div class="tab"
onclick="loadMachines('b',this)">
B Series
</div>

<div class="tab"
onclick="loadMachines('d',this)">
D Series
</div>

<div class="tab"
onclick="loadMachines('r',this)">
R Series
</div>

</div>

<div id="machineContainer"
class="machine-container">

Loading Machines...

</div>

   <script>

const SUPABASE_URL =
"https://wcrrxsrtbelcbycppieg.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjcnJ4c3J0YmVsY2J5Y3BwaWVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MTM0ODQsImV4cCI6MjA5NjE4OTQ4NH0.yh_xCiEW2T9riiDJgEWBmIU4V0e5azRQ0sITaEhfCo4";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let machines = [];

// ==========================
// LOAD USER BALANCE
// ==========================

async function loadBalance(){

try{

const {
data:{user}
}
=
await supabase.auth.getUser();

if(!user){
return;
}

const {
data,
error
}
=
await supabase
.from('profiles')
.select('wallet_balance')
.eq('id',user.id)
.single();

if(error){
console.log(error);
return;
}

document.getElementById(
'userBalance'
).innerText =

"UGX " +

Number(
data.wallet_balance || 0
).toLocaleString();

}catch(err){

console.log(err);

}

}

// ==========================
// LOAD MACHINES
// ==========================

async function loadMachines(
series='all',
element=null
){

try{

document
.querySelectorAll('.tab')
.forEach(tab=>{

tab.classList.remove(
'active'
);

});

if(element){

element.classList.add(
'active'
);

}

const container =
document.getElementById(
'machineContainer'
);

container.innerHTML =
"Loading Machines...";

const {
data,
error
}
=
await supabase
.from('machines')
.select('*')
.order('price');

if(error){

container.innerHTML =
"Failed to load machines";

console.log(error);

return;

}

machines = data || [];

const filtered =

series === 'all'

? machines

: machines.filter(

m => m.series === series

);

renderMachines(filtered);

}catch(err){

console.log(err);

}

}

    // ==========================
// RENDER MACHINES
// ==========================

function renderMachines(machineList){

const container =
document.getElementById(
'machineContainer'
);

if(!machineList.length){

container.innerHTML =

`
<div class="machine-card">
No machines found
</div>
`;

return;

}

container.innerHTML = '';

machineList.forEach(machine=>{

const dailyIncome =

Number(
machine.daily_income ||
0
);

container.innerHTML +=

`

<div class="machine-card">

<div class="machine-name">
${machine.name}
</div>

<div class="machine-row">
<span>Price</span>
<span>
UGX ${Number(
machine.price
).toLocaleString()}
</span>
</div>

<div class="machine-row">
<span>Total Return</span>
<span>
UGX ${Number(
machine.total_return
).toLocaleString()}
</span>
</div>

<div class="machine-row">
<span>Duration</span>
<span>
${machine.days} Days
</span>
</div>

<div class="machine-row">
<span>Daily Income</span>
<span>
UGX ${dailyIncome.toLocaleString()}
</span>
</div>

<button
class="buy-btn"
onclick="buyMachine(${machine.id})">

BUY NOW

</button>

</div>

`;

});

}

// ==========================
// BUY MACHINE
// ==========================

async function buyMachine(
machineId
){

try{

const machine =
machines.find(
m => m.id == machineId
);

if(!machine){

alert(
'Machine not found'
);

return;

}

const {
data:{user}
}
=
await supabase.auth.getUser();

if(!user){

alert(
'Please login first'
);

return;

}

const {
data:profile,
error:profileError
}
=
await supabase
.from('profiles')
.select('*')
.eq('id',user.id)
.single();

if(profileError){

alert(
'Profile not found'
);

return;

}

const wallet =

Number(
profile.wallet_balance || 0
);

if(wallet < machine.price){

alert(
'Insufficient Balance'
);

return;

}

const newBalance =

wallet -
Number(machine.price);

// UPDATE WALLET

const {
error:updateError
}
=
await supabase
.from('profiles')
.update({

wallet_balance:
newBalance

})
.eq(
'id',
user.id
);

if(updateError){

alert(
updateError.message
);

return;

}

const expiry =
new Date();

expiry.setDate(

expiry.getDate() +
Number(machine.days)

);

// SAVE PURCHASE

const {
error:purchaseError
}
=
await supabase
.from('user_machines')
.insert({

user_id:
user.id,

machine_name:
machine.name,

machine_series:
machine.series,

purchase_price:
machine.price,

total_return:
machine.total_return,

daily_income:
machine.daily_income,

days_remaining:
machine.days,

active:true,

expiry_date:
expiry.toISOString(),

created_at:
new Date().toISOString()

});

if(purchaseError){

alert(
purchaseError.message
);

return;

}

alert(
machine.name +
' purchased successfully'
);

loadBalance();

}catch(err){

alert(
err.message
);

}

   }

      // ==========================
// PAGE START
// ==========================

loadBalance();

loadMachines(
'all'
);

</script>

</body>
</html>

  <!-- ======================================
SUPABASE AUTH + LOAD MACHINES
====================================== -->

<script>

let currentUser=null;
let currentSeries="ALL";

const seriesButtons=document.querySelectorAll(".series");

seriesButtons.forEach(btn=>{

btn.onclick=()=>{

seriesButtons.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

const txt=btn.innerText;

if(txt==="All"){

currentSeries="ALL";

}else{

currentSeries=txt.replace(" Series","");

}

loadMachines();

};

});

async function startMachines(){

const {data:{user}}=

await supabase.auth.getUser();

if(!user){

location.href="login.html";

return;

}

currentUser=user;

loadWallet();

loadMachines();

}

async function loadWallet(){

const {data}=

await supabase

.from("profiles")

.select("wallet_balance")

.eq("id",currentUser.id)

.single();

if(data){

document.getElementById("walletBalance").innerHTML=

"UGX "+Number(data.wallet_balance).toLocaleString();

}

}

async function loadMachines(){

const container=document.getElementById("machineContainer");

container.innerHTML=`

<div class="loading">

Loading Machines...

</div>

`;

let query=

supabase

.from("machines")

.select("*")

.eq("status",true)

.order("price",{ascending:true});

if(currentSeries!="ALL"){

query=query.eq("series",currentSeries);

}

const {data,error}=await query;

if(error){

container.innerHTML=`

<div class="loading">

Failed to load machines

</div>

`;

return;

}

if(!data || data.length===0){

container.innerHTML=`

<div class="loading">

No machines available

</div>

`;

return;

}

container.innerHTML="";

data.forEach(machine=>{

container.innerHTML+=`

<div class="machine-card">

<div class="machine-name">

${machine.name}

</div>

<div class="machine-row">

<span>Price</span>

<span>

UGX ${Number(machine.price).toLocaleString()}

</span>

</div>

<div class="machine-row">

<span>Total Return</span>

<span>

UGX ${Number(machine.total_return).toLocaleString()}

</span>

</div>

<div class="machine-row">

<span>Duration</span>

<span>

${machine.duration_days} Days

</span>

</div>

<button

class="buy-btn"

onclick="buyMachine('${machine.id}')">

Buy Machine

</button>

</div>

`;

});

}

startMachines();

</script>

  <!-- ======================================
BUY MACHINE SYSTEM
====================================== -->

<script>

async function buyMachine(machineId){

if(!currentUser){

alert("Please login first.");

return;

}

/* Get Machine */

const { data: machine, error: machineError } =
await supabase
.from("machines")
.select("*")
.eq("id", machineId)
.single();

if(machineError || !machine){

alert("Machine not found.");

return;

}

/* Get User Profile */

const { data: profile, error: profileError } =
await supabase
.from("profiles")
.select("*")
.eq("id", currentUser.id)
.single();

if(profileError){

alert("Unable to load wallet.");

return;

}

/* Check Balance */

if(Number(profile.wallet_balance) < Number(machine.price)){

alert("Insufficient wallet balance.");

return;

}

/* Confirm Purchase */

const confirmBuy = confirm(

"Buy " + machine.name +

"\n\nPrice: UGX " +

Number(machine.price).toLocaleString()

);

if(!confirmBuy){

return;

}

/* New Balance */

const newBalance =

Number(profile.wallet_balance) -

Number(machine.price);

/* Expiry Date */

const expiry = new Date();

expiry.setDate(

expiry.getDate() +

Number(machine.duration_days)

);

/* Update Wallet */

const { error: walletError } =
await supabase
.from("profiles")
.update({

wallet_balance:newBalance

})
.eq("id",currentUser.id);

if(walletError){

alert("Failed to update wallet.");

return;

}

/* Save Purchase */

const { error: purchaseError } =
await supabase
.from("user_machines")
.insert({

user_id:currentUser.id,

machine_id:machine.id,

amount_paid:machine.price,

purchase_date:new Date(),

expiry_date:expiry,

status:"active"

});

if(purchaseError){

alert("Purchase failed.");

return;

}

/* Refresh Wallet */

document.getElementById("walletBalance").innerHTML =

"UGX " +

newBalance.toLocaleString();

/* Success */

alert(

"✅ Purchase Successful!\n\n" +

machine.name +

" has been activated."

);

/* Reload Machines */

loadWallet();
loadMachines();

}

</script>

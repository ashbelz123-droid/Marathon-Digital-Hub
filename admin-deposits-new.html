<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Deposits · MDH Admin</title><link rel="stylesheet" href="admin-shared.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>:root{--bg:#07100f;--panel:#0d1b19;--line:#5effbe21;--text:#f2fff9;--muted:#8daaa1;--green:#19e889;--danger:#ff6677;--warn:#ffc857}body{background:linear-gradient(180deg,#07110f,#081613);color:var(--text)}.wrap{width:min(1180px,100%);margin:auto;padding:18px 15px 100px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.back{color:var(--green);font-size:11px;font-weight:800}.eyebrow{font-size:9px;color:#72aa98;font-weight:900;letter-spacing:1px;margin-top:12px}.head h1{font-size:29px;margin:7px 0}.head p{color:var(--muted);font-size:11px;margin:0}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.stat,.panel{border:1px solid var(--line);background:#0d1b19;border-radius:19px}.stat{padding:15px}.stat small{display:block;color:var(--muted);font-size:9px}.stat b{display:block;font-size:22px;margin-top:6px;color:#baffdf}.toolbar{display:flex;gap:9px;margin-bottom:12px}.search,.filter{flex:1;min-width:0;background:#0b1917;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:10px}.panel{overflow:hidden}.row{display:flex;justify-content:space-between;gap:12px;padding:15px;border-bottom:1px solid #5effbe12}.row:last-child{border:0}.identity{min-width:0}.identity h3{margin:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity p{margin:4px 0 0;color:var(--muted);font-size:9px}.right{text-align:right;min-width:90px}.amount{font-size:12px;font-weight:900}.badge{display:inline-block;margin-top:5px;padding:5px 8px;border-radius:999px;font-size:8px;font-weight:900;background:#19e88912;color:var(--green)}.badge.pending{color:var(--warn);background:#ffc85712}.badge.failed,.badge.rejected{color:var(--danger);background:#ff667712}.empty{padding:28px;text-align:center;color:var(--muted);font-size:10px}.bottom{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(94vw,620px);display:flex;gap:5px;padding:8px;border:1px solid var(--line);border-radius:23px;background:#05110ff7;backdrop-filter:blur(18px);z-index:10}.bottom a{flex:1;text-align:center;padding:9px;color:#78938b;font-size:9px;font-weight:800}.bottom a.active{color:var(--green);background:#19e88912;border-radius:14px}@media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}.wrap{padding-top:28px}}</style></head><body><main class="wrap"><header class="head"><div><a class="back" href="admin.html">← Control Center</a><div class="eyebrow">FINANCE OPERATIONS</div><h1>Deposits</h1><p>Review real incoming funding records from Supabase.</p></div></header><section class="stats"><div class="stat"><small>Total records</small><b id="total">0</b></div><div class="stat"><small>Pending</small><b id="pending">0</b></div><div class="stat"><small>Approved</small><b id="approved">0</b></div><div class="stat"><small>Total received</small><b id="received">UGX 0</b></div></section><div class="toolbar"><input id="search" class="search" placeholder="Search deposits…"><select id="filter" class="filter"><option value="all">All statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="failed">Failed</option></select></div><section class="panel"><div id="list" class="empty">No deposit records.</div></section></main><nav class="bottom"><a href="admin.html">⌂<br>Home</a><a href="admin-users.html">♙<br>Users</a><a href="admin-machines.html">⛏<br>Machines</a><a class="active" href="admin-deposits-new.html">＋<br>Deposits</a><a href="admin-withdrawals.html">↗<br>Withdraw</a></nav><script>const db=window.supabaseClient;let rows=[];const $=x=>document.getElementById(x);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const data=rows.filter(x=>{const s=String(x.status||'pending').toLowerCase();const text=JSON.stringify(x).toLowerCase();return(!q||text.includes(q))&&(f==='all'||s===f)});$('list').innerHTML=data.length?data.map(x=>{const s=String(x.status||'pending').toLowerCase();const cls=['pending','failed','rejected'].includes(s)?' '+s:'';return `<div class="row"><div class="identity"><h3>${esc(x.user_id||x.email||'Deposit')}</h3><p>${esc(x.reference||x.transaction_id||'No reference')} · ${x.created_at?new Date(x.created_at).toLocaleString():''}</p></div><div class="right"><div class="amount">${x.amount?'UGX '+Number(x.amount).toLocaleString():'—'}</div><span class="badge${cls}">${esc(String(x.status||'PENDING').toUpperCase())}</span></div></div>`}).join(''):'<div class="empty">No deposit records match your search.</div>'}async function load(){try{const r=await db.from('deposits').select('*').order('created_at',{ascending:false}).limit(200);if(r.error)throw r.error;rows=r.data||[];$('total').textContent=rows.length;$('pending').textContent=rows.filter(x=>String(x.status||'pending').toLowerCase()==='pending').length;$('approved').textContent=rows.filter(x=>String(x.status||'').toLowerCase()==='approved').length;const total=rows.filter(x=>String(x.status||'').toLowerCase()==='approved').reduce((n,x)=>n+Number(x.amount||0),0);$('received').textContent='UGX '+total.toLocaleString();render()}catch(e){console.error(e);$('list').innerHTML='<div class="empty">Unable to read the deposits table. Check Supabase access policies.</div>'}}$('search').oninput=render;$('filter').onchange=render;load();</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support | MDH</title><link rel="stylesheet" href="assets/css/mdh-navigation.css?v=support4"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=support4"></script><style>body{margin:0;background:#020d12;color:#effff7;font-family:Inter,system-ui,sans-serif;padding:16px 13px}.page{max-width:720px;margin:auto}.hero,.chat-card{background:linear-gradient(145deg,#07372fdd,#041d20ee);border:1px solid #19e88933;border-radius:21px;box-shadow:0 18px 45px #0008}.hero{padding:18px}.hero small{color:#19e889;font-weight:900}.hero h1{margin:8px 0}.hero p{color:#8eaaa1;font-size:12px}.quick{display:flex;gap:7px;padding:12px;overflow:auto}.quick button{white-space:nowrap;background:#19e88912;border:1px solid #19e88933;color:#9decca;border-radius:999px;padding:9px 13px;font-size:10px}.chat-card{margin-top:12px;overflow:hidden}.chat{height:55vh;min-height:360px;overflow:auto;padding:15px}.empty{text-align:center;color:#78968d;padding:60px 15px;font-size:12px}.msg{max-width:82%;padding:12px;margin-bottom:9px;border-radius:16px;font-size:12px}.mine{margin-left:auto;background:#19e889;color:#02170d}.reply{background:#092b27;border:1px solid #19e88922}.time{display:block;font-size:9px;opacity:.6;text-align:right;margin-top:6px}.composer{display:flex;gap:7px;padding:10px;background:#031714}.composer input{flex:1;min-width:0;background:#06251f;color:white;border:1px solid #19e88922;border-radius:13px;padding:12px}.composer button{border:0;border-radius:13px;background:#19e889;color:#02170d;font-weight:900;padding:0 16px}</style></head><body><main class="page"><section class="hero"><small>MARATHON DIGITAL HUB</small><h1>Support Centre</h1><p>Get help with income, withdrawals, machines and referrals.</p></section><section class="chat-card"><div class="quick"><button data-text="I need help with my income">Income</button><button data-text="I need help with a withdrawal">Withdrawal</button><button data-text="I need help with my machine">Machine</button><button data-text="I need help with my referral">Referral</button></div><div id="chat" class="chat"><div class="empty">Connecting...</div></div><form class="composer" id="form"><input id="input" placeholder="Type your message"><button>Send</button></form></section></main><script>const db=window.supabaseClient,$=id=>document.getElementById(id);let uid;async function load(){const{data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}uid=user.id;const r=await db.from('support_messages').select('*').eq('user_id',uid).order('created_at',{ascending:true});if(r.error){$('chat').innerHTML='<div class="empty">Support unavailable. Try again.</div>';return}if(!r.data?.length){$('chat').innerHTML='<div class="empty">No conversation yet.</div>';return}$('chat').innerHTML=r.data.map(x=>'<div class="msg mine">'+x.message+'<span class="time">'+new Date(x.created_at).toLocaleString()+'</span></div>'+(x.admin_reply?'<div class="msg reply">'+x.admin_reply+'<span class="time">'+new Date(x.created_at).toLocaleString()+'</span></div>':'')).join('')}document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{$('input').value=b.dataset.text;$('input').focus()});$('form').onsubmit=async e=>{e.preventDefault();const message=$('input').value.trim();if(!message||!uid)return;const r=await db.from('support_messages').insert({user_id:uid,message,status:'open'});if(!r.error){$('input').value='';load()}};load();</script></body></html>

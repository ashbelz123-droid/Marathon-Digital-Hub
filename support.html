<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Support | Marathon Digital Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050B18;
color:#fff;

height:100vh;

display:flex;

flex-direction:column;

overflow:hidden;

}

body::before{

content:"";

position:fixed;

left:-40%;
top:-40%;

width:180%;
height:180%;

background:

radial-gradient(circle at 20% 20%,rgba(0,255,255,.18),transparent 35%),

radial-gradient(circle at 80% 20%,rgba(0,120,255,.18),transparent 35%),

radial-gradient(circle at 60% 80%,rgba(0,255,120,.15),transparent 40%);

animation:bgMove 20s linear infinite;

z-index:-2;

}

@keyframes bgMove{

0%{transform:translateX(-2%);}
50%{transform:translateX(2%);}
100%{transform:translateX(-2%);}

}

.header{

height:70px;

background:#08142d;

display:flex;

align-items:center;

padding:15px;

border-bottom:1px solid rgba(255,255,255,.08);

flex-shrink:0;

}

.avatar{

width:48px;
height:48px;

border-radius:50%;

background:#00ff88;

display:flex;

justify-content:center;

align-items:center;

font-size:22px;

font-weight:bold;

color:#001018;

margin-right:12px;

}

.header h3{

font-size:20px;

}

.header p{

font-size:13px;

color:#9fb5d1;

margin-top:2px;

}

.chatArea{

flex:1;

overflow-y:auto;

padding:15px;

padding-bottom:170px;

}

.message{

max-width:80%;

padding:12px;

margin-bottom:15px;

border-radius:16px;

word-wrap:break-word;

line-height:1.5;

}

.user{

margin-left:auto;

background:#00ff88;

color:#001018;

border-bottom-right-radius:5px;

}

.admin{

margin-right:auto;

background:#111f3d;

border-bottom-left-radius:5px;

}

.time{

display:block;

margin-top:8px;

font-size:11px;

opacity:.7;

text-align:right;

}

.inputArea{

position:fixed;

left:0;

bottom:70px;

width:100%;

background:#08142d;

padding:12px;

display:flex;

gap:10px;

border-top:1px solid rgba(255,255,255,.08);

z-index:998;

}

.inputArea input{

flex:1;

height:50px;

background:#111f3d;

border:none;

border-radius:12px;

padding:15px;

color:white;

outline:none;

font-size:15px;

}

.sendBtn{

width:90px;

border:none;

border-radius:12px;

background:#00ff88;

color:#001018;

font-weight:bold;

cursor:pointer;

}

</style>

</head>

<body>

<div class="header">

<div class="avatar" id="avatar">

A

</div>

<div>

<h3>Support</h3>

<p>Marathon Customer Care</p>

</div>

</div>

<div

class="chatArea"

id="chatArea">

Loading conversation...

</div>

<div class="inputArea">

<input

type="text"

id="messageInput"

placeholder="Type your message...">

<button

class="sendBtn"

id="sendBtn">

Send

</button>

</div><script>

const db = window.supabaseClient;

let currentUser = null;
let profile = null;

/* ==========================
START
========================== */

document.addEventListener("DOMContentLoaded", async ()=>{

const { data:{ user } } = await db.auth.getUser();

if(!user){

window.location.href="login.html";
return;

}

currentUser=user;

await loadProfile();

await loadMessages();

});

/* ==========================
LOAD PROFILE
========================== */

async function loadProfile(){

const { data,error } = await db

.from("profiles")

.select("*")

.eq("id",currentUser.id)

.single();

if(error){

console.log(error);

return;

}

profile=data;

/* Avatar */

const initials=data.fullname

.split(" ")

.map(n=>n[0])

.join("")

.substring(0,2)

.toUpperCase();

document.getElementById("avatar").innerHTML=initials;

}

/* ==========================
LOAD CHAT
========================== */

async function loadMessages(){

const { data,error } = await db

.from("support_messages")

.select("*")

.eq("user_id",currentUser.id)

.order("created_at",{ascending:true});

if(error){

console.log(error);

return;

}

const chat=document.getElementById("chatArea");

chat.innerHTML="";

if(data.length===0){

chat.innerHTML=`

<div style="text-align:center;color:#9fb5d1;padding-top:50px;">

No conversation yet.<br>

Send your first message to Support.

</div>

`;

return;

}

data.forEach(item=>{

/* USER MESSAGE */

chat.innerHTML+=`

<div class="message user">

${item.message}

<span class="time">

${new Date(item.created_at).toLocaleString()}

</span>

</div>

`;

/* ADMIN REPLY */

if(item.admin_reply && item.admin_reply!=""){

chat.innerHTML+=`

<div class="message admin">

${item.admin_reply}

<span class="time">

${new Date(item.created_at).toLocaleString()}

</span>

</div>

`;

}

});

chat.scrollTop=chat.scrollHeight;

}

/* ==========================
AUTO REFRESH
========================== */

setInterval(()=>{

if(currentUser){

loadMessages();

}

},5000);

  </script><script>

/* ==========================
SEND MESSAGE
========================== */

document.getElementById("sendBtn").addEventListener("click", sendMessage);

document.getElementById("messageInput").addEventListener("keypress", function(e){

if(e.key==="Enter"){

e.preventDefault();

sendMessage();

}

});

async function sendMessage(){

const input=document.getElementById("messageInput");

const text=input.value.trim();

if(text===""){

return;

}

const btn=document.getElementById("sendBtn");

btn.disabled=true;

btn.innerHTML="Sending...";

const { error } = await db

.from("support_messages")

.insert({

user_id:currentUser.id,

message:text,

admin_reply:null,

status:"open"

});

btn.disabled=false;

btn.innerHTML="Send";

if(error){

alert(error.message);

return;

}

input.value="";

await loadMessages();

}

/* ==========================
REALTIME UPDATE
========================== */

db.channel("support-chat")

.on(

"postgres_changes",

{

event:"*",

schema:"public",

table:"support_messages",

filter:`user_id=eq.${currentUser?.id}`

},

()=>{

loadMessages();

}

)

.subscribe();

  </script>

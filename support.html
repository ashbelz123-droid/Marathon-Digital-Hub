<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020d12"><title>Support | MDH</title><link rel="stylesheet" href="assets/css/mdh-navigation.css?v=support5"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=support5"></script><style>body{margin:0;background:#020d12;color:#effff7;font-family:Inter,system-ui,sans-serif;padding:16px 13px}.page{max-width:720px;margin:auto}.hero,.chat-card{background:linear-gradient(145deg,#07372fdd,#041d20ee);border:1px solid #19e88933;border-radius:21px;box-shadow:0 18px 45px #0008}.hero{padding:18px}.hero small{color:#19e889;font-weight:900}.hero h1{margin:8px 0}.hero p{color:#8eaaa1;font-size:12px}.back{display:inline-block;margin-top:10px;color:#19e889;text-decoration:none;font-size:11px;font-weight:900}.quick{display:flex;gap:7px;padding:12px;overflow:auto}.quick button{white-space:nowrap;background:#19e88912;border:1px solid #19e88933;color:#9decca;border-radius:999px;padding:9px 13px;font-size:10px}.chat-card{margin-top:12px;overflow:hidden}.chat{height:55vh;min-height:360px;overflow:auto;padding:15px}.empty{text-align:center;color:#78968d;padding:60px 15px;font-size:12px}.error{text-align:center;color:#ff9c9c;padding:45px 15px;font-size:12px}.msg{max-width:82%;padding:12px;margin-bottom:9px;border-radius:16px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.mine{margin-left:auto;background:#19e889;color:#02170d}.reply{background:#092b27;border:1px solid #19e88922}.time{display:block;font-size:9px;opacity:.6;text-align:right;margin-top:6px}.composer{display:flex;gap:7px;padding:10px;background:#031714}.composer input{flex:1;min-width:0;background:#06251f;color:white;border:1px solid #19e88922;border-radius:13px;padding:12px;outline:none}.composer button{border:0;border-radius:13px;background:#19e889;color:#02170d;font-weight:900;padding:0 16px}.composer button:disabled{opacity:.55}.notice{text-align:center;color:#7faaa0;font-size:10px;padding:8px 12px}</style></head><body><main class="page"><section class="hero"><small>MARATHON DIGITAL HUB</small><h1>Support Centre</h1><p>Send a message directly to the MDH support team. Your conversation is linked to your signed-in account.</p><a class="back" href="mara-ai.html">← Back to Mara AI</a></section><section class="chat-card"><div class="quick"><button type="button" data-text="I need help with my income">Income</button><button type="button" data-text="I need help with a withdrawal">Withdrawal</button><button type="button" data-text="I need help with my machine">Machine</button><button type="button" data-text="I need help with my referral">Referral</button></div><div id="chat" class="chat"><div class="empty">Connecting to your support account…</div></div><div id="notice" class="notice"></div><form class="composer" id="form"><input id="input" autocomplete="off" placeholder="Type your message"><button id="send" type="submit">Send</button></form></section></main><script>(()=>{const db=window.supabaseClient,$=id=>document.getElementById(id);let uid=null,loading=false;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const show=(html,cls='empty')=>{$('chat').innerHTML='<div class="'+cls+'">'+html+'</div>'};async function getUser(){const r=await db.auth.getUser();if(r.error){console.error('Support auth error',r.error);return null}return r.data?.user||null}async function load(){if(loading)return;loading=true;try{const user=await getUser();if(!user){show('Your session is not active. Please log in again.','error');setTimeout(()=>location.href='login.html?redirect=support.html',900);return}uid=user.id;const r=await db.from('support_messages').select('id,user_id,message,admin_reply,status,created_at').eq('user_id',uid).order('created_at',{ascending:true});if(r.error){console.error('Support load error',r.error);show('Support messages could not be loaded right now.<br><br>'+esc(r.error.message),'error');return}if(!r.data?.length){show('No conversation yet.<br><br>Send your first message below.');return}$('chat').innerHTML=r.data.map(x=>'<div class="msg mine">'+esc(x.message)+'<span class="time">'+new Date(x.created_at).toLocaleString()+'</span></div>'+(x.admin_reply?'<div class="msg reply">'+esc(x.admin_reply)+'<span class="time">MDH Support · '+new Date(x.created_at).toLocaleString()+'</span></div>':'')).join('');$('chat').scrollTop=$('chat').scrollHeight}catch(e){console.error('Support load exception',e);show('Support is temporarily unavailable. Please try again.','error')}finally{loading=false}}async function send(e){e.preventDefault();const input=$('input'),button=$('send'),message=input.value.trim();if(!message||!uid||button.disabled)return;button.disabled=true;$('notice').textContent='Sending…';try{const r=await db.from('support_messages').insert({user_id:uid,message:message,status:'open'});if(r.error){console.error('Support send error',r.error);$('notice').textContent='Message could not be sent: '+r.error.message;return}input.value='';$('notice').textContent='Message sent to MDH Support.';await load()}catch(e){console.error('Support send exception',e);$('notice').textContent='Could not send message. Please try again.'}finally{button.disabled=false}}document.querySelectorAll('.quick button').forEach(b=>b.addEventListener('click',()=>{$('input').value=b.dataset.text;$('input').focus()}));$('form').addEventListener('submit',send);db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){uid=null;show('Your session ended. Please log in again.','error')}else if(event==='SIGNED_IN'&&session?.user){load()}});load();setInterval(()=>{if(uid)load()},15000)})();</script></body></html>

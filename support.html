<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031017"><title>Support | Marathon Digital Hub</title><link rel="stylesheet" href="assets/css/mdh-navigation.css?v=support2"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=support2"></script><style>*{box-sizing:border-box}body{margin:0;background:#020d12;color:#effff7;font-family:Inter,system-ui,sans-serif;padding:16px 13px 95px}.page{max-width:720px;margin:auto}.head{display:flex;align-items:center;gap:11px;margin-bottom:14px}.back{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:#062a25;color:#19e889;text-decoration:none;border:1px solid #19e88933;font-size:21px}.head h1{margin:0;font-size:24px}.head p{margin:3px 0 0;color:#8eafa4;font-size:11px}.hero,.chat-card{background:linear-gradient(145deg,#07372fbb,#041d20cc);border:1px solid #19e8892e;border-radius:21px;box-shadow:0 18px 45px #0007;backdrop-filter:blur(18px)}.hero{padding:19px;margin-bottom:12px}.hero small{color:#19e889;font-weight:900;letter-spacing:.12em}.hero h2{margin:7px 0 4px;font-size:20px}.hero p{margin:0;color:#8eaaa1;font-size:12px;line-height:1.55}.chat-card{overflow:hidden}.chat{height:55vh;min-height:390px;overflow:auto;padding:15px}.empty{text-align:center;color:#79968d;padding:70px 20px;font-size:12px}.msg{max-width:82%;padding:12px 13px;border-radius:17px;margin:0 0 10px;font-size:12px;line-height:1.55}.mine{margin-left:auto;background:#19e889;color:#02170d;border-bottom-right-radius:5px}.reply{margin-right:auto;background:#092b27;color:#eafff5;border:1px solid #19e88920;border-bottom-left-radius:5px}.time{display:block;margin-top:7px;font-size:9px;opacity:.65;text-align:right}.composer{display:flex;gap:8px;padding:11px;border-top:1px solid #19e88920;background:#031714}.composer input{min-width:0;flex:1;background:#06251f;color:#fff;border:1px solid #19e88922;border-radius:14px;padding:13px;outline:none}.composer button{width:72px;border:0;border-radius:14px;background:#19e889;color:#02170d;font-weight:900}.composer button:disabled{opacity:.5}.quick{display:flex;gap:7px;padding:11px 11px 0;overflow:auto}.quick button{white-space:nowrap;background:#19e88910;border:1px solid #19e88922;color:#9decca;border-radius:999px;padding:8px 11px;font-size:10px}.status{display:flex;align-items:center;gap:7px;margin-top:10px;color:#8eaaa1;font-size:10px}.dot{width:7px;height:7px;border-radius:50%;background:#19e889;box-shadow:0 0 10px #19e889}</style></head><body><canvas id="network" style="position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none"></canvas><main class="page"><header class="head"><a class="back" href="dashboard.html">←</a><div><h1>Support Centre</h1><p>Marathon Digital Hub customer care</p></div></header><section class="hero"><small>MDH SUPPORT</small><h2>How can we help?</h2><p>Send us a message about your account, deposits, withdrawals, machines, referrals or anything you need help with.</p><div class="status"><i class="dot"></i> Support channel available</div></section><section class="chat-card"><div class="quick"><button data-text="I need help with my deposit">Deposit help</button><button data-text="I need help with a withdrawal">Withdrawal</button><button data-text="I need help with my machine">Machine help</button><button data-text="I need help with my referral">Referral</button></div><div id="chat" class="chat"><div class="empty">Connecting to your support conversation...</div></div><form id="form" class="composer"><input id="input" autocomplete="off" placeholder="Type your message..."><button id="send">Send</button></form></section></main><script src="assets/js/network.js?v=support2"></script><script src="assets/js/mdh-navigation.js?v=support2"></script><script>const db=window.supabaseClient,$=id=>document.getElementById(id);let uid=null;function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function render(rows){const c=$('chat');if(!rows?.length){c.innerHTML='<div class="empty">No conversation yet.<br>Send your first message to Marathon Digital Hub support.</div>';return}c.innerHTML=rows.map(x=>{let h='<div class="msg mine">'+esc(x.message)+'<span class="time">'+new Date(x.created_at).toLocaleString()+'</span></div>';if(x.admin_reply)h+='<div class="msg reply">'+esc(x.admin_reply)+'<span class="time">'+new Date(x.created_at).toLocaleString()+'</span></div>';return h}).join('');c.scrollTop=c.scrollHeight}async function load(){if(!db)return;const s=await db.auth.getUser();uid=s.data.user?.id;if(!uid){location.href='login.html';return}const r=await db.from('support_messages').select('*').eq('user_id',uid).order('created_at',{ascending:true});if(r.error){$('chat').innerHTML='<div class="empty">Support is temporarily unavailable. Please try again.</div>';return}render(r.data)}$('form').onsubmit=async e=>{e.preventDefault();const text=$('input').value.trim();if(!text||!uid)return;$('send').disabled=true;$('send').textContent='...';const r=await db.from('support_messages').insert({user_id:uid,message:text,status:'open'});$('send').disabled=false;$('send').textContent='Send';if(r.error){alert(r.error.message);return}$('input').value='';load()};document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{$('input').value=b.dataset.text;$('input').focus()});load();setInterval(load,7000);</script></body></html>

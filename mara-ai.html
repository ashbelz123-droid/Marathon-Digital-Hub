<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031017"><title>Mara AI | Marathon Digital Hub</title><link rel="stylesheet" href="assets/css/mdh-ui.css"><link rel="stylesheet" href="assets/css/mdh-navigation.css"><style>*{box-sizing:border-box}body{margin:0;background:#020d12;color:#ecfff7;font-family:Inter,system-ui,sans-serif}.page{max-width:900px;margin:auto;padding:18px 14px 105px}.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.avatar{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#24ef99,#087b55);font-weight:1000;color:#03150e;box-shadow:0 0 28px rgba(25,232,137,.25)}h1{font-size:22px;margin:0}.sub{font-size:11px;color:#8fb7aa;margin-top:3px}.status{margin-left:auto;color:#39f4a0;font-size:10px}.chat{min-height:55vh;border:1px solid rgba(112,255,203,.18);border-radius:24px;background:rgba(8,43,42,.38);backdrop-filter:blur(15px);padding:14px;overflow:auto}.msg{max-width:86%;padding:12px 14px;border-radius:17px;margin:8px 0;font-size:12px;line-height:1.55}.mara{background:rgba(25,232,137,.10);border:1px solid rgba(25,232,137,.16)}.user{margin-left:auto;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}.quick{display:flex;gap:7px;overflow:auto;margin:12px 0}.quick button{white-space:nowrap;border:1px solid rgba(112,255,203,.18);background:rgba(12,67,57,.45);color:#cffff0;border-radius:999px;padding:9px 12px;font-size:10px}.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1;min-width:0;border:1px solid rgba(112,255,203,.18);border-radius:16px;background:rgba(4,28,30,.75);color:white;padding:14px;outline:none}.composer button{width:50px;border:0;border-radius:15px;background:#19e889;color:#03150e;font-weight:900}.disclaimer{font-size:9px;color:#688f84;text-align:center;margin-top:9px}</style></head><body><main class="page"><header class="head"><div class="avatar">M</div><div><h1>Mara AI</h1><div class="sub">Your Marathon Digital Hub assistant</div></div><div class="status">● ONLINE</div></header><section id="chat" class="chat"><div class="msg mara"><b>Hi, I'm Mara 👋</b><br>I can help you understand your MDH dashboard, machines, earnings, referrals and live crypto market data.</div></section><div class="quick"><button onclick="ask('Explain my mining performance')">Mining performance</button><button onclick="ask('What is Bitcoin doing now?')">Bitcoin</button><button onclick="ask('How do I use my machines?')">Machines</button><button onclick="ask('Show me useful dashboard actions')">Dashboard help</button></div><form id="form" class="composer"><input id="input" autocomplete="off" placeholder="Ask Mara anything about MDH..."><button>➤</button></form><div class="disclaimer">Mara provides informational guidance and does not change balances, investments or withdrawals.</div></main><script>const chat=document.getElementById('chat'),input=document.getElementById('input');function add(text,type){const d=document.createElement('div');d.className='msg '+type;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function answer(q){add(q,'user');input.value='';const l=q.toLowerCase();let a='I can help with Marathon Digital Hub. Try asking about your machines, earnings, referrals, notifications or the live crypto market.';if(l.includes('bitcoin')||l.includes('btc')){try{const r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');const d=await r.json();a='Bitcoin is currently around $'+Number(d.price).toLocaleString()+'. For trading decisions, always verify the market yourself.'}catch(e){a='I could not reach the live Bitcoin feed right now.'}}else if(l.includes('machine'))a='Open Machines to see your available mining machines, prices, status and mining details.';else if(l.includes('performance')||l.includes('earning'))a='Your dashboard is the source of truth for account performance. Once the real Supabase data connections are finished, I can summarize your active machines, invested amount and profit from those records.';else if(l.includes('notification'))a='Open Notifications to see your real unread messages. The bell count only represents unread records.';add(a,'mara')}function ask(q){answer(q)}document.getElementById('form').onsubmit=e=>{e.preventDefault();if(input.value.trim())answer(input.value.trim())}</script></body></html>

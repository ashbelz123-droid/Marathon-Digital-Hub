<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06130f">
<title>Referrals | Marathon Digital Hub</title>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>
<main>
<header class="header fade-in">
<p style="color:var(--primary);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase">Marathon Digital Hub</p>
<h1>Referral Centre</h1>
<p style="color:var(--muted);margin-top:8px">Invite your team and track referral activity.</p>
</header>
<section class="card fade-in">
<h2>Your Referral Link</h2>
<div class="input-group" style="margin-top:14px"><label for="referralLink">Referral link</label><input id="referralLink" type="text" readonly placeholder="Loading..."></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button id="copyReferral" class="btn">Copy</button><button id="shareReferral" class="btn btn-success">Share</button></div>
</section>
<section class="stats-grid fade-in">
<div class="stat-card"><p>Total Referrals</p><h2 id="totalReferrals">0</h2></div>
<div class="stat-card"><p>Active Referrals</p><h2 id="activeReferrals">0</h2></div>
<div class="stat-card"><p>Referral Income</p><h2 id="referralIncome">UGX 0</h2></div>
<div class="stat-card"><p>Raffle Chances</p><h2 id="raffleChances">0</h2></div>
</section>
<section class="card fade-in"><h2>My Referrals <span class="badge badge-success" id="referralCount">0</span></h2><div id="referralList" style="margin-top:15px"><div class="loader"></div></div></section>
<section class="card fade-in"><h2>Referral Leaderboard</h2><div id="leaderboard" style="margin-top:15px"><div class="loader"></div></div></section>
</main>
<nav class="bottom-nav"><a href="dashboard.html">🏠<br>Home</a><a href="machines.html">⚙️<br>Machines</a><a href="deposit.html">💳<br>Deposit</a><a href="income.html">📈<br>Income</a><a href="profile.html">👤<br>Profile</a></nav>
<script src="referral.js"></script>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machines | MDH Admin</title><link rel="stylesheet" href="admin-shared.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><main class="admin-wrap"><header class="admin-head"><div><div class="eyebrow">OPERATIONS</div><h1>Machines</h1><p>Monitor the real machine catalogue.</p></div><a class="back" href="admin-control.html">← Control Center</a></header><section class="panel"><div id="list" class="empty">Loading machines…</div></section></main><script>const db=window.supabaseClient;async function load(){const l=document.getElementById('list');try{const{data,error}=await db.from('machines').select('*').order('id',{ascending:false});if(error)throw error;l.innerHTML=data?.length?data.map(x=>`<div class="row"><main><h3>${x.name||'Machine'}</h3><p>${x.series||'Standard'} • Price: UGX ${Number(x.price||0).toLocaleString()} • Return: UGX ${Number(x.total_return||0).toLocaleString()}</p></main><span class="badge">${x.status===false?'DISABLED':'ACTIVE'}</span></div>`).join(''):'<div class="empty">No machines found.</div>'}catch(e){console.error(e);l.innerHTML='<div class="empty">Machine data unavailable.</div>'}}load();</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06131f"><title>Set New Password | MDH</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><link rel="stylesheet" href="assets/css/mdh-ui.css"><style>body{margin:0;min-height:100vh;background:#06131f;color:#effff7;display:grid;place-items:center;padding:20px;font-family:Inter,system-ui}.card{width:min(430px,100%);padding:28px 22px;border-radius:28px;background:rgba(8,34,42,.82);border:1px solid rgba(25,232,137,.2);backdrop-filter:blur(18px);box-shadow:0 25px 70px #0008}h1{margin:0 0 8px;font-size:25px}p{color:#91afa5;font-size:13px;line-height:1.5}.input{width:100%;box-sizing:border-box;padding:15px;border-radius:14px;border:1px solid #ffffff16;background:#0004;color:#fff;outline:none;margin:9px 0}button{width:100%;padding:15px;border:0;border-radius:14px;background:#19e889;color:#03150e;font-weight:900;margin-top:8px}.msg{text-align:center;margin-top:12px;font-size:12px}.error{color:#ff687a}.success{color:#63f5a5}</style></head><body><main class="card"><h1>Create a new password</h1><p>Choose a strong password for your Marathon Digital Hub account.</p><input class="input" id="password" type="password" autocomplete="new-password" placeholder="New password"><input class="input" id="confirm" type="password" autocomplete="new-password" placeholder="Confirm new password"><button id="save">UPDATE PASSWORD</button><div id="msg" class="msg"></div></main><script>const msg=document.getElementById('msg');supabaseClient.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')document.getElementById('save').disabled=false});document.getElementById('save').onclick=async()=>{const p=document.getElementById('password').value,c=document.getElementById('confirm').value;msg.className='msg';msg.textContent='';if(p.length<6){msg.classList.add('error');msg.textContent='Password must be at least 6 characters.';return}if(p!==c){msg.classList.add('error');msg.textContent='Passwords do not match.';return}try{const{error}=await supabaseClient.auth.updateUser({password:p});if(error)throw error;msg.classList.add('success');msg.textContent='Password updated successfully. Redirecting…';setTimeout(()=>location.href='login.html',1500)}catch(e){msg.classList.add('error');msg.textContent=e.message}}</script></body></html>

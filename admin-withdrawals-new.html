<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdrawals | MDH Admin</title><link rel="stylesheet" href="admin-shared.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><main class="admin-wrap"><header class="admin-head"><div><div class="eyebrow">FINANCE</div><h1>Withdrawals</h1><p>Review real withdrawal requests.</p></div><a class="back" href="admin-finance.html">← Finance</a></header><section class="panel"><div id="list" class="empty">Loading withdrawals…</div></section></main><script>const db=window.supabaseClient;async function load(){try{const{data,error}=await db.from('withdrawals').select('*').order('created_at',{ascending:false}).limit(100);if(error)throw error;document.getElementById('list').className='';document.getElementById('list').innerHTML=data?.length?data.map(x=>`<div class="row"><main><h3>${x.amount?'UGX '+Number(x.amount).toLocaleString():'Withdrawal'}</h3><p>${x.status||'Pending'} • ${x.created_at?new Date(x.created_at).toLocaleString():''}</p></main><span class="badge">${x.status||'PENDING'}</span></div>`).join(''):'<div class="empty">No withdrawal records.</div>'}catch(e){console.error(e);document.getElementById('list').innerHTML='<div class="empty">Withdrawals table unavailable.</div>'}}load();</script></body></html>

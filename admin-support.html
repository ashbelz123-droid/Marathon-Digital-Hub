<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin Support</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050B18;
color:#fff;
}

.header{
position:sticky;
top:0;
z-index:100;
background:#08142d;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h2{
font-size:28px;
}

.counter{
background:#00ff88;
color:#001018;
padding:6px 12px;
border-radius:20px;
font-weight:bold;
}

.searchBox{
padding:15px;
background:#050B18;
}

.searchBox input{
width:100%;
height:52px;
border:none;
outline:none;
background:#111f3d;
border-radius:30px;
padding:0 20px;
color:#fff;
font-size:16px;
}

.filters{
display:flex;
gap:10px;
padding:0 15px 15px;
overflow-x:auto;
}

.filters button{
border:none;
padding:10px 18px;
border-radius:20px;
background:#111f3d;
color:white;
cursor:pointer;
white-space:nowrap;
}

.filters button.active{
background:#00ff88;
color:#001018;
font-weight:bold;
}

.ticketList{
padding-bottom:100px;
}

.ticket{
display:flex;
align-items:center;
padding:15px;
border-bottom:1px solid rgba(255,255,255,.06);
cursor:pointer;
}

.ticket:hover{
background:#08142d;
}

.avatar{
width:55px;
height:55px;
border-radius:50%;
background:#00ff88;
color:#001018;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:bold;
margin-right:15px;
}

.info{
flex:1;
}

.info h3{
font-size:17px;
margin-bottom:5px;
}

.info p{
font-size:14px;
color:#9fb5d1;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.right{
text-align:right;
}

.time{
font-size:12px;
color:#9fb5d1;
margin-bottom:8px;
}

.badge{
background:#00ff88;
color:#001018;
padding:4px 8px;
border-radius:15px;
font-size:11px;
font-weight:bold;
display:inline-block;
}

.empty{
padding:40px;
text-align:center;
color:#9fb5d1;
}

</style>

</head>

<body>

<div class="header">

<h2>Support</h2>

<div class="counter" id="ticketCounter">
0
</div>

</div>

<div class="searchBox">

<input
type="text"
id="searchInput"
placeholder="Search conversations...">

</div>

<div class="filters">

<button class="active" id="allBtn">
All
</button>

<button id="openBtn">
Open
</button>

<button id="closedBtn">
Closed
</button>

</div>

<div
class="ticketList"
id="ticketList">

<div class="empty">

Loading conversations...

</div>

    </div><script>

const db = window.supabaseClient;

let allTickets = [];
let currentFilter = "all";

/* ==========================
LOAD TICKETS
========================== */

document.addEventListener("DOMContentLoaded", () => {

    loadTickets();

});

async function loadTickets(){

    const { data, error } = await db

    .from("support_messages")

    .select("*")

    .order("created_at",{ascending:false});

    if(error){

        console.log(error);

        document.getElementById("ticketList").innerHTML=

        "<div class='empty'>Failed to load tickets.</div>";

        return;

    }

    allTickets=data;

    document.getElementById("ticketCounter").innerHTML=data.length;

    renderTickets(data);

}

/* ==========================
RENDER TICKETS
========================== */

function renderTickets(rows){

    const list=document.getElementById("ticketList");

    list.innerHTML="";

    if(rows.length===0){

        list.innerHTML="<div class='empty'>No conversations found.</div>";

        return;

    }

    rows.forEach(ticket=>{

        const avatar=ticket.user_id.substring(0,1).toUpperCase();

        const time=new Date(ticket.created_at)

        .toLocaleString();

        list.innerHTML+=`

        <div class="ticket"

        onclick="openTicket('${ticket.id}')">

            <div class="avatar">

                ${avatar}

            </div>

            <div class="info">

                <h3>

                    Ticket #${ticket.id.substring(0,8)}

                </h3>

                <p>

                    ${ticket.message}

                </p>

            </div>

            <div class="right">

                <div class="time">

                    ${time}

                </div>

                ${ticket.status==="open"

                ?'<div class="badge">NEW</div>'

                :''}

            </div>

        </div>

        `;

    });

}

    </script><script>

/* ==========================
SEARCH
========================== */

document.getElementById("searchInput")

.addEventListener("keyup",function(){

const value=this.value.toLowerCase();

const filtered=allTickets.filter(ticket=>{

return(

(ticket.message || "")

.toLowerCase()

.includes(value)

||

(ticket.user_id || "")

.toLowerCase()

.includes(value)

);

});

renderTickets(filtered);

});

/* ==========================
FILTER BUTTONS
========================== */

document.getElementById("allBtn")

.onclick=function(){

currentFilter="all";

setActive(this);

renderTickets(allTickets);

};

document.getElementById("openBtn")

.onclick=function(){

currentFilter="open";

setActive(this);

renderTickets(

allTickets.filter(

t=>t.status==="open"

)

);

};

document.getElementById("closedBtn")

.onclick=function(){

currentFilter="closed";

setActive(this);

renderTickets(

allTickets.filter(

t=>t.status==="closed"

)

);

};

/* ==========================
ACTIVE BUTTON
========================== */

function setActive(btn){

document

.querySelectorAll(".filters button")

.forEach(button=>{

button.classList.remove("active");

});

btn.classList.add("active");

}

/* ==========================
OPEN TICKET
========================== */

function openTicket(ticketId){

localStorage.setItem(

"selectedTicket",

ticketId

);

window.location.href=

"admin-chat.html";

}

    </script><script>

/* ==========================
AUTO REFRESH EVERY 30 SECONDS
========================== */

setInterval(()=>{

loadTickets();

},30000);

/* ==========================
REFRESH AFTER TAB IS ACTIVE
========================== */

document.addEventListener("visibilitychange",()=>{

if(!document.hidden){

loadTickets();

}

});

/* ==========================
READY
========================== */

console.log("Support Center Ready");

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Support Chats</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050B18;
color:white;

}

.header{

padding:20px;
font-size:34px;
font-weight:bold;

}

.search{

padding:0 20px 20px;

}

.search input{

width:100%;
height:55px;
background:#111f3d;
border:none;
outline:none;
border-radius:30px;
padding:0 20px;
color:white;
font-size:16px;

}

.chatList{

padding-bottom:80px;

}

.chat{

display:flex;
align-items:center;
padding:15px 20px;
border-bottom:1px solid rgba(255,255,255,.05);
cursor:pointer;

}

.chat:hover{

background:#08142d;

}

.avatar{

width:60px;
height:60px;
border-radius:50%;
background:#00ff88;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
font-weight:bold;
color:#001018;
margin-right:15px;

}

.details{

flex:1;

}

.details h3{

font-size:18px;
margin-bottom:6px;

}

.details p{

color:#9fb5d1;
font-size:14px;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;

}

.right{

text-align:right;

}

.time{

font-size:13px;
color:#9fb5d1;
margin-bottom:8px;

}

.badge{

display:inline-flex;
align-items:center;
justify-content:center;
width:24px;
height:24px;
background:#00ff88;
color:#001018;
border-radius:50%;
font-size:12px;
font-weight:bold;

}

</style>

</head>

<body>

<div class="header">

Support Chats

</div>

<div class="search">

<input
type="text"
id="searchUser"
placeholder="Search...">

</div>

<div

class="chatList"

id="chatList">

<!-- Chats load here -->

</div><script>

const db = window.supabaseClient;

let chats=[];

document.addEventListener("DOMContentLoaded",()=>{

loadChats();

});

/* ==========================
LOAD CHATS
========================== */

async function loadChats(){

const list=document.getElementById("chatList");

list.innerHTML="<center style='padding:20px;'>Loading...</center>";

const {data,error}=await db

.from("support_messages")

.select(`
id,
user_id,
message,
status,
created_at,
profiles(
fullname
)
`)
.order("created_at",{ascending:false});

if(error){

console.log(error);

list.innerHTML="<center style='padding:20px;'>Failed to load chats.</center>";

return;

}

chats=data;

renderChats(chats);

}

/* ==========================
RENDER CHAT LIST
========================== */

function renderChats(data){

const list=document.getElementById("chatList");

list.innerHTML="";

if(data.length===0){

list.innerHTML="<center style='padding:30px;'>No chats available.</center>";

return;

}

data.forEach(chat=>{

const firstLetter=

(chat.profiles?.fullname || "U")

.charAt(0)

.toUpperCase();

const time=new Date(chat.created_at)

.toLocaleTimeString([],{

hour:"2-digit",

minute:"2-digit"

});

list.innerHTML+=`

<div class="chat"

onclick="openConversation('${chat.id}')">

<div class="avatar">

${firstLetter}

</div>

<div class="details">

<h3>

${chat.profiles?.fullname || "Unknown User"}

</h3>

<p>

${chat.message}

</p>

</div>

<div class="right">

<div class="time">

${time}

</div>

${
chat.status==="open"

?

'<div class="badge">New</div>'

:

''

}

</div>

</div>

`;

});

}

/* ==========================
SEARCH
========================== */

document

.getElementById("searchUser")

.addEventListener("keyup",function(){

const value=this.value.toLowerCase();

const filtered=chats.filter(chat=>

(chat.profiles?.fullname || "")

.toLowerCase()

.includes(value)

||

(chat.message || "")

.toLowerCase()

.includes(value)

);

renderChats(filtered);

});

  </script><script>

/* ==========================
OPEN CONVERSATION
========================== */

function openConversation(chatId){

localStorage.setItem("selectedSupportChat",chatId);

window.location.href="admin-chat.html";

}

</script>

<style>

body{

.footer{

.footer input{

flex:1;

outline:none;

</style>

</head>

<body>

<div

class="header"

id="chatName">

Loading...

</div>

<div

class="messages"

id="messages">

</div>

<div class="footer">

<input

id="reply"

placeholder="Type reply...">

<button

onclick="sendReply()">

Send

</button>

</div>

<script>

const db=window.supabaseClient;

const chatId=

localStorage.getItem("selectedSupportChat");

loadConversation();

async function loadConversation(){

const {data}=await db

.from("support_messages")

.select(`
*,
profiles(fullname)
`)

.eq("id",chatId)

.single();

document.getElementById("chatName").innerHTML=

data.profiles.fullname;

document.getElementById("messages").innerHTML=`

<div class="user">

${data.message}

</div>

${data.admin_reply ?

`<div class="admin">

${data.admin_reply}

</div>`

:""}

`;

}

</script>

</body>

  </html>

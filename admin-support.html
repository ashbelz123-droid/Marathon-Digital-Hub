<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Support Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050B18;
color:white;
display:flex;
flex-direction:column;
height:100vh;

}

/* Header */

.header{

height:70px;
background:#08142d;
display:flex;
align-items:center;
padding:15px;

}

.back{

font-size:24px;
cursor:pointer;
margin-right:15px;

}

.avatar{

width:45px;
height:45px;
border-radius:50%;
background:#00ff88;
color:#001018;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
margin-right:12px;

}

.userInfo h3{

font-size:18px;

}

.userInfo p{

font-size:13px;
color:#9fb5d1;

}

/* Messages */

.messages{

flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:12px;

}

.userMessage{

align-self:flex-start;
background:#111f3d;
padding:12px;
border-radius:15px;
max-width:80%;

}

.adminMessage{

align-self:flex-end;
background:#00ff88;
color:#001018;
padding:12px;
border-radius:15px;
max-width:80%;

}

/* Bottom */

.footer{

background:#08142d;
padding:10px;
display:flex;
gap:10px;

}

.footer input{

flex:1;
height:50px;
border:none;
outline:none;
border-radius:25px;
padding:0 18px;
background:#111f3d;
color:white;

}

.footer button{

width:90px;
border:none;
border-radius:25px;
background:#00ff88;
color:#001018;
font-weight:bold;
cursor:pointer;

}

</style>

</head>

<body>

<div class="header">

<div class="back"
onclick="history.back()">

←

</div>

<div class="avatar"
id="avatar">

U

</div>

<div class="userInfo">

<h3 id="userName">

Loading...

</h3>

<p>

Support Conversation

</p>

</div>

</div>

<div
class="messages"
id="messages">

</div>

<div class="footer">

<input
type="text"
id="reply"
placeholder="Type your reply...">

<button
onclick="sendReply()">

Send

</button>

</div><script>

const db = window.supabaseClient;

const userId = localStorage.getItem("support_user");

/* ==========================
LOAD CHAT
========================== */

document.addEventListener("DOMContentLoaded", () => {
    loadChat();
});

async function loadChat(){

    if(!userId){
        alert("No user selected.");
        history.back();
        return;
    }

    const { data, error } = await db
    .from("support_messages")
    .select(`
        id,
        user_id,
        message,
        admin_reply,
        created_at,
        profiles(fullname)
    `)
    .eq("user_id", userId)
    .order("created_at",{ascending:true});

    if(error){
        console.log(error);
        return;
    }

    if(data.length===0){
        return;
    }

    document.getElementById("userName").innerText =
        data[0].profiles?.fullname || "Unknown User";

    document.getElementById("avatar").innerText =
        (data[0].profiles?.fullname || "U")
        .charAt(0)
        .toUpperCase();

    const box = document.getElementById("messages");

    box.innerHTML="";

    data.forEach(chat=>{

        box.innerHTML += `
            <div class="userMessage">
                ${chat.message}
            </div>
        `;

        if(chat.admin_reply){

            box.innerHTML += `
                <div class="adminMessage">
                    ${chat.admin_reply}
                </div>
            `;

        }

    });

    box.scrollTop = box.scrollHeight;

}

  </script><script>

/* ==========================
SEND REPLY
========================== */

async function sendReply(){

const reply=document.getElementById("reply").value.trim();

if(reply===""){

alert("Type a reply first.");

return;

}

/* Get latest open support message */

const {data,error}=await db

.from("support_messages")

.select("*")

.eq("user_id",userId)

.order("created_at",{ascending:false})

.limit(1)

.single();

if(error){

console.log(error);

return;

}

/* Save admin reply */

const {error:updateError}=await db

.from("support_messages")

.update({

admin_reply:reply,

status:"closed"

})

.eq("id",data.id);

if(updateError){

alert("Failed to send reply.");

console.log(updateError);

return;

}

/* Notify user */

await db

.from("user_notifications")

.insert({

user_id:userId,

title:"Support Reply",

message:reply,

type:"support",

is_read:false

});

/* Clear input */

document.getElementById("reply").value="";

/* Reload conversation */

loadChat();

}

</script>

</body>

</html>

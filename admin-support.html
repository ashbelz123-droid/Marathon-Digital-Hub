<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Support Chats</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#050B18;
color:white;

}

.header{

padding:20px;
display:flex;
justify-content:space-between;
align-items:center;

}

.header h1{

font-size:34px;

}

.menu{

font-size:28px;
cursor:pointer;

}

.searchBox{

padding:0 20px 20px;

}

.searchBox input{

width:100%;
height:55px;
border:none;
outline:none;
background:#111f3d;
border-radius:30px;
padding:0 20px;
color:white;
font-size:16px;

}

.chatList{

padding-bottom:120px;

}

.chatCard{

display:flex;
align-items:center;
padding:15px 20px;
cursor:pointer;
transition:.2s;
border-bottom:1px solid rgba(255,255,255,.05);

}

.chatCard:hover{

background:#08142d;

}

.avatar{

width:58px;
height:58px;
border-radius:50%;
background:#00ff88;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:bold;
color:#001018;
margin-right:15px;

}

.chatBody{

flex:1;

}

.chatName{

font-size:18px;
font-weight:bold;

}

.lastMessage{

margin-top:5px;
font-size:14px;
color:#9fb5d1;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;

}

.chatRight{

text-align:right;

}

.chatTime{

font-size:13px;
color:#9fb5d1;
margin-bottom:8px;

}

.unread{

min-width:24px;
height:24px;
background:#00ff88;
color:#001018;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:12px;
font-weight:bold;
margin-left:auto;

}

.empty{

padding:60px 20px;
text-align:center;
color:#9fb5d1;

}

</style>

</head>

<body>

<div class="header">

<h1>Support</h1>

<div class="menu">

⋮

</div>

</div>

<div class="searchBox">

<input

type="text"

id="search"

placeholder="Search user...">

</div>

<div

class="chatList"

id="chatList">

<div class="empty">

Loading conversations...

</div>

  </div><script>

const db = window.supabaseClient;

let conversations=[];

/* ==========================
LOAD CHATS
========================== */

document.addEventListener("DOMContentLoaded",()=>{

loadChats();

});

async function loadChats(){

const list=document.getElementById("chatList");

const {data,error}=await db

.from("support_messages")

.select(`
id,
user_id,
message,
status,
created_at,
profiles(
fullname
)
`)

.order("created_at",{ascending:false});

if(error){

console.log(error);

list.innerHTML="<div class='empty'>Failed to load conversations.</div>";

return;

}

/* ONE CHAT PER USER */

const unique={};

data.forEach(item=>{

if(!unique[item.user_id]){

unique[item.user_id]=item;

}

});

conversations=Object.values(unique);

renderChats(conversations);

}

/* ==========================
SHOW CHATS
========================== */

function renderChats(rows){

const list=document.getElementById("chatList");

list.innerHTML="";

if(rows.length===0){

list.innerHTML="<div class='empty'>No conversations found.</div>";

return;

}

rows.forEach(chat=>{

const first=

(chat.profiles?.fullname || "U")

.charAt(0)

.toUpperCase();

const time=

new Date(chat.created_at)

.toLocaleTimeString([],{

hour:"2-digit",

minute:"2-digit"

});

list.innerHTML+=`

<div class="chatCard"

onclick="openChat('${chat.user_id}')">

<div class="avatar">

${first}

</div>

<div class="chatBody">

<div class="chatName">

${chat.profiles?.fullname || "Unknown User"}

</div>

<div class="lastMessage">

${chat.message}

</div>

</div>

<div class="chatRight">

<div class="chatTime">

${time}

</div>

${chat.status==="open"

?'<div class="unread">1</div>'

:''}

</div>

</div>

`;

});

}

/* ==========================
SEARCH
========================== */

document

.getElementById("search")

.addEventListener("keyup",function(){

const value=this.value.toLowerCase();

const filtered=conversations.filter(chat=>

(chat.profiles?.fullname || "")

.toLowerCase()

.includes(value)

||

(chat.message || "")

.toLowerCase()

.includes(value)

);

renderChats(filtered);

});

/* ==========================
OPEN CHAT
========================== */

function openChat(userId){

localStorage.setItem("support_user",userId);

window.location.href="admin-chat.html";

}

  </script><!-- Add before </body> -->

<script>

const db = window.supabaseClient;

let selectedChat = null;

/* Open Chat */

async function openChat(chatId){

selectedChat = chatId;

const { data, error } = await db
.from("support_messages")
.select("*")
.eq("id", chatId)
.single();

if(error){
console.log(error);
return;
}

const reply = prompt(
"User Message:\n\n" +
data.message +
"\n\nType your reply:"
);

if(reply==null || reply.trim()==""){
return;
}

/* Save Reply */

const { error:updateError } = await db
.from("support_messages")
.update({
admin_reply: reply,
status:"closed"
})
.eq("id",chatId);

if(updateError){

alert("Failed to send reply.");

console.log(updateError);

return;

}

/* Notify User */

await db
.from("user_notifications")
.insert({

user_id:data.user_id,

title:"Support Reply",

message:reply,

type:"support"

});

/* Refresh */

alert("Reply sent successfully.");

loadChats();

}

</script>

</body>

</html>

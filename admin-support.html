<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020d12"><title>Support | Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#020d12;color:#effff7;font-family:Inter,system-ui,sans-serif}.page{max-width:980px;margin:auto;padding:18px 14px 100px}.hero{background:linear-gradient(145deg,#07372f,#041d20);border:1px solid #19e88933;border-radius:24px;padding:20px;box-shadow:0 18px 45px #0008}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#19e889;font-weight:900}.heroRow{display:flex;align-items:center;justify-content:space-between;gap:15px}.hero h1{font-size:28px;margin:7px 0}.hero p{color:#8eaaa1;font-size:12px;margin:0}.count{background:#19e889;color:#02170d;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:900}.tools{margin-top:13px;display:flex;gap:8px}.search{flex:1;background:#061c18;border:1px solid #19e88922;border-radius:15px;color:#fff;padding:13px 15px;outline:none}.search:focus{border-color:#19e88977}.refresh{border:1px solid #19e88933;background:#0a2b25;color:#19e889;border-radius:15px;padding:0 15px;font-weight:900}.filters{display:flex;gap:7px;overflow:auto;padding:14px 0 9px}.filters button{white-space:nowrap;border:1px solid #19e88925;background:#09221e;color:#9de0c5;border-radius:999px;padding:9px 14px;font-weight:800;font-size:10px}.filters button.active{background:#19e889;color:#02170d}.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:10px 2px}.sectionTitle h2{margin:0;font-size:18px}.sectionTitle span{color:#78968d;font-size:10px}.conversationList{display:grid;gap:9px}.conversation{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid #19e88922;border-radius:18px;background:linear-gradient(145deg,#09251f,#061613);cursor:pointer;transition:.18s}.conversation:active{transform:scale(.99)}.conversation:hover{border-color:#19e88966}.avatar{width:48px;height:48px;border-radius:15px;background:#0b4939;color:#19e889;display:grid;place-items:center;font-size:18px;font-weight:900;flex:none}.details{min-width:0;flex:1}.name{font-size:13px;font-weight:900;margin:0 0 4px}.preview{font-size:10px;color:#8eaaa1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}.meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}.time{font-size:8px;color:#78968d}.pill{font-size:8px;font-weight:900;padding:5px 8px;border-radius:999px;background:#19e88916;color:#19e889}.pill.unread{background:#19e889;color:#02170d}.empty{text-align:center;color:#78968d;padding:55px 15px;border:1px solid #19e88918;border-radius:18px;background:#061613}.error{color:#ff9c9c}.loading{color:#8eaaa1}.back{display:inline-block;margin-top:12px;color:#19e889;text-decoration:none;font-size:10px;font-weight:900}@media(min-width:700px){.conversationList{grid-template-columns:1fr 1fr}}@media(max-width:520px){.hero h1{font-size:24px}.heroRow{align-items:flex-start}.tools{flex-direction:column}.refresh{height:44px}.conversation{padding:11px}.avatar{width:44px;height:44px}}
</style></head><body><main class="page"><section class="hero"><div class="eyebrow">MARATHON DIGITAL HUB / ADMIN</div><div class="heroRow"><div><h1>Support Centre</h1><p>Manage customer conversations directly, organized user by user.</p></div><div class="count" id="counter">0 users</div></div><div class="tools"><input id="search" class="search" placeholder="Search user name, email, phone or message..."><button id="refresh" class="refresh">↻ Refresh</button></div></section><div class="filters"><button class="active" data-filter="all">All</button><button data-filter="open">Needs reply</button><button data-filter="read">Read</button></div><div class="sectionTitle"><h2>Customer conversations</h2><span id="subcount">Loading…</span></div><section id="list" class="conversationList"><div class="empty loading">Loading conversations…</div></section><a class="back" href="admin-dashboard.html">← Back to Admin Dashboard</a></main><script>(()=>{const db=window.supabaseClient,$=id=>document.getElementById(id);let rows=[],users=[],filter='all';const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function nameOf(p,id){return p?.fullname||p?.full_name||p?.name||('User '+String(id||'').slice(0,6))}function groupRows(data){const map=new Map();for(const r of data){if(!r.user_id)continue;const key=r.user_id;let g=map.get(key);if(!g){g={user_id:key,profile:r.profiles||null,messages:[],latest:r,needs:false}}g.messages.push(r);if(new Date(r.created_at)>new Date(g.latest.created_at))g.latest=r;if(r.status==='open'&&!r.admin_reply)g.needs=true;map.set(key,g)}return [...map.values()].sort((a,b)=>new Date(b.latest.created_at)-new Date(a.latest.created_at))}async function load(){ $('list').innerHTML='<div class="empty loading">Loading conversations…</div>';const r=await db.from('support_messages').select('id,user_id,message,admin_reply,status,created_at,profiles(fullname)').order('created_at',{ascending:false});if(r.error){console.error(r.error);$('list').innerHTML='<div class="empty error">Support could not be loaded.<br><small>'+esc(r.error.message)+'</small></div>';return}rows=r.data||[];users=groupRows(rows);render()}function render(){let q=$('search').value.toLowerCase().trim();let out=users.filter(u=>{const text=(nameOf(u.profile,u.user_id)+' '+u.user_id+' '+u.messages.map(m=>m.message||'').join(' ')).toLowerCase();const matches=!q||text.includes(q);const matchesFilter=filter==='all'||(filter==='open'&&u.needs)||(filter==='read'&&!u.needs);return matches&&matchesFilter});$('counter').textContent=users.length+' users';$('subcount').textContent=out.length+' conversations';if(!out.length){$('list').innerHTML='<div class="empty">No conversations found.</div>';return}$('list').innerHTML=out.map(u=>{const p=u.profile||{};const n=nameOf(p,u.user_id);const latest=u.latest;const unread=u.needs;return '<article class="conversation" onclick="openConversation(\''+esc(u.user_id)+'\')"><div class="avatar">'+esc(n.charAt(0).toUpperCase())+'</div><div class="details"><p class="name">'+esc(n)+'</p><p class="preview">'+esc(latest.message||latest.admin_reply||'No message')+'</p></div><div class="meta"><span class="time">'+new Date(latest.created_at).toLocaleString()+'</span><span class="pill '+(unread?'unread':'')+'">'+(unread?'NEEDS REPLY':u.messages.length+' MESSAGES')+'</span></div></article>'}).join('')}window.openConversation=id=>{localStorage.setItem('selectedSupportUser',id);window.location.href='admin-chat.html'};$('search').addEventListener('input',render);$('refresh').onclick=load;document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});load();setInterval(load,30000)})();</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Machines | MDH Admin</title><link rel="stylesheet" href="admin-shared.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><main class="admin-wrap"><header class="admin-head"><div><div class="eyebrow">INVESTIGATIONS</div><h1>User Machines</h1><p>Check ownership, status and machine-account matches.</p></div><a class="back" href="admin-control.html">← Control Center</a></header><section class="panel"><div id="list" class="empty">Loading user machines…</div></section></main><script>const db=window.supabaseClient;async function load(){const l=document.getElementById('list');try{const{data,error}=await db.from('user_machines').select('*').order('id',{ascending:false}).limit(200);if(error)throw error;l.innerHTML=data?.length?data.map(x=>`<div class="row"><main><h3>User: ${x.user_id||'Unknown'}</h3><p>Machine: ${x.machine_id||'Unknown'} • Status: ${x.status||'Unknown'}</p></main><span class="badge">${x.status||'ACTIVE'}</span></div>`).join(''):'<div class="empty">No user machines found.</div>'}catch(e){console.error(e);l.innerHTML='<div class="empty">User machine data unavailable.</div>'}}load();</script></body></html>

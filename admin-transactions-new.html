<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet & Transactions | MDH Admin</title><link rel="stylesheet" href="admin-shared.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><main class="admin-wrap"><header class="admin-head"><div><div class="eyebrow">FINANCE</div><h1>Wallet & Transactions</h1><p>Read-only financial inspection before controlled admin actions.</p></div><a class="back" href="admin-finance.html">← Finance</a></header><section class="panel"><div id="list" class="empty">Loading transactions…</div></section></main><script>const db=window.supabaseClient;async function load(){const l=document.getElementById('list');try{const{data,error}=await db.from('transactions').select('*').order('created_at',{ascending:false}).limit(200);if(error)throw error;l.innerHTML=data?.length?data.map(x=>`<div class="row"><main><h3>${x.type||x.transaction_type||'Transaction'}</h3><p>User: ${x.user_id||'Unknown'} • ${x.created_at?new Date(x.created_at).toLocaleString():''}</p></main><span class="badge">${x.amount?'UGX '+Number(x.amount).toLocaleString():'—'}</span></div>`).join(''):'<div class="empty">No transactions found.</div>'}catch(e){console.error(e);l.innerHTML='<div class="empty">Transactions table unavailable.</div>'}}load();</script></body></html>
